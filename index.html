</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AREA EF - Admin Ultra Minimal</title>
<script src="https://cdn.tailwindcss.com"></script>

</head><body>
<div id="app"></div>
<script>
const DEFAULT_SYNC_URL='https://script.google.com/macros/s/AKfycbz-Tgif9wJD6PAidITjE3-55BInA4pHZAibDI3mAIYUp_6DQV8may5oJkwyY0nHx4qE/exec';
const FALLBACK_SYNC_URL='https://script.google.com/macros/s/AKfycbzUWTx3o5DjsfrM7JTZBbnYYaMBzFLbH3-mfs0dCFm1uOGouvDqCBpc3KOgNPgKNoHL/exec';
function getSyncUrl(){try{const cs=localStorage.getItem('custom_sync_url'); if(cs&&cs.includes('script.google.com')) return cs;}catch(e){} return DEFAULT_SYNC_URL;}
const ADMIN_PASS_DEFAULT='admin123';
function getAdminPass(){try{const c=localStorage.getItem('custom_admin_pass'); if(c) return c;}catch(e){} return ADMIN_PASS_DEFAULT;}
const TUL_MAP={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};
function calcTUL(j){j=Number(j); if(isNaN(j)||j<=0||j>24) return 0; return TUL_MAP[j]||j*1.5;}
function isJamValid(j){j=Number(j); return !isNaN(j)&&j>0&&j<=24;}
function normNama(n){return String(n||'').trim().toLowerCase();}
// ROBUST TANGGAL - fix data 0 dari 01T00:00:00.000Z-09-2026
function normalizeTanggal(t){
  if(!t) return '';
  let s=String(t).trim();
  // cari dd-MM-yyyy dimana saja
  let m=s.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
  if(m){ let d=m[1].padStart(2,'0'), mo=m[2].padStart(2,'0'), y=m[3]; return y+'-'+mo+'-'+d; }
  m=s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m){ let y=m[1], mo=m[2].padStart(2,'0'), d=m[3].padStart(2,'0'); return y+'-'+mo+'-'+d; }
  let nums=s.match(/\d+/g);
  if(nums&&nums.length>=3&&nums[nums.length-1].length===4){
    let y=nums[nums.length-1], mo=nums[nums.length-2], d=nums[0];
    if(Number(mo)<=12&&Number(d)<=31) return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  }
  try{let dd=new Date(s); if(!isNaN(dd)) return dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0');}catch(e){}
  return s;
}
function formatTanggal(t){let p=normalizeTanggal(t).split('-'); if(p.length===3) return p[2]+'-'+p[1]+'-'+p[0]; return t;}
function parseTglSort(t){ if(!t) return 0; let p=String(t).split(/[-/]/); if(p.length!==3) return 0; let d=Number(p[0]),m=Number(p[1]),y=Number(p[2]); return new Date(y,m-1,d).getTime(); }
const ALIAS_NAMA={'kuncoro budi':'Budi','kuncoro':'Budi','budi kuncoro':'Budi','neli':'Nely','nely':'Nely','annisa':'Anisa','aditya zozo':'Aditya','adit':'Aditya','dozen':'Dozen','supri':'Supriyadi','topik':'Topik','zaelani':'Zaelani','aaf':'Aaf'};
function normalisasiNamaAnggota(nama){if(!nama) return ''; let raw=String(nama).trim(); let key=raw.toLowerCase(); if(ALIAS_NAMA[key]) return ALIAS_NAMA[key]; for(let k in ALIAS_NAMA){ if(key.includes(k)) return ALIAS_NAMA[k]; } return raw.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ').trim();}
const DEFAULT_KARYAWAN_AWAL=[{nama:'Aaf'},{nama:'Aditya'},{nama:'Anah'},{nama:'Anisa'},{nama:'Arief'},{nama:'Budi'},{nama:'Dozen'},{nama:'Eka'},{nama:'Nely'},{nama:'Nia'},{nama:'Putri'},{nama:'Supriyadi'},{nama:'Syarif'},{nama:'Topik'},{nama:'Yudi'},{nama:'Zaelani'}];
function dedupKaryawanList(arr){const map={}; const out=[]; for(let k of arr){ if(!k||!k.nama) continue; let norm=normalisasiNamaAnggota(k.nama); if(!norm) continue; let key=norm.toLowerCase(); if(!map[key]){ map[key]=true; out.push({nama:norm, tglLahir:k.tglLahir||''}); } } return out.sort((a,b)=>a.nama.localeCompare(b.nama));}
function getKaryawanList(){try{const c=localStorage.getItem('custom_karyawan'); if(c){let arr=JSON.parse(c); if(Array.isArray(arr)&&arr.length>0){return dedupKaryawanList(arr);}}}catch{} return dedupKaryawanList(DEFAULT_KARYAWAN_AWAL.slice());}
let DEFAULT_KARYAWAN=getKaryawanList();
function saveKaryawanList(arr){try{let dedup=dedupKaryawanList(arr); localStorage.setItem('custom_karyawan', JSON.stringify(dedup)); DEFAULT_KARYAWAN=dedup;}catch{}}
function getCustomMemberPass(){try{return JSON.parse(localStorage.getItem('custom_member_pass')||'{}')}catch{return{}}}
let allData=[];let isLogin=!!localStorage.getItem('admin_login');let activeTab='history';let filterBulan='all';let pendingMembers=[];let allMembersCache=[];
function toast(m){const t=document.createElement('div');t.className='fixed bottom-6 left-1/2 -translate-x-1/2 bg-black text-white px-5 py-2.5 rounded-full text-[11px] z-50';t.innerText=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500);}
function jsonp(url){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+Math.floor(Math.random()*1000); window[cb]=(d)=>{delete window[cb]; document.getElementById(cb)?.remove(); resolve(d);}; const s=document.createElement('script'); s.id=cb; s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&_='+Date.now()+Math.random(); s.onerror=()=>{delete window[cb]; s.remove(); reject(new Error('Offline'));}; document.body.appendChild(s);});}
async function fetchData(force=false){
  if(force){try{localStorage.removeItem('cache_lembur'); allData=[];}catch{}}
  try{const cc=localStorage.getItem('cache_lembur'); if(cc&&allData.length===0){const j=JSON.parse(cc); allData=j.map(r=>({tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal),nama:r.nama,jam:Number(r.jam||0),tul:calcTUL(Number(r.jam||0))})); render();}}catch{}
  try{
    let j=await jsonp(getSyncUrl()+'?action=read&_nocache='+Date.now()+Math.random());
    if((!j||(Array.isArray(j)&&j.length===0))){ try{const j2=await jsonp(FALLBACK_SYNC_URL+'?action=read&_nocache='+Date.now()+Math.random()); if(Array.isArray(j2)&&j2.length>0){j=j2; try{const items=j2.map(r=>({tanggal:r.tanggal,nama:r.nama,jam:r.jam})); const fd=new FormData(); fd.append('action','addBulk'); fd.append('items',JSON.stringify(items)); fetch(getSyncUrl(),{method:'POST',body:fd});}catch(e){} }}catch(e2){}}
    if(Array.isArray(j)&&j.length>0){
      let raw=j.map(r=>{let jam=Number(r.jam||0); if(!isJamValid(jam)) jam=0; let norm=normalisasiNamaAnggota(r.nama||r.nik||''); return {tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal),nama:norm,jam:jam,tul:calcTUL(jam)};}).filter(x=>x.nama&&x.jam>0);
      const mapDedup={}; const deduped=[]; raw.forEach(r=>{const k=r.tanggalNorm+'|'+normNama(r.nama)+'|'+r.jam; if(!mapDedup[k]){mapDedup[k]=true; deduped.push(r);}}); raw=deduped;
      allData=raw; try{localStorage.setItem('cache_lembur', JSON.stringify(allData));}catch{}
    }
  }catch(e){ console.log(e); }
  allData.sort((a,b)=> parseTglSort(a.tanggalNorm)-parseTglSort(b.tanggalNorm));
  render(); fetchMembers();
}
async function fetchMembers(){try{const res=await jsonp(getSyncUrl()+'?action=listMembers&_='+Date.now()); if(res&&res.members){ allMembersCache=res.members; pendingMembers=res.members.filter(m=> (m.status||'').toLowerCase()==='pending'); render();}}catch(e){}}
function login(){const p=document.getElementById('apass').value; if(p===getAdminPass()){localStorage.setItem('admin_login','1'); isLogin=true; fetchData();} else document.getElementById('aerr').innerText='Password salah';}
function logout(){localStorage.removeItem('admin_login'); isLogin=false; render();}
function filteredData(){ if(filterBulan==='all') return allData; return allData.filter(r=>{const parts=r.tanggalNorm.split('-'); return parts.length===3&&Number(parts[1])===Number(filterBulan);}); }
function groupByKaryawan(data){const m={}; data.forEach(r=>{const k=normNama(r.nama); if(!m[k]) m[k]={nama:r.nama,totalTUL:0,count:0}; m[k].totalTUL+=r.tul; m[k].count+=1;}); return Object.values(m).sort((a,b)=>b.totalTUL-a.totalTUL);}
function groupByTanggal(data){const m={}; data.forEach(r=>{if(!m[r.tanggalNorm]) m[r.tanggalNorm]={tanggal:r.tanggalNorm,rows:[]}; m[r.tanggalNorm].rows.push(r);}); return Object.values(m).sort((a,b)=> new Date(b.tanggal)-new Date(a.tanggal));}
function hapusTanggal(tgl){ if(!confirm('Hapus semua data tgl '+formatTanggal(tgl)+'?')) return; allData=allData.filter(r=>r.tanggalNorm!==tgl); try{localStorage.setItem('cache_lembur', JSON.stringify(allData));}catch{} render(); toast('Menghapus...'); try{ jsonp(getSyncUrl()+'?action=deleteTanggal&tanggal='+encodeURIComponent(tgl.split('-').reverse().join('-'))+'&tanggalISO='+encodeURIComponent(tgl)+'&_='+Date.now()); }catch(e){} setTimeout(()=>fetchData(true),1500); }
function hapusTransaksi(tgl,nama,jam){ if(!confirm('Hapus '+nama+' '+formatTanggal(tgl)+' ('+jam+'j)?')) return; allData=allData.filter(r=>!(r.tanggalNorm===tgl&&normNama(r.nama)===normNama(nama)&&Number(r.jam)===Number(jam))); try{localStorage.setItem('cache_lembur', JSON.stringify(allData));}catch{} render(); toast('Menghapus...'); try{ jsonp(getSyncUrl()+'?action=delete&tanggal='+encodeURIComponent(tgl.split('-').reverse().join('-'))+'&tanggalISO='+encodeURIComponent(tgl)+'&nama='+encodeURIComponent(nama)+'&jam='+encodeURIComponent(jam)+'&_='+Date.now()); }catch(e){} setTimeout(()=>fetchData(true),1500); }

// INPUT
function parsePlan(){
  const txt=(document.getElementById('txtPesan').value||'').trim();
  if(!txt){toast('Tempel pesan dulu'); return;}
  const lines=txt.split('\n');
  let curTanggal=''; let items=[];
  lines.forEach(line=>{
    line=line.trim(); if(!line) return;
    let m=line.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
    if(m){ let d=m[1].padStart(2,'0'), mo=m[2].padStart(2,'0'), y=m[3]; if(y.length===2) y='20'+y; curTanggal=d+'-'+mo+'-'+y; return; }
    let jamMatch=line.match(/(\d{1,2})\s*j/i);
    if(jamMatch&&curTanggal){
      let jam=Number(jamMatch[1]);
      let namaPart=line.replace(/\d+\s*j.*/i,'').replace(/[-–—]/g,' ').trim();
      if(!namaPart) namaPart=line.split(' ')[0];
      let norm=normalisasiNamaAnggota(namaPart);
      if(norm&&isJamValid(jam)){ items.push({tanggal:curTanggal,nama:norm,jam:jam}); }
    }
  });
  const cont=document.getElementById('previewPesan');
  cont.innerHTML=items.length? items.map(it=>'<div class="flex justify-between py-1.5 border-b border-slate-100 text-[11px]"><span>'+formatTanggal(normalizeTanggal(it.tanggal))+' - '+it.nama+'</span><span class="mono">'+it.jam+'j • '+calcTUL(it.jam)+' TUL</span></div>').join('') : '<div class="text-[11px] text-slate-400">Tidak ada data terdeteksi. Format: 18-10-2025 baris baru Budi 6j</div>';
  cont.classList.remove('hidden'); cont._items=items;
}
async function simpanPesan(){
  const cont=document.getElementById('previewPesan'); const items=cont._items||[]; if(!items.length){toast('Preview dulu'); return;}
  toast('⏳ Menyimpan '+items.length+'...');
  try{ const fd=new FormData(); fd.append('action','addBulk'); fd.append('items', JSON.stringify(items)); await fetch(getSyncUrl(),{method:'POST', body:fd}); }catch(e){}
  items.forEach(it=>{ const norm=normalizeTanggal(it.tanggal); allData.push({tanggal:it.tanggal,tanggalNorm:norm,nama:it.nama,jam:it.jam,tul:calcTUL(it.jam)}); });
  try{localStorage.setItem('cache_lembur', JSON.stringify(allData));}catch{}
  document.getElementById('txtPesan').value=''; cont.innerHTML=''; cont.classList.add('hidden'); render(); toast('✅ '+items.length+' disimpan'); setTimeout(()=>fetchData(true),1200);
}
async function simpanManual(){
  const tgl=document.getElementById('manTgl').value.trim();
  const nama=normalisasiNamaAnggota(document.getElementById('manNama').value.trim());
  const jam=Number(document.getElementById('manJam').value);
  if(!tgl||!nama||!isJamValid(jam)){toast('Lengkapi tanggal, nama, jam'); return;}
  const items=[{tanggal:tgl,nama:nama,jam:jam}];
  toast('Menyimpan...'); try{const fd=new FormData(); fd.append('action','addBulk'); fd.append('items',JSON.stringify(items)); await fetch(getSyncUrl(),{method:'POST',body:fd});}catch(e){}
  allData.push({tanggal:tgl,tanggalNorm:normalizeTanggal(tgl),nama:nama,jam:jam,tul:calcTUL(jam)}); try{localStorage.setItem('cache_lembur', JSON.stringify(allData));}catch{} render(); toast('✅ Disimpan'); fetchData(true);
}
async function simpanMassal(){
  const tgl=document.getElementById('massalTgl').value.trim();
  const jam=Number(document.getElementById('massalJam').value);
  const checked=Array.from(document.querySelectorAll('#massalList input:checked')).map(el=>el.value);
  if(!tgl||!isJamValid(jam)||!checked.length){toast('Pilih tanggal, jam, dan anggota'); return;}
  const items=checked.map(n=>({tanggal:tgl,nama:normalisasiNamaAnggota(n),jam:jam}));
  toast('Menyimpan '+items.length+'...'); try{const fd=new FormData(); fd.append('action','addBulk'); fd.append('items',JSON.stringify(items)); await fetch(getSyncUrl(),{method:'POST',body:fd});}catch(e){}
  items.forEach(it=> allData.push({tanggal:it.tanggal,tanggalNorm:normalizeTanggal(it.tanggal),nama:it.nama,jam:it.jam,tul:calcTUL(it.jam)})); try{localStorage.setItem('cache_lembur', JSON.stringify(allData));}catch{} render(); toast('✅ '+items.length+' disimpan'); fetchData(true);
}

// KELOLA ANGGOTA
function tambahAnggota(){const input=document.getElementById('inputNamaBaru'); let nama=normalisasiNamaAnggota(input.value.trim()); if(!nama){toast('Nama kosong'); return;} let list=getKaryawanList(); if(list.find(k=>normNama(k.nama)===normNama(nama))){toast('Sudah ada'); return;} list.push({nama:nama}); saveKaryawanList(list); input.value=''; render(); toast('✅ '+nama+' ditambah');}
function hapusAnggota(nama){if(!confirm('Hapus '+nama+'?')) return; let list=getKaryawanList().filter(k=>normNama(k.nama)!==normNama(nama)); saveKaryawanList(list); render(); toast('Dihapus');}
function resetAllLoginAnggota(){if(!confirm('Reset semua login anggota?')) return; localStorage.removeItem('custom_member_pass'); localStorage.removeItem('custom_member_tgl'); localStorage.removeItem('has_registered'); toast('Login anggota direset'); render();}
function resetDaftarAnggotaAwal(){if(!confirm('Kembalikan daftar anggota ke default?')) return; localStorage.removeItem('custom_karyawan'); DEFAULT_KARYAWAN=getKaryawanList(); render(); toast('Direset');}
async function approveMember(nama){if(!confirm('Approve '+nama+'?')) return; try{await jsonp(getSyncUrl()+'?action=approveMember&nama='+encodeURIComponent(nama)+'&_='+Date.now()); toast('✅ Approved'); fetchMembers();}catch(e){toast('Gagal');}}
async function rejectMember(nama){if(!confirm('Reject '+nama+'?')) return; try{await jsonp(getSyncUrl()+'?action=rejectMember&nama='+encodeURIComponent(nama)+'&_='+Date.now()); toast('Rejected'); fetchMembers();}catch(e){}}

function render(){
  if(!isLogin){
    document.getElementById('app').innerHTML='<div class="min-h-screen grid place-items-center p-6"><div class="w-full max-w-[320px]"><div class="mb-10"><div class="text-[10px] tracking-[0.25em] text-slate-400">AREA EF</div><div class="text-[22px] font-light tracking-tight mt-2">Admin</div><div class="text-[12px] text-slate-400 mt-1">Ultra minimal • Full function</div></div><input id="apass" type="password" placeholder="Password" class="w-full h-[44px] bg-transparent border-b border-slate-200 px-0 text-[14px] focus:border-black focus:outline-none"><div id="aerr" class="text-[11px] text-red-500 mt-3 min-h-[16px]"></div><button onclick="login()" class="w-full h-[44px] bg-black text-white text-[12px] rounded-full mt-6">Masuk</button></div></div>';
    return;
  }
  const data=filteredData(); const groupedTanggal=groupByTanggal(data); const groupedKaryawan=groupByKaryawan(data); const totalTUL=data.reduce((s,r)=>s+r.tul,0);
  let html='';
  html+='<div class="sticky top-0 z-20 bg-white/90 backdrop-blur-md border-b border-slate-100 px-6 py-4 flex justify-between items-center"><div class="text-[10px] tracking-[0.2em] text-slate-400">AREA EF — ADMIN</div><div class="flex items-center gap-3"><div class="mono text-[11px] text-slate-500">'+allData.length+' data</div><button onclick="logout()" class="text-[11px] text-slate-400 hover:text-black">Keluar</button></div></div>';
  html+='<div class="max-w-[520px] mx-auto px-6 py-10">';
  html+='<div class="mb-8"><div class="flex items-baseline gap-3"><div class="mono text-[56px] font-light leading-none tracking-tighter">'+totalTUL+'</div><div class="text-[10px] tracking-[0.2em] text-slate-400">TUL</div></div><div class="mt-8 flex gap-5 border-b border-slate-100 overflow-x-auto"><button onclick="activeTab=\'history\';render()" class="pb-3 whitespace-nowrap text-[11px] tracking-wide '+(activeTab==='history'?'border-b border-black text-black':'text-slate-400')+'">HISTORY</button><button onclick="activeTab=\'input\';render()" class="pb-3 whitespace-nowrap text-[11px] tracking-wide '+(activeTab==='input'?'border-b border-black text-black':'text-slate-400')+'">INPUT</button><button onclick="activeTab=\'kelola\';render()" class="pb-3 whitespace-nowrap text-[11px] tracking-wide '+(activeTab==='kelola'?'border-b border-black text-black':'text-slate-400')+'">KELOLA</button><button onclick="activeTab=\'approval\';render()" class="pb-3 whitespace-nowrap text-[11px] tracking-wide relative '+(activeTab==='approval'?'border-b border-black text-black':'text-slate-400')+'">APPROVAL '+(pendingMembers.length?'<span class="ml-1 bg-black text-white text-[9px] px-1.5 py-0.5 rounded-full">'+pendingMembers.length+'</span>':'')+'</button></div></div>';
  if(activeTab==='history'){
    html+='<div class="flex gap-2 mb-8"><select onchange="filterBulan=this.value;render()" class="mono h-[36px] px-4 rounded-full bg-slate-50 border border-slate-200 text-[11px]"><option value="all" '+(filterBulan==='all'?'selected':'')+'>Semua Bulan</option><option value="1" '+(filterBulan==='1'?'selected':'')+'>Jan</option><option value="2" '+(filterBulan==='2'?'selected':'')+'>Feb</option><option value="3" '+(filterBulan==='3'?'selected':'')+'>Mar</option><option value="4" '+(filterBulan==='4'?'selected':'')+'>Apr</option><option value="5" '+(filterBulan==='5'?'selected':'')+'>Mei</option><option value="6" '+(filterBulan==='6'?'selected':'')+'>Jun</option><option value="7" '+(filterBulan==='7'?'selected':'')+'>Jul</option><option value="8" '+(filterBulan==='8'?'selected':'')+'>Agu</option><option value="9" '+(filterBulan==='9'?'selected':'')+'>Sep</option><option value="10" '+(filterBulan==='10'?'selected':'')+'>Okt</option><option value="11" '+(filterBulan==='11'?'selected':'')+'>Nov</option><option value="12" '+(filterBulan==='12'?'selected':'')+'>Des</option></select><button onclick="fetchData(true)" class="h-[36px] px-4 rounded-full border border-slate-200 text-[11px]">Refresh</button></div>';
    if(groupedTanggal.length===0){ html+='<div class="py-24 text-center mono text-[11px] text-slate-300">TIDAK ADA DATA<br><span class="text-[10px]">Total di server: '+allData.length+'</span></div>'; }
    else{
      for(let g of groupedTanggal){
        html+='<div class="mb-8"><div class="flex justify-between items-center mb-3"><div class="mono text-[11px] tracking-[0.15em] text-slate-500">'+formatTanggal(g.tanggal).toUpperCase()+'</div><button onclick="hapusTanggal(\''+g.tanggal+'\')" class="text-[10px] text-slate-300 hover:text-red-500">hapus tgl</button></div><div class="border-t border-slate-100">';
        for(let r of g.rows){
          html+='<div class="flex justify-between items-center py-3 border-b border-slate-50 group"><div class="flex gap-3 items-center"><div class="mono text-[13px]">'+r.nama+'</div><div class="mono text-[11px] text-slate-400">'+r.jam+'j • '+r.tul+' TUL</div></div><button onclick="hapusTransaksi(\''+r.tanggalNorm+'\',\''+r.nama+'\',\''+r.jam+'\')" class="opacity-0 group-hover:opacity-100 text-[10px] text-slate-300 hover:text-red-500">✕</button></div>';
        }
        html+='</div></div>';
      }
    }
    if(groupedKaryawan.length){
      html+='<div class="mt-12 pt-8 border-t border-slate-100"><div class="mono text-[10px] tracking-[0.2em] text-slate-400 mb-4">REKAP — '+data.length+' transaksi</div>';
      for(let k of groupedKaryawan){ html+='<div class="flex justify-between py-2.5 border-b border-slate-50"><div class="text-[12px]">'+k.nama+'</div><div class="mono text-[11px] text-slate-500">'+k.totalTUL+' TUL • '+k.count+' hari</div></div>'; }
      html+='</div>';
    }
  } else if(activeTab==='input'){
