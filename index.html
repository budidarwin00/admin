<!DOCTYPE html>
<html lang="id">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Input Massal + Riwayat Harian</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif}</style>
</head>
<body class="bg-[#f6f5f4] min-h-screen">
<div id="app"></div>
<script>
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbw5cHnAw-eyp-8KPmIhWijZbGDofMhjrSkibD-23AEBimCeT8m9msRm63AGur7N1wWpXw/exec';
const ADMIN_PASS = 'admin123';
const TUL_MAP={2:3.5,3:5.5,4:7.5,6:12,7:14,8:16};
const calcTUL=j=>TUL_MAP[j]||j*2;
function normNama(n){ return String(n||'').trim().toLowerCase(); }
const DEFAULT_KARYAWAN = [
  {nama:'Nia',pass:'1234'},{nama:'Aditya',pass:'1234'},{nama:'Anisa',pass:'1234'},{nama:'Aaf',pass:'1234'},{nama:'Syarif',pass:'1234'},{nama:'Budi',pass:'1234'},{nama:'Topik',pass:'1234'},{nama:'Yudi',pass:'1234'},{nama:'Dozen',pass:'1234'},{nama:'Putri',pass:'1234'},{nama:'Arief',pass:'1234'},{nama:'Anah',pass:'1234'},{nama:'Supriyadi',pass:'1234'},{nama:'Eka',pass:'1234'},{nama:'Nely',pass:'1234'},{nama:'Zaelani',pass:'1234'},
];
let isLogin = localStorage.getItem('admin_login')==='true';
let allData=[];
let karyawanList=JSON.parse(localStorage.getItem('rk_kar_admin_nonik')||'null');
if(!karyawanList || karyawanList.length<16){ karyawanList=DEFAULT_KARYAWAN; localStorage.setItem('rk_kar_admin_nonik', JSON.stringify(karyawanList)); }
let filterBulan=String(new Date().getMonth()+1);
let filterTahun='all';
let selectedMassal = {};
let syncStatus = '● Sinkron';
let lastSync = '';
let activeTab = 'massal'; // massal, harian, rekap

function showToast(m){ const t=document.createElement('div'); t.className='fixed bottom-4 left-1/2 -translate-x-1/2 bg-zinc-900 text-white px-4 py-2 rounded-full text-[12px] z-50'; t.innerText=m; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb='cb_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);
    window[cb]=(data)=>{ delete window[cb]; document.getElementById(cb)?.remove(); resolve(data); };
    const s=document.createElement('script'); s.id=cb;
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&t='+Date.now();
    s.onerror=()=>{ delete window[cb]; s.remove(); reject(new Error('fail')); };
    document.body.appendChild(s);
    setTimeout(()=>{ if(window[cb]){ delete window[cb]; s.remove(); reject(new Error('Timeout')); } },5000);
  });
}
async function fetchData(){
  syncStatus = '⏳ Syncing...'; render();
  try{
    const j = await jsonp(SYNC_URL+'?action=read');
    if(Array.isArray(j)) {
      allData=j.map(row=>({tanggal:row.tanggal, nama:row.nama||row.nik, jam:Number(row.jam||0), tul:calcTUL(Number(row.jam||0))})).filter(x=>x.nama);
      syncStatus = '● Sinkron';
      lastSync = new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
    }
  }catch(e){ syncStatus = '● Offline'; }
  render();
}
function login(){ const p=document.getElementById('apass').value; if(p===ADMIN_PASS){ localStorage.setItem('admin_login','true'); isLogin=true; fetchData(); } else document.getElementById('aerr').innerText='Password salah'; }
function logout(){ localStorage.removeItem('admin_login'); isLogin=false; render(); }
function filteredData(){
  let d=[...allData];
  if(filterBulan!=='all'){ d=d.filter(x=>{ const t=String(x.tanggal); let m=''; if(t.includes('-')) m=t.split('-')[1]; else if(t.includes('/')) m=t.split('/')[1]; else m=String(new Date(t).getMonth()+1); return String(parseInt(m))===String(parseInt(filterBulan)); }); }
  if(filterTahun!=='all'){ d=d.filter(x=>{ const t=String(x.tanggal); let y=''; if(t.includes('-')) y=t.split('-')[0].length===4 ? t.split('-')[0] : t.split('-')[2]; else if(t.includes('/')) y=t.split('/')[2]; else y=String(new Date(t).getFullYear()); return String(y)===filterTahun; }); }
  return d;
}
function groupByKaryawan(data){
  const map={}; data.forEach(r=>{ const key=normNama(r.nama); if(!map[key]) map[key]={nama:r.nama,totalJam:0,totalTUL:0,hari:0}; map[key].totalJam+=Number(r.jam); map[key].totalTUL+=Number(r.tul); map[key].hari+=1; }); return Object.values(map).sort((a,b)=>b.totalTUL-a.totalTUL);
}
function groupByTanggal(data){
  const map={};
  data.forEach(r=>{
    const t=r.tanggal;
    if(!map[t]) map[t]={tanggal:t, totalJam:0, totalTUL:0, karyawan:[], rows:[]};
    map[t].totalJam+=Number(r.jam);
    map[t].totalTUL+=Number(r.tul);
    map[t].karyawan.push(r);
    map[t].rows.push(r);
  });
  return Object.values(map).sort((a,b)=> new Date(b.tanggal) - new Date(a.tanggal));
}
function toggleSelectMassal(nama){ const key=normNama(nama); if(selectedMassal[key]) delete selectedMassal[key]; else selectedMassal[key]=true; renderMassalList(); }
function selectAllMassal(){ const allSelected = Object.keys(selectedMassal).length === karyawanList.length; if(allSelected){ selectedMassal={}; } else { selectedMassal={}; karyawanList.forEach(k=>{ selectedMassal[normNama(k.nama)]=true; }); } renderMassalList(); }
function renderMassalList(){
  const container=document.getElementById('massalList');
  if(!container) return;
  container.innerHTML = karyawanList.map(k=>{
    const key=normNama(k.nama);
    const isSelected = !!selectedMassal[key];
    return `<label class="flex items-center gap-3 px-4 py-3 rounded-[18px] border-2 cursor-pointer ${isSelected?'bg-zinc-900 text-white border-zinc-900':'bg-white border-zinc-200'}"><input type="checkbox" ${isSelected?'checked':''} onchange="toggleSelectMassal('${k.nama}')" class="w-5 h-5 rounded"><span class="text-[14px] font-semibold">${k.nama}</span></label>`;
  }).join('');
  const countEl=document.getElementById('massalCount');
  if(countEl) countEl.innerText = `${Object.keys(selectedMassal).length} karyawan dipilih`;
}
async function handleInputMassal(){
  const tgl=document.getElementById('massalTgl').value;
  const jam=parseInt(document.getElementById('massalJam').value);
  const selectedNames = Object.keys(selectedMassal).map(key=>{ const k=karyawanList.find(x=>normNama(x.nama)===key); return k ? k.nama : key; });
  if(!tgl || !jam){ showToast('Isi tanggal & jam'); return; }
  if(selectedNames.length===0){ showToast('Pilih minimal 1'); return; }
  const newRows = selectedNames.map(nama=>({tanggal:tgl, nama:nama, jam:jam, tul:calcTUL(jam)}));
  allData.unshift(...newRows);
  render();
  showToast(`✅ ${selectedNames.length} tersimpan INSTAN`);
  selectedMassal={}; renderMassalList();
  syncStatus='⏳ Menyimpan...'; render();
  selectedNames.forEach(nama=>{
    const payload={tanggal:tgl, nik:normNama(nama), nama:nama, jam:jam, tul:calcTUL(jam)};
    fetch(SYNC_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)}).catch(()=>{});
  });
  setTimeout(()=>{ syncStatus='● Sinkron'; lastSync=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); render(); }, 2000);
}
async function hapusTransaksi(tgl, nama, jam){
  if(!confirm(`Hapus ${nama} ${tgl} ${jam} jam?`)) return;
  try{
    await jsonp(`${SYNC_URL}?action=deleteTransaksi&tanggal=${encodeURIComponent(tgl)}&nik=${encodeURIComponent(normNama(nama))}&jam=${encodeURIComponent(jam)}`);
    allData = allData.filter(r=> !(r.tanggal===tgl && normNama(r.nama)===normNama(nama) && r.jam===jam));
    showToast('🗑️ Terhapus dari Sheet');
    render();
  }catch{ showToast('❌ Gagal'); }
}
async function hapusKaryawanTUL(nama){
  const data = filteredData().filter(x=>normNama(x.nama)===normNama(nama));
  if(data.length===0){ showToast('Tidak ada data'); return; }
  if(!confirm(`Hapus ${data.length} data ${nama}?`)) return;
  for(const r of data){
    try{ await jsonp(`${SYNC_URL}?action=deleteTransaksi&tanggal=${encodeURIComponent(r.tanggal)}&nik=${encodeURIComponent(normNama(nama))}&jam=${encodeURIComponent(r.jam)}`); }catch{}
  }
  showToast(`🗑️ ${nama} terhapus`);
  fetchData();
}
async function hapusTanggal(tgl){
  const data = allData.filter(x=>x.tanggal===tgl);
  if(!confirm(`Hapus semua ${data.length} data tanggal ${tgl}?`)) return;
  for(const r of data){
    try{ await jsonp(`${SYNC_URL}?action=deleteTransaksi&tanggal=${encodeURIComponent(r.tanggal)}&nik=${encodeURIComponent(normNama(r.nama))}&jam=${encodeURIComponent(r.jam)}`); }catch{}
  }
  showToast(`🗑️ ${tgl} terhapus`);
  fetchData();
}
function shareWA(nama, totalTUL){ window.open(`https://wa.me/?text=${encodeURIComponent(nama+' '+totalTUL+' tul')}`, '_blank'); }
function shareTanggalWA(tgl, grouped){
  const data = grouped.rows;
  let pesan = `📅 Lembur ${tgl}\n` + data.map(r=> `${r.nama} ${r.jam}j = ${r.tul} TUL`).join('\n') + `\nTotal: ${grouped.totalJam} jam = ${grouped.totalTUL} TUL`;
  window.open(`https://wa.me/?text=${encodeURIComponent(pesan)}`, '_blank');
}
function shareAllWA(){
  const data = filteredData(); const grouped = groupByKaryawan(data);
  const bulanNama = filterBulan==='all' ? 'Semua Bulan' : ['', 'Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][parseInt(filterBulan)] || filterBulan;
  let pesan = `Update tul bulan ${bulanNama}\n` + grouped.map(g=> `${g.nama} ${g.totalTUL} tul`).join('\n');
  window.open(`https://wa.me/?text=${encodeURIComponent(pesan)}`, '_blank');
}
function render(){
  const app=document.getElementById('app');
  if(!isLogin){
    app.innerHTML=`<div class="min-h-screen grid place-items-center p-4 bg-zinc-900"><div class="w-full max-w-[360px] bg-white rounded-[24px] p-6"><h1 class="font-bold">Admin - 16 Karyawan</h1><div class="mt-4 space-y-3"><input id="apass" type="password" placeholder="admin123" class="w-full h-11 rounded-xl border px-4 bg-zinc-50"><div id="aerr" class="text-[11px] text-red-600"></div><button onclick="login()" class="w-full h-11 rounded-xl bg-zinc-900 text-white font-bold">Masuk</button></div></div></div>`; return;
  }
  const data=filteredData(); 
  const grouped=groupByKaryawan(data);
  const harian=groupByTanggal(data);
  const bulanNama=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember']; 
  const labelBulan=filterBulan==='all'?'Semua Bulan':bulanNama[parseInt(filterBulan)];

  app.innerHTML=`<div class="max-w-[900px] mx-auto min-h-screen bg-white">
    <div class="px-6 h-[64px] flex items-center justify-between border-b bg-white sticky top-0 z-10">
      <div>
        <div class="font-bold text-[18px] leading-none">Admin</div>
        <div class="text-[11px] text-zinc-500 flex items-center gap-2 mt-1"><span class="${syncStatus.includes('Sinkron')?'text-green-600':'text-amber-600'} font-bold">${syncStatus}</span><span>• ${allData.length} data • ${grouped.length} karyawan</span>${lastSync?`<span>• ${lastSync}</span>`:''}</div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="fetchData()" class="h-10 w-10 rounded-full bg-zinc-100 border grid place-items-center">🔄</button>
        <button onclick="logout()" class="h-10 px-6 rounded-full bg-zinc-900 text-white text-[13px] font-bold">Logout</button>
      </div>
    </div>

    <!-- BAR NAVIGASI BARU -->
    <div class="px-4 py-3 bg-[#f6f5f4] sticky top-[64px] z-10">
      <div class="flex gap-2 p-1.5 bg-white rounded-[20px] border shadow-sm overflow-x-auto">
        <button onclick="activeTab='massal';render()" class="flex-1 whitespace-nowrap h-11 px-5 rounded-[14px] font-bold text-[13px] ${activeTab==='massal'?'bg-zinc-900 text-white shadow':'bg-zinc-50 text-zinc-600 border'}">Input Massal</button>
        <button onclick="activeTab='harian';render()" class="flex-1 whitespace-nowrap h-11 px-5 rounded-[14px] font-bold text-[13px] ${activeTab==='harian'?'bg-zinc-900 text-white shadow':'bg-zinc-50 text-zinc-600 border'}">Riwayat Harian 📅 ${harian.length>0?`(${harian.length})`:''}</button>
        <button onclick="activeTab='rekap';render()" class="flex-1 whitespace-nowrap h-11 px-5 rounded-[14px] font-bold text-[13px] ${activeTab==='rekap'?'bg-zinc-900 text-white shadow':'bg-zinc-50 text-zinc-600 border'}">Rekap TUL</button>
      </div>
    </div>

    <div class="p-4 space-y-4 bg-[#f6f5f4]">
      ${activeTab==='massal'?`
      <div class="rounded-[28px] bg-white border shadow-sm p-5">
        <div class="flex items-center justify-between mb-5"><div class="font-bold text-[18px]">Input Lembur Massal</div><button onclick="selectAllMassal()" class="h-10 px-5 rounded-full bg-zinc-900 text-white text-[13px] font-bold">Pilih Semua</button></div>
        <div class="grid grid-cols-2 gap-3 mb-4">
          <div><div class="text-[12px] text-zinc-500 mb-1.5 ml-1">Tanggal</div><input id="massalTgl" type="date" value="${new Date().toISOString().slice(0,10)}" class="w-full h-12 rounded-[16px] border-2 border-zinc-100 bg-zinc-50 px-4 text-[15px] font-semibold"></div>
          <div><div class="text-[12px] text-zinc-500 mb-1.5 ml-1">Jam</div><select id="massalJam" class="w-full h-12 rounded-[16px] border-2 border-zinc-100 bg-zinc-50 px-4 text-[15px] font-bold"><option value="2">2 jam = 3.5 TUL</option><option value="3" selected>3 jam = 5.5 TUL</option><option value="4">4 jam = 7.5 TUL</option><option value="6">6 jam = 12 TUL</option><option value="8">8 jam = 16 TUL</option></select></div>
        </div>
        <div id="massalCount" class="text-[13px] font-bold text-zinc-600 mb-3">0 karyawan dipilih</div>
        <button onclick="handleInputMassal()" class="w-full h-14 rounded-[18px] bg-zinc-900 text-white font-bold text-[16px] mb-5">Simpan</button>
        <div id="massalList" class="grid grid-cols-2 gap-3 max-h-[400px] overflow-y-auto p-1"></div>
      </div>
      `:''}

      ${activeTab==='harian'?`
      <div class="rounded-[24px] bg-white border p-4 flex gap-3 items-center">
        <select onchange="filterBulan=this.value;render()" class="flex-1 h-12 rounded-[16px] border-2 border-zinc-100 bg-zinc-50 px-4 text-[14px] font-bold"><option value="all" ${filterBulan==='all'?'selected':''}>Semua Bulan</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${filterBulan==i+1?'selected':''}>${bulanNama[i+1]}</option>`).join('')}</select>
        <select onchange="filterTahun=this.value;render()" class="flex-1 h-12 rounded-[16px] border-2 border-zinc-100 bg-zinc-50 px-4 text-[14px] font-bold"><option value="all" ${filterTahun==='all'?'selected':''}>Semua Tahun</option><option value="2024">2024</option><option value="2025">2025</option><option value="2026">2026</option></select>
      </div>
      <div class="space-y-3">
        ${harian.length===0?`<div class="rounded-[24px] bg-white border p-10 text-center text-zinc-500">Tidak ada data harian di ${labelBulan}</div>`:
        harian.map(h=>`
          <div class="rounded-[24px] bg-white border shadow-sm overflow-hidden">
            <div class="px-5 py-4 bg-zinc-900 text-white flex justify-between items-center">
              <div><div class="font-bold text-[15px]">📅 ${h.tanggal}</div><div class="text-[11px] opacity-70 mt-0.5">${h.karyawan.length} orang • ${h.totalJam} jam • ${h.totalTUL} TUL</div></div>
              <div class="flex gap-2">
                <button onclick="shareTanggalWA('${h.tanggal}', {rows: ${JSON.stringify(h.rows).replace(/"/g, '&quot;')}, totalJam:${h.totalJam}, totalTUL:${h.totalTUL}})" class="h-8 px-3 rounded-full bg-white text-zinc-900 text-[11px] font-bold">WA</button>
                <button onclick="hapusTanggal('${h.tanggal}')" class="h-8 px-3 rounded-full bg-red-600 text-white text-[11px] font-bold">Hapus Hari</button>
              </div>
            </div>
            <div class="divide-y">
              ${h.rows.map(r=>`<div class="px-5 py-3 flex items-center justify-between"><div><div class="font-bold text-[13px]">${r.nama}</div><div class="text-[11px] text-zinc-500">${r.jam} jam = ${r.tul} TUL</div></div><button onclick="hapusTransaksi('${r.tanggal}','${r.nama}',${r.jam})" class="h-8 px-3 rounded-full bg-red-50 border border-red-200 text-red-600 text-[11px] font-bold">Hapus</button></div>`).join('')}
            </div>
          </div>
        `).join('')}
      </div>
      `:''}

      ${activeTab==='rekap'?`
      <div class="rounded-[24px] bg-white border p-4 flex gap-3 items-center">
        <select onchange="filterBulan=this.value;render()" class="flex-1 h-12 rounded-[16px] border-2 border-zinc-100 bg-zinc-50 px-4 text-[14px] font-bold"><option value="all" ${filterBulan==='all'?'selected':''}>Semua Bulan</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${filterBulan==i+1?'selected':''}>${bulanNama[i+1]}</option>`).join('')}</select>
        <select onchange="filterTahun=this.value;render()" class="flex-1 h-12 rounded-[16px] border-2 border-zinc-100 bg-zinc-50 px-4 text-[14px] font-bold"><option value="all" ${filterTahun==='all'?'selected':''}>Semua Tahun</option><option value="2024">2024</option><option value="2025">2025</option><option value="2026">2026</option></select>
        <button onclick="shareAllWA()" class="h-12 w-[72px] rounded-[16px] bg-zinc-900 text-white text-[13px] font-bold">WA<br>All</button>
      </div>
      <div class="rounded-[24px] bg-white border shadow-sm overflow-hidden">
        <div class="px-5 py-4 border-b font-bold text-[15px]">Rekap TUL - ${labelBulan} (${grouped.length})</div>
        <div class="divide-y">${grouped.length===0?`<div class="py-10 text-center text-zinc-500">Tidak ada data</div>`:grouped.map(g=>`<div class="px-5 py-4 flex items-center justify-between"><div><div class="font-bold text-[14px]">${g.nama}</div></div><div class="flex gap-2"><button onclick="shareWA('${g.nama}',${g.totalTUL})" class="h-9 px-4 rounded-full bg-zinc-900 text-white text-[12px] font-bold">${g.totalTUL} TUL</button><button onclick="hapusKaryawanTUL('${g.nama}')" class="h-9 px-4 rounded-full bg-red-600 text-white text-[12px] font-bold">Hapus</button></div></div>`).join('')}</div>
      </div>
      `:''}
    </div>
  </div>`;
  if(activeTab==='massal') renderMassalList();
}
if(isLogin) fetchData(); else render();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="ht
