</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AREA EF - Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#fff;color:#111;min-height:100vh;-webkit-font-smoothing:antialiased}
.mono{font-family:JetBrains Mono,Menlo,monospace}
.header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid #111;padding:14px 20px;display:flex;flex-direction:column;gap:10px}
.h-row{display:flex;justify-content:space-between;align-items:center}
.h-left{font-size:14px;letter-spacing:0.25em;font-weight:900}
.select-bulan{height:40px;padding:0 32px 0 18px;border-radius:9999px;border:2px solid #111;background:#111;color:#fff;font-size:15px;font-weight:800;appearance:none;cursor:pointer}
.select-bulan option{background:#fff;color:#111}
.btn-keluar{height:40px;padding:0 18px;border-radius:9999px;border:2px solid #111;background:#fff;font-size:13px;font-weight:800;cursor:pointer}
.btn-share-wa{height:40px;padding:0 18px;border-radius:9999px;border:2px solid #111;background:#f8fafc;font-size:13px;font-weight:700;cursor:pointer}
.container{max-width:560px;margin:0 auto;padding:24px 20px}
.pill{height:42px;padding:0 22px;border-radius:9999px;border:2px solid #111;background:#f8fafc;font-size:14px;font-weight:700;cursor:pointer}
.pill-black{background:#000;color:#fff;border-color:#000;font-weight:800}
.input-wrap{border:2px solid #111;border-radius:20px;padding:20px;margin-bottom:28px}
.input-title{font-size:12px;letter-spacing:0.12em;font-weight:800;margin-bottom:12px}
.row-tgl-jam{display:flex;gap:8px;margin-bottom:14px}
.inp-tgl{flex:1;height:46px;border:2px solid #111;border-radius:12px;padding:0 14px;font-size:16px;font-weight:700}
.inp-jam{width:160px;height:46px;border:2px solid #111;border-radius:12px;padding:0 12px;font-size:14px;font-weight:700}
.grid-anggota{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-height:360px;overflow:auto;padding:2px}
.card-anggota{display:flex;align-items:center;gap:8px;padding:12px 14px;border:2px solid #e2e8f0;border-radius:12px;background:#f8fafc;cursor:pointer;font-size:15px;font-weight:700}
.card-anggota.checked{background:#111;color:#fff;border-color:#111}
.card-text{font-size:15px;font-weight:800}
.textarea{width:100%;min-height:90px;border:2px solid #e2e8f0;border-radius:12px;padding:12px;font-family:JetBrains Mono;font-size:13px;background:#f8fafc;outline:none}
.preview{margin-top:12px;border:2px solid #f1f5f9;border-radius:12px;padding:12px;display:none;background:#fff}
.btn-sm{height:38px;padding:0 18px;border-radius:9999px;border:2px solid #111;background:#fff;font-size:13px;font-weight:700;cursor:pointer}
.btn-sm-black{background:#000;color:#fff;border-color:#000}
.rekap-title{font-size:12px;letter-spacing:0.2em;font-weight:800;margin-bottom:12px}
.rekap-box{border:2px solid #111;border-radius:16px;overflow:hidden;margin-bottom:28px}
.rekap-item{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid #f1f5f9}
.row-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid #f1f5f9}
.btn-hapus{font-size:12px;font-weight:700;color:#111;background:#fff;border:2px solid #111;border-radius:9999px;padding:6px 14px;cursor:pointer}
.btn-x{width:34px;height:34px;border-radius:50%;border:2px solid #111;background:#fff;color:#111;font-weight:800;font-size:14px;cursor:pointer;display:grid;place-items:center}
.detail-title{font-size:12px;letter-spacing:0.2em;font-weight:800;margin-bottom:12px}
.tgl-group{margin-bottom:20px;border:2px solid #111;border-radius:16px;padding:14px 16px;border-left:8px solid #111}
.tgl-badge{display:inline-flex;align-items:center;justify-content:center;min-width:110px;height:44px;padding:0 18px;border-radius:9999px;font-weight:800;color:#fff;letter-spacing:0.02em}
.tgl-badge .day{font-size:22px;font-weight:900}
.tgl-badge .mon{font-size:13px;font-weight:800;margin-left:8px;text-transform:uppercase}
.tgl-group.color-0{border-left-color:#111}.tgl-group.color-0 .tgl-badge{background:#111}
.tgl-group.color-1{border-left-color:#2563eb}.tgl-group.color-1 .tgl-badge{background:#2563eb}
.tgl-group.color-2{border-left-color:#dc2626}.tgl-group.color-2 .tgl-badge{background:#dc2626}
.tgl-group.color-3{border-left-color:#059669}.tgl-group.color-3 .tgl-badge{background:#059669}
.tgl-group.color-4{border-left-color:#d97706}.tgl-group.color-4 .tgl-badge{background:#d97706}
.tgl-group.color-5{border-left-color:#7c3aed}.tgl-group.color-5 .tgl-badge{background:#7c3aed}
.tgl-group.color-6{border-left-color:#db2777}.tgl-group.color-6 .tgl-badge{background:#db2777}
.tgl-group.color-7{border-left-color:#0891b2}.tgl-group.color-7 .tgl-badge{background:#0891b2}
.empty{padding:60px 0;text-align:center;font-size:12px;font-weight:700;color:#94a3b8;letter-spacing:0.2em}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-input{width:100%;height:48px;border:none;border-bottom:3px solid #111;background:transparent;padding:0;font-size:16px;font-weight:700;outline:none}
.login-btn{width:100%;height:48px;background:#000;color:#fff;border-radius:9999px;border:none;font-size:14px;font-weight:800;margin-top:24px}
</style>
</head><body>
<div id="app"></div>
<script>
const SYNC_URL='https://script.google.com/macros/s/AKfycbz-Tgif9wJD6PAidITjE3-55BInA4pHZAibDI3mAIYUp_6DQV8may5oJkwyY0nHx4qE/exec';
const FALLBACK_URL='https://script.google.com/macros/s/AKfycbzUWTx3o5DjsfrM7JTZBbnYYaMBzFLbH3-mfs0dCFm1uOGouvDqCBpc3KOgNPgKNoHL/exec';
const ADMIN_PASS='admin123';
const TUL_MAP={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};
function calcTUL(j){return TUL_MAP[j]||j*1.5;}
function isJamValid(j){j=Number(j);return [2,3,4,6,7,8].includes(j);}
function normNama(n){return String(n||'').trim().toLowerCase();}

// Tanggal
function normalizeTanggal(t){
  if(!t)return'';
  let s=String(t).trim();
  // 2026-10-01T00:00:00.000Z -> ambil YYYY-MM-DD
  let iso=s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(iso){return iso[1]+'-'+iso[2]+'-'+iso[3];}
  // DD-MM-YYYY atau DD/MM/YYYY
  let m=s.match(/(\d{1,2})[\-\/](\d{1,2})[\-\/](\d{4})/);
  if(m){return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}
  // YYYY/MM/DD
  m=s.match(/(\d{4})[\-\/](\d{1,2})[\-\/](\d{1,2})/);
  if(m){return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');}
  try{let d=new Date(s);if(!isNaN(d))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}catch{}
  return s;
}
function formatBadge(t){
  let p=normalizeTanggal(t).split('-');
  if(p.length!==3)return{day:t,mon:''};
  let d=p[2].padStart(2,'0');
  let m=Number(p[1]);
  let mon=['','Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][m]||'';
  return{day:d,mon:mon,iso:p[0]+'-'+p[1]+'-'+p[2],ddmm:d+'-'+p[1]};
}
function parseSort(t){
  let p=normalizeTanggal(t).split('-');
  if(p.length!==3)return 0;
  return new Date(Number(p[0]),Number(p[1])-1,Number(p[2])).getTime();
}
const ALIAS={'kuncoro budi':'Budi','kuncoro':'Budi','budi kuncoro':'Budi','neli':'Nely','nely':'Nely','annisa':'Anisa','aditya zozo':'Aditya','adit':'Aditya','dozen':'Dozen','supri':'Supriyadi','topik':'Topik','zaelani':'Zaelani','aaf':'Aaf'};
function normNamaAnggota(n){if(!n)return'';let k=String(n).trim().toLowerCase();if(ALIAS[k])return ALIAS[k];for(let a in ALIAS){if(k.includes(a))return ALIAS[a];}return String(n).trim().split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');}
const DEFAULT_KARYAWAN=['Aaf','Aditya','Anah','Anisa','Arief','Budi','Dozen','Eka','Nely','Nia','Putri','Supriyadi','Syarif','Topik','Yudi','Zaelani'].map(n=>({nama:n}));
function getKaryawan(){try{let c=localStorage.getItem('custom_karyawan');if(c){let a=JSON.parse(c);if(Array.isArray(a)&&a.length)return a;}}catch{}return DEFAULT_KARYAWAN;}
let allData=[];let isLogin=!!localStorage.getItem('admin_login');
let filterBulan=String(new Date().getMonth()+1);
let showInput=false;let showKelola=false;
function toast(m){let t=document.createElement('div');t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:12px 22px;border-radius:9999px;font-size:14px;font-weight:700;z-index:99';t.innerText=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
function jsonp(url){return new Promise((res,rej)=>{let cb='cb_'+Date.now()+Math.random().toString(36).slice(2);window[cb]=(d)=>{delete window[cb];document.getElementById(cb)?.remove();res(d);};let s=document.createElement('script');s.id=cb;s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&_='+Date.now();s.onerror=()=>{delete window[cb];s.remove();rej();};document.body.appendChild(s);});}
async function fetchData(force=false){
  if(force){try{localStorage.removeItem('cache_lembur');allData=[];}catch{}}
  
  try{
    let j=await jsonp(SYNC_URL+'?action=read&_='+Date.now());
    if(!j||!j.length){try{let j2=await jsonp(FALLBACK_URL+'?action=read&_='+Date.now());if(j2&&j2.length)j=j2;}catch{}}
    if(Array.isArray(j)&&j.length){
      let raw=j.map(r=>{
        let jam=Number(r.jam||0);
        if(!isJamValid(jam))return null;
        let nm=normNamaAnggota(r.nama||r.nik||'');
        if(!nm)return null;
        let norm=normalizeTanggal(r.tanggal);
        if(!norm)return null;
        return{tanggal:r.tanggal,tanggalNorm:norm,nama:nm,jam:jam,tul:calcTUL(jam)};
      }).filter(Boolean);
      // Dedup: tanggalNorm+nama+jam
      let dedup={};let out=[];
      raw.forEach(r=>{
        let k=r.tanggalNorm+'|'+normNama(r.nama)+'|'+r.jam;
        if(!dedup[k]){dedup[k]=1;out.push(r);}
      });
      allData=out;
      try{localStorage.setItem('cache_lembur',JSON.stringify(allData));}catch{}
    }
  }catch(e){}
  // Sort 31-01 descending
  allData.sort((a,b)=>parseSort(b.tanggalNorm)-parseSort(a.tanggalNorm));
  render();
}
function filtered(){
  if(filterBulan==='all')return allData;
  let target=Number(filterBulan);
  return allData.filter(r=>{
    let p=r.tanggalNorm.split('-');
    return Number(p[1])===target;
  });
}
function groupTanggal(data){
  // FIX: Group by tanggalNorm (YYYY-MM-DD) jadi 1 tanggal = 1 card, bukan 3 card duplikat
  let m={};
  data.forEach(r=>{
    let key=r.tanggalNorm;
    if(!m[key])m[key]=[];
    m[key].push(r);
  });
  // Sort keys 31-01 descending
  let keys=Object.keys(m).sort((a,b)=>parseSort(b)-parseSort(a));
  return keys.map(k=>({tanggal:k,rows:m[k]}));
}
function groupKaryawan(data){let m={};data.forEach(r=>{let k=normNama(r.nama);if(!m[k])m[k]={nama:r.nama,total:0,count:0};m[k].total+=r.tul;m[k].count++;});return Object.values(m).sort((a,b)=>b.total-a.total);}
function login(){let p=document.getElementById('apass').value;if(p===ADMIN_PASS){localStorage.setItem('admin_login','1');isLogin=true;fetchData();}else document.getElementById('aerr').innerText='Password salah';}
function logout(){localStorage.removeItem('admin_login');isLogin=false;render();}
function hapusTgl(t){if(!confirm('Hapus semua tanggal '+t+'?'))return;allData=allData.filter(r=>r.tanggalNorm!==t);try{localStorage.setItem('cache_lembur',JSON.stringify(allData));}catch{}render();jsonp(SYNC_URL+'?action=deleteTanggal&tanggal='+encodeURIComponent(t.split('-').reverse().join('-'))+'&tanggalISO='+encodeURIComponent(t)+'&_='+Date.now());setTimeout(()=>fetchData(true),1000);}
function hapusOne(t,n,j){if(!confirm('Hapus '+n+' '+j+'j?'))return;allData=allData.filter(r=>!(r.tanggalNorm===t&&normNama(r.nama)===normNama(n)&&Number(r.jam)===Number(j)));try{localStorage.setItem('cache_lembur',JSON.stringify(allData));}catch{}render();jsonp(SYNC_URL+'?action=delete&tanggal='+encodeURIComponent(t.split('-').reverse().join('-'))+'&tanggalISO='+encodeURIComponent(t)+'&nama='+encodeURIComponent(n)+'&jam='+j+'&_='+Date.now());setTimeout(()=>fetchData(true),1000);}
function shareWA(){let data=filtered();let gKar=groupKaryawan(data);let total=data.reduce((s,r)=>s+r.tul,0);let bl=document.querySelector('.select-bulan')?.selectedOptions[0]?.text||'Bulan Ini';let txt='*AREA EF - '+bl+'*%0ATotal: '+total+' TUL%0A%0A*REKAP:*%0A';gKar.forEach(k=>{txt+=k.nama+': '+k.total+' TUL ('+k.count+' hari)%0A';});window.open('https://wa.me/?text='+txt,'_blank');}
function toggleCard(el){let cb=el.querySelector('input');cb.checked=!cb.checked;if(cb.checked){el.classList.add('checked');}else{el.classList.remove('checked');}}
function parsePlan(){let txt=(document.getElementById('txtPesan')?.value||'').trim();if(!txt){toast('Tempel plan dulu');return;}let lines=txt.split('\n');let cur='';let items=[];lines.forEach(line=>{line=line.trim();if(!line)return;let m=line.match(/(\d{1,2})[\-\/](\d{1,2})[\-\/](\d{2,4})/);if(m){let d=m[1].padStart(2,'0'),mo=m[2].padStart(2,'0'),y=m[3];if(y.length===2)y='20'+y;cur=d+'-'+mo+'-'+y;return;}let jm=line.match(/(\d{1,2})\s*j/i);if(jm&&cur){let jam=Number(jm[1]);if(!isJamValid(jam))return;let namaPart=line.replace(/\d+\s*j.*/i,'').replace(/[-–—]/g,' ').trim();if(!namaPart)namaPart=line.split(' ')[0];let nm=normNamaAnggota(namaPart);if(nm)items.push({tanggal:cur,nama:nm,jam:jam});}});let cont=document.getElementById('previewPesan');cont.innerHTML=items.length?items.map(it=>'<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;font-weight:600"><span>'+it.tanggal+' - '+it.nama+'</span><span>'+it.jam+'j • '+calcTUL(it.jam)+' TUL</span></div>').join(''):'<div style="font-size:13px;color:#94a3b8">Tidak ada data</div>';cont.style.display='block';cont._items=items;}
async function simpanPlan(){let cont=document.getElementById('previewPesan');let items=cont._items||[];if(!items.length){toast('Preview dulu');return;}toast('Menyimpan '+items.length);try{let fd=new FormData();fd.append('action','addBulk');fd.append('items',JSON.stringify(items));await fetch(SYNC_URL,{method:'POST',body:fd});}catch{}items.forEach(it=>allData.push({tanggal:it.tanggal,tanggalNorm:normalizeTanggal(it.tanggal),nama:it.nama,jam:it.jam,tul:calcTUL(it.jam)}));try{localStorage.setItem('cache_lembur',JSON.stringify(allData));}catch{}showInput=false;render();setTimeout(()=>fetchData(true),800);}
function simpanMassal(){
  let dayVal=document.getElementById('massalTgl').value.trim();
  let j=Number(document.getElementById('massalJam').value);
  if(!dayVal){toast('Isi tanggal 1-31');return;}
  let d=Number(dayVal);
  if(d<1||d>31){toast('Tanggal 1-31');return;}
  if(!isJamValid(j)){toast('Pilih jam 2,3,4,6,7,8');return;}
  let checked=document.querySelectorAll('#gridAnggota input:checked');
  if(!checked.length){toast('Pilih orang');return;}
  let now=new Date();
  let bln = filterBulan==='all'? (now.getMonth()+1) : Number(filterBulan);
  let thn = now.getFullYear();
  let tglStr = String(d).padStart(2,'0')+'-'+String(bln).padStart(2,'0')+'-'+thn;
  let items=[];checked.forEach(cb=>{items.push({tanggal:tglStr,nama:normNamaAnggota(cb.value),jam:j});});
  (async()=>{toast('Menyimpan '+items.length+' - '+tglStr);try{let fd=new FormData();fd.append('action','addBulk');fd.append('items',JSON.stringify(items));await fetch(SYNC_URL,{method:'POST',body:fd});}catch{}items.forEach(it=>allData.push({tanggal:it.tanggal,tanggalNorm:normalizeTanggal(it.tanggal),nama:it.nama,jam:it.jam,tul:calcTUL(it.jam)}));try{localStorage.setItem('cache_lembur',JSON.stringify(allData));}catch{}showInput=false;render();fetchData(true);})();
}
function render(){
  if(!isLogin){
    document.getElementById('app').innerHTML='<div class="login-wrap"><div style="width:100%;max-width:320px"><div style="font-size:12px;letter-spacing:0.3em;font-weight:900;margin-bottom:32px">AREA EF</div><input id="apass" type="password" placeholder="Password" class="login-input"><div id="aerr" style="font-size:13px;color:#ef4444;margin-top:10px;min-height:14px;font-weight:600"></div><button onclick="login()" class="login-btn">Masuk</button></div></div>';
    return;
  }
  let data=filtered();let gTgl=groupTanggal(data);let gKar=groupKaryawan(data);
  let html='';
  html+='<div class="header"><div class="h-row"><div class="h-left">AREA EF</div><button onclick="logout()" class="btn-keluar">Keluar</button></div><div class="h-row"><select onchange="filterBulan=this.value;render()" class="select-bulan"><option value="all" '+(filterBulan==='all'?'selected':'')+'>Semua Bulan</option><option value="1" '+(filterBulan==='1'?'selected':'')+'>Jan</option><option value="2" '+(filterBulan==='2'?'selected':'')+'>Feb</option><option value="3" '+(filterBulan==='3'?'selected':'')+'>Mar</option><option value="4" '+(filterBulan==='4'?'selected':'')+'>Apr</option><option value="5" '+(filterBulan==='5'?'selected':'')+'>Mei</option><option value="6" '+(filterBulan==='6'?'selected':'')+'>Jun</option><option value="7" '+(filterBulan==='7'?'selected':'')+'>Jul</option><option value="8" '+(filterBulan==='8'?'selected':'')+'>Agu</option><option value="9" '+(filterBulan==='9'?'selected':'')+'>Sep</option><option value="10" '+(filterBulan==='10'?'selected':'')+'>Okt</option><option value="11" '+(filterBulan==='11'?'selected':'')+'>Nov</option><option value="12" '+(filterBulan==='12'?'selected':'')+'>Des</option></select><button onclick="shareWA()" class="btn-share-wa">Share WA</button></div></div>';
  html+='<div class="container">';
  html+='<div class="action-row"><button onclick="showInput=!showInput;render()" class="pill pill-black">'+(showInput?'Tutup':'Input')+'</button></div>';

  if(showInput){
    html+='<div class="input-wrap">';
    let now=new Date();
    let blnNum = filterBulan==='all'? (now.getMonth()+1) : Number(filterBulan);
    let thnNum = now.getFullYear();
    let blnLabel = ['','Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][blnNum]||'';
    html+='<div><div class="input-title">INPUT MASSAL — '+blnLabel+' '+thnNum+'</div><div class="row-tgl-jam"><input id="massalTgl" type="number" min="1" max="31" placeholder="Tgl 1-31" class="inp-tgl"><select id="massalJam" class="inp-jam"><option value="">Jam</option><option value="2">2j • 3.5 TUL</option><option value="3">3j • 5.5 TUL</option><option value="4">4j • 7.5 TUL</option><option value="6">6j • 12 TUL</option><option value="7">7j • 14 TUL</option><option value="8">8j • 17 TUL</option></select></div><div id="gridAnggota" class="grid-anggota">'+getKaryawan().map(k=>'<div class="card-anggota" onclick="toggleCard(this)"><input type="checkbox" value="'+k.nama+'" style="display:none"><span class="card-text">'+k.nama+'</span></div>').join('')+'</div><button onclick="simpanMassal()" style="margin-top:14px;width:100%;height:46px;background:#000;color:#fff;border-radius:9999px;border:none;font-size:15px;font-weight:800">Simpan Massal</button></div>';
    html+='<div style="margin-top:22px;padding-top:20px;border-top:2px solid #f1f5f9"><div class="input-title">PASTE PLAN WA</div><textarea id="txtPesan" class="textarea" placeholder="18-10-2025\nBudi 6j"></textarea><div id="previewPesan" class="preview"></div><div style="display:flex;gap:8px;margin-top:12px"><button onclick="parsePlan()" class="btn-sm">Preview</button><button onclick="simpanPlan()" class="btn-sm btn-sm-black">Simpan Plan</button></div></div>';
    html+='</div>';
  }

  if(gKar.length){
    html+='<div style="margin-bottom:28px"><div class="rekap-title">REKAP PER ANGGOTA — '+data.length+' transaksi</div><div class="rekap-box">';

      html+='</div>';
    }
  }

  html+='<div style="margin-top:48px;padding-top:20px;border-top:2px solid #111;display:flex;justify-content:space-between"><button onclick="showKelola=!showKelola;render()" style="font-size:11px;font-weight:800;color:#111;background:none;border:none">Kelola anggota</button><span></span></div>';

    html+='<div style="margin-top:12px;border:2px solid #111;border-radius:16px;padding:16px"><div style="font-size:12px;font-weight:900;margin-bottom:10px">ANGGOTA ('+kar.length+')</div>'+kar.map(k=>'<div style="display:flex;justify-content:space-between;font-size:14px;font-weight:600;padding:8px 0;border-bottom:1px solid #f1f5f9"><span>'+k.nama+'</span><button onclick="if(confirm(\'Hapus\')){let a=getKaryawan().filter(x=>x.nama!==\''+k.nama+'\');localStorage.setItem(\'custom_karyawan\',JSON.stringify(a));render();}" style="font-size:11px;font-weight:800;color:#111;background:none;border:none">hapus</button></div>').join('')+'<div style="display:flex;gap:8px;margin-top:14px"><input id="newNama" placeholder="Nama baru" style="flex:1;height:38px;border:2px solid #111;border-radius:9999px;padding:0 14px;font-size:14px;font-weight:700"><button onclick="let v=document.getElementById(\'newNama\').value.trim();if(!v)return;let a=getKaryawan();a.push({nama:v});localStorage.setItem(\'custom_karyawan\',JSON.stringify(a));render();" style="height:38px;padding:0 18px;background:#000;color:#fff;border-radius:9999px;border:none;font-size:13px;font-weight:800">Tambah</button></div></div>';
  }
  html+='</div>';
  document.getElementById('app').innerHTML=html;
}
fetchData();
</script>
