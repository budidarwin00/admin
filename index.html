<style>

<script>
var URL='https://script.google.com/macros/s/AKfycbz-Tgif9wJD6PAidITjE3-55BInA4pHZAibDI3mAIYUp_6DQV8may5oJkwyY0nHx4qE/exec';
var TUL={1:1.5,2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};
var all=[],filter=localStorage.getItem('fb')||String(new Date().getMonth()+1),members=[],parsed=[],showWA=false,showM=false,login=!!localStorage.getItem('admin_login'),showN=6,loading=false;

function jsonp(u){return new Promise(function(res,rej){var cb='cb'+Date.now()+Math.random().toString(36).slice(2);window[cb]=function(d){delete window[cb];var s=document.getElementById(cb);if(s) s.remove();res(d);};var s=document.createElement('script');s.id=cb;s.src=u+'&callback='+cb+'&_='+Date.now();s.onerror=function(){delete window[cb];s.remove();rej(new Error('jsonp'));};document.body.appendChild(s);});}
function postData(action, payload){
  // POST pakai fetch biar tidak error URL panjang
  return fetch(URL, {method:'POST', body: JSON.stringify(Object.assign({action:action}, payload))}).then(function(r){return r.text();}).then(function(t){
    try{ var m=t.match(/^[^{]*({.*})[^}]*$/); if(m) t=m[1]; return JSON.parse(t); }catch(e){
      // fallback JSONP GET kalau POST gagal CORS
      var qs='?action='+action;
      if(payload.tanggal) qs+='&tanggal='+encodeURIComponent(payload.tanggal);
      if(payload.data) qs+='&data='+encodeURIComponent(JSON.stringify(payload.data).slice(0,1800));
      return jsonp(URL+qs);
    }
  });
}
function norm(t){var s=String(t).trim();if(s.indexOf('T')>=0) s=s.split('T')[0];s=s.replace('Z','');var m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m) return m[1]+'-'+m[2]+'-'+m[3];m=s.match(/(\d{1,2})[\-\/](\d{1,2})[\-\/](\d{4})/);if(m) return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);return s;}
function fmt(t){var p=norm(t).split('-');return p.length==3?p[2]+'-'+p[1]+'-'+p[0]:t;}
function toDD(t){var m=t.match(/(\d{4})-(\d{2})-(\d{2})/);if(m) return m[3]+'-'+m[2]+'-'+m[1];return t;}
function calc(j){return TUL[j]||j*1.5;}

function load(){
 if(!login){render();return;}
 render();
 // cache instant
 try{var c=localStorage.getItem('ef_cache_'+filter); if(c){ all=JSON.parse(c); render(); } }catch(e){}
 if(loading) return; loading=true;
 jsonp(URL+'?action=read&bulan='+filter).then(function(d){
  if(!Array.isArray(d)) d=[];
  all=d.map(function(x){var jn=Number(x.jam||0);if([1,2,3,4,6,7,8].indexOf(jn)<0) return null;return{tanggal:norm(x.tanggal),nama:String(x.nama||'').trim(),jam:jn,tul:calc(jn)}}).filter(Boolean);
  try{localStorage.setItem('ef_cache_'+filter, JSON.stringify(all));}catch(e){}
  loading=false; render();
 }).catch(function(){loading=false; render();});
}
function loadMembers(){return jsonp(URL+'?action=listmembers').then(function(m){members=(m&&m.members)||[];}).catch(function(){members=[];});}
function getFiltered(){if(filter=='all') return all;var n=Number(filter);return all.filter(function(r){return Number(norm(r.tanggal).split('-')[1])==n;});}
function group(d){var o={};d.forEach(function(r){if(!o[r.tanggal]) o[r.tanggal]=[];o[r.tanggal].push(r);});return Object.keys(o).sort(function(a,b){return new Date(b)-new Date(a);}).map(function(k){return{tanggal:k,rows:o[k]});}
function rekap(d){var o={};d.forEach(function(r){if(!o[r.nama]) o[r.nama]={nama:r.nama,c:0,tot:0};o[r.nama].c++;o[r.nama].tot+=r.tul;});return Object.values(o).sort(function(a,b){return b.tot-a.tot;});}

function parseLine(s){
 var t=s.trim();if(!t) return null;var l=t.toLowerCase();
 if(l.indexOf('ot ')===0||l.indexOf('selasa')===0||l.indexOf('senin')===0||l.indexOf('rabu')===0||l.indexOf('kamis')===0||l.indexOf('jumat')===0||l.indexOf('sabtu')===0||l.indexOf('minggu')===0||l==='reg'||l.indexOf('reg ')===0||l.indexOf('plan')===0) return null;
 var jam=null,m; m=t.match(/(\d+)\s*mp/i);if(m) jam=Number(m[1]);else{m=t.match(/-\s*(\d+)\b/);if(m) jam=Number(m[1]);else{m=t.match(/(\d+)\s*j/i);if(m) jam=Number(m[1]);}}
 if(!jam||jam<=0||jam>8) return null;
 var ws=t.split(/\s+/),nama=null;
 for(var i=ws.length-1;i>=0;i--){var w=ws[i].replace(/[^A-Za-z]/g,'');if(w.length>=3&&!/^[A-Z]+\d+$/i.test(w)&&!/^(mp|assy|mask|insulator|avi|cek|street|wip|ret|odom)$/i.test(w.toLowerCase())){nama=w;break;}}
 if(!nama) return null;
 return{nama:nama,jam:jam};
}
function doParseWA(){
 var el=document.getElementById('wa');if(!el){alert('Textarea tidak ada');return;}
 var v=el.value||'';if(!v.trim()){alert('Paste dulu');return;}
 var lines=v.split('\n'),tgl='';
 for(var i=0;i<lines.length;i++){var m=lines[i].match(/(\d{1,2})\s*(januari|februari|maret|april|mei|juni|juli|agustus|september|oktober|november|desember|jan|feb|mar|apr|jun|jul|agu|sep|okt|nov|des)\s*(\d{4})/i);if(m){var mp={januari:'01',februari:'02',maret:'03',april:'04',mei:'05',juni:'06',juli:'07',agustus:'08',september:'09',oktober:'10',november:'11',desember:'12',jan:'01',feb:'02',mar:'03',apr:'04',jun:'06',jul:'07',agu:'08',sep:'09',okt:'10',nov:'11',des:'12'};tgl=('0'+m[1]).slice(-2)+'-'+(mp[m[2].toLowerCase()]||'10')+'-'+m[3];break;} var m2=lines[i].match(/(\d{1,2})[\-\/\.](\d{1,2})[\-\/\.](\d{2,4})/); if(m2&&!tgl){var d=('0'+m2[1]).slice(-2),mo=('0'+m2[2]).slice(-2),y=m2[3]; if(y.length==2) y=(Number(y)<=30?'20'+y:'19'+y); tgl=d+'-'+mo+'-'+y;}}
 var inp=document.getElementById('tgl'); if(inp&&inp.value) tgl=toDD(inp.value);
 if(!tgl){alert('Pilih tanggal di atas atau tulis tanggal di teks');return;}
 parsed=[]; for(var i=0;i<lines.length;i++){var p=parseLine(lines[i]); if(p){p.tanggal=tgl; parsed.push(p);}}
 var pv=document.getElementById('pv');
 if(!parsed.length){pv.innerHTML='<div style=color:red;font-size:11px>Tidak ada nama terdeteksi. Contoh valid: E10 1mp Arief, F13 -1 Dozen, E13 -1 Syarif</div>';return;}
 var h='<div style=font-size:11px><b>'+parsed.length+' data - '+tgl+'</b><br><br>'; for(var i=0;i<parsed.length;i++) h+=parsed[i].nama+' - '+parsed[i].jam+'j - '+calc(parsed[i].jam)+' TUL<br>';
 h+='<br><button onclick=doSimpanWA() class=btn btn-black>Simpan '+parsed.length+' Data</button></div>'; pv.innerHTML=h;
}
// Simpan WA pakai chunk biar tidak error URL panjang
function doSimpanWA(){
 if(!parsed.length){alert('Preview kosong');return;}
 var b=document.getElementById('bWA'); if(b){b.innerHTML='Menyimpan...'; b.disabled=true;}
 var chunks=[]; for(var i=0;i<parsed.length;i+=8) chunks.push(parsed.slice(i,i+8));
 var total=0, idx=0;
 function next(){
  if(idx>=chunks.length){
    alert('Berhasil simpan '+total+' data'); parsed=[]; var ta=document.getElementById('wa'); if(ta) ta.value=''; var pv=document.getElementById('pv'); if(pv) pv.innerHTML=''; if(b){b.innerHTML='Simpan'; b.disabled=false;} load(); return;
  }
  postData('addbulk',{data:chunks[idx]}).then(function(r){
    if(r&&r.ok) total+=r.added||chunks[idx].length;
    idx++; next();
  }).catch(function(e){ alert('Gagal simpan batch '+(idx+1)+': '+e.message); if(b){b.innerHTML='Simpan'; b.disabled=false;}});
 }
 next();
}
function doSimpanM(){
 var t=document.getElementById('tgl'); if(!t||!t.value){alert('Pilih tanggal');return;}
 var tgl=toDD(t.value); var sels=document.querySelectorAll('.js'), its=[];
 for(var i=0;i<sels.length;i++){var jam=Number(sels[i].value); var n=sels[i].getAttribute('data-nama'); if(jam>0&&n) its.push({tanggal:tgl,nama:n,jam:jam});}
 if(!its.length){alert('Pilih jam');return;}
 var b=document.getElementById('bM'); if(b){b.innerHTML='Menyimpan...'; b.disabled=true;}
 var chunks=[]; for(var i=0;i<its.length;i+=8) chunks.push(its.slice(i,i+8));
 var total=0, idx=0;
 function next(){
  if(idx>=chunks.length){
    alert('Berhasil simpan '+total); for(var i=0;i<sels.length;i++) sels[i].value='0'; if(b){b.innerHTML='Simpan Massal'; b.disabled=false;} load(); return;
  }
  postData('addbulk',{data:chunks[idx]}).then(function(r){ if(r&&r.ok) total+=r.added||chunks[idx].length; idx++; next(); }).catch(function(e){ alert('Gagal: '+e.message); if(b){b.innerHTML='Simpan Massal'; b.disabled=false;}});
 }
 next();
}
function doLogin(){var p=document.getElementById('p'); if(p.value=='admin123'){localStorage.setItem('admin_login','1');login=true;load();}else{var e=document.getElementById('e'); e.innerHTML='Password salah';}}
function doLogout(){localStorage.removeItem('admin_login');login=false;render();}
function setF(v){filter=v;localStorage.setItem('fb',v);showN=6;load();}
function doHapus(tgl){
 if(!confirm('Hapus '+fmt(tgl)+' ?')) return;
 postData('deletetanggal',{tanggal:tgl}).then(function(r){
  if(r&&r.ok){alert('Terhapus '+r.deleted); load();}
  else{ // fallback GET
    jsonp(URL+'?action=deletetanggal&tanggal='+encodeURIComponent(tgl)).then(function(r2){ if(r2&&r2.ok){alert('Terhapus '+r2.deleted); load();} else alert('Gagal hapus'); });
  }
 }).catch(function(){ jsonp(URL+'?action=deletetanggal&tanggal='+encodeURIComponent(tgl)).then(function(r){ if(r&&r.ok){alert('Terhapus '+r.deleted); load();}}); });
}
function toggleWA(){showWA=!showWA; showM=false; render();}
function toggleM(){showM=!showM; showWA=false; if(showM){ loadMembers().then(function(){render();}); } else render();}
function render(){
 var app=document.getElementById('app');
 if(!login){ app.innerHTML='<div class=login><div style=max-width:300px;width:100%><div style=font-size:10px;letter-spacing:.3em;margin-bottom:20px>AREA EF - ADMIN</div><input id=p type=password placeholder=Password style=width:100%;height:42px;border:0;border-bottom:2px solid #111;outline:none><div id=e style=color:red;font-size:11px;margin-top:6px></div><button onclick=doLogin() class=lbtn>Masuk</button></div></div>'; return;}
 var data=getFiltered(), gg=group(data), rk=rekap(data);
 var h='<div class=h><b>AREA EF - ADMIN</b><button onclick=doLogout() class=btn>Keluar</button></div>';
 h+='<div class=bar><input type=date id=tgl class=inp><select onchange=setF(this.value) class=sel><option value=all '+(filter=='all'?'selected':'')+'>Semua</option><option value=1 '+(filter=='1'?'selected':'')+'>Jan</option><option value=2 '+(filter=='2'?'selected':'')+'>Feb</option><option value=3 '+(filter=='3'?'selected':'')+'>Mar</option><option value=4 '+(filter=='4'?'selected':'')+'>Apr</option><option value=5 '+(filter=='5'?'selected':'')+'>Mei</option><option value=6 '+(filter=='6'?'selected':'')+'>Jun</option><option value=7 '+(filter=='7'?'selected':'')+'>Jul</option><option value=8 '+(filter=='8'?'selected':'')+'>Agu</option><option value=9 '+(filter=='9'?'selected':'')+'>Sep</option><option value=10 '+(filter=='10'?'selected':'')+'>Okt</option><option value=11 '+(filter=='11'?'selected':'')+'>Nov</option><option value=12 '+(filter=='12'?'selected':'')+'>Des</option></select><button onclick=toggleWA() class=btn>'+(showWA?'Tutup':'Paste WA')+'</button><button onclick=toggleM() class=btn>'+(showM?'Tutup':'Massal')+'</button></div>';
 if(showWA){
  h+='<div class=card><div class=card-h><div><div class=dt>Paste Plan WA</div><div class=meta>Support: E10 1mp Arief = 1j, F13 -1 Dozen = 1j, A18 -2 = 2j</div></div><button onclick=toggleWA() class=btn>Tutup</button></div><div style=padding:12px><textarea id=wa class=ta placeholder="Selasa, 20 oktober 2026\nE10 1mp Arief\nF13 -1 Dozen\nE13 -1 Syarif"></textarea><div style=margin-top:8px;display:flex;gap:8px><button onclick=doParseWA() class=btn btn-black>Cek Preview</button><button id=bWA onclick=doSimpanWA() class=btn>Simpan</button></div><div id=pv style=margin-top:10px></div></div></div>';
 }
 if(showM){
  h+='<div class=card><div class=card-h><div><div class=dt>Simpan Massal</div><div class=meta>'+members.length+' anggota</div></div><div><button id=bM onclick=doSimpanM() class=btn btn-black>Simpan Massal</button> <button onclick=toggleM() class=btn>Tutup</button></div></div>';
  if(!members.length) h+='<div class=empty>Memuat anggota...</div>';
  else members.forEach(function(m){var nm=m.nama||''; h+='<div class=row><span>'+nm+'</span><select class="sel js" data-nama="'+nm+'"><option value=0>-</option><option value=1>1j</option><option value=2>2j</option><option value=3>3j</option><option value=4>4j</option><option value=6>6j</option><option value=7>7j</option><option value=8>8j</option></select></div>';});
  h+='</div>';
 }
 if(rk.length){h+='<div class=rekap><div style=font-size:10px;font-weight:700>REKAP '+data.length+' DATA - BLN '+filter+(loading?' - Memuat...':'')+'</div>'; rk.forEach(function(k){h+='<div class=row><span>'+k.nama+' • '+k.c+' hari</span><b>'+k.tot+' TUL</b></div>';}); h+='</div>';}
 if(!gg.length) h+='<div class=empty>'+(loading?'Memuat data...':'TIDAK ADA DATA BULAN '+filter)+'</div>';
 else{gg.slice(0,showN).forEach(function(x){var tot=0; x.rows.forEach(function(r){tot+=r.tul;}); h+='<div class=card><div class=card-h><div><div class=dt>'+fmt(x.tanggal)+'</div><div class=meta>'+x.rows.length+' orang • '+tot+' TUL</div></div><button onclick=doHapus(\''+x.tanggal+'\') class=btn>Hapus</button></div>'; x.rows.forEach(function(r){h+='<div class=row><span>'+r.nama+'</span><span>'+r.jam+'j • '+r.tul+' TUL</span></div>';}); h+='</div>';}); if(showN<gg.length) h+='<div style=padding:10px><button onclick=showN+=8;render() class=btn btn-black style=width:100%;height:38px>Load lagi ('+(gg.length-showN)+')</button></div>';}
 app.innerHTML=h;
 var t=document.getElementById('tgl'); if(t&&!t.value) t.value=new Date().toISOString().split('T')[0];
}
load();
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.proto ifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
