<!DOCTYPE html>
<html lang="id">
<head><style>

<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ADMIN AREA EF - ULTIMATE FAST</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif} .spin{animation:spin 0.8s linear infinite} @keyframes spin{from{transform:rotate(0)} to{transform:rotate(360deg)}}</style>
</head>
<body class="bg-[#f6f5f4] min-h-screen">
<div id="app"></div>
<script>
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbwr3utIlkimCQcJln2Gug7D0XOypnazzboyFiv5oZFFOf_Hk_XGyhKm9G2sx0Su1LU/exec';
const ADMIN_PASS = 'admin123';
const TUL_MAP={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};
const calcTUL=j=>TUL_MAP[j]||j*2;
function normNama(n){return String(n||'').trim().toLowerCase();}
function normalizeTanggal(t){if(!t)return'';let s=String(t).trim();if(s.includes('T'))s=s.split('T')[0];if(s.includes(' '))s=s.split(' ')[0];try{const d=new Date(t);if(!isNaN(d.getTime()))return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}catch{}return s;}
function formatTanggal(t){const p=normalizeTanggal(t).split('-');if(p.length===3)return `${p[2]}-${p[1]}-${p[0]}`;return t;}
const DEFAULT_KARYAWAN=[{nama:'Nia',pass:'1234'},{nama:'Aditya',pass:'1234'},{nama:'Anisa',pass:'1234'},{nama:'Aaf',pass:'1234'},{nama:'Syarif',pass:'1234'},{nama:'Budi',pass:'1234'},{nama:'Topik',pass:'1234'},{nama:'Yudi',pass:'1234'},{nama:'Dozen',pass:'1234'},{nama:'Putri',pass:'1234'},{nama:'Arief',pass:'1234'},{nama:'Anah',pass:'1234'},{nama:'Supriyadi',pass:'1234'},{nama:'Eka',pass:'1234'},{nama:'Nely',pass:'1234'},{nama:'Zaelani',pass:'1234'}];
let isLogin=localStorage.getItem('admin_login')==='true';
let allData=[]; let karyawanList=DEFAULT_KARYAWAN;
let selectedMassal={}; let syncStatus='● Sinkron'; let activeTab='massal';
let isSaving=false;
function toast(m){const t=document.createElement('div');t.className='fixed bottom-4 left-1/2 -translate-x-1/2 bg-zinc-900 text-white px-5 py-3 rounded-full text-[13px] font-bold z-50 shadow-xl';t.innerText=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);}

function jsonp(url){return new Promise((resolve,reject)=>{
  const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*999);
  let timer=null;
  window[cb]=(d)=>{clearTimeout(timer); delete window[cb]; document.getElementById(cb)?.remove(); if(d && Array.isArray(d)){ try{ localStorage.setItem('cache_lembur', JSON.stringify(d)); localStorage.setItem('cache_lembur_time', Date.now()); }catch{} } resolve(d);};
  const s=document.createElement('script'); s.id=cb; s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&_='+Date.now(); s.onerror=()=>{clearTimeout(timer); delete window[cb]; s.remove(); try{ const cached=localStorage.getItem('cache_lembur'); if(cached){ resolve(JSON.parse(cached)); return; } }catch{} reject(new Error('Network fail'));}; document.body.appendChild(s);
  timer=setTimeout(()=>{ if(window[cb]){ delete window[cb]; s.remove(); try{ const cached=localStorage.getItem('cache_lembur'); if(cached){ resolve(JSON.parse(cached)); return; } }catch{} reject(new Error('Timeout')); } },4000);
});}

async function fetchData(){
  try{ const cached=localStorage.getItem('cache_lembur'); if(cached && allData.length===0){ const j=JSON.parse(cached); let raw=j.map(r=>({tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal),nama:r.nama||r.nik,jam:Number(r.jam||0),tul:calcTUL(Number(r.jam||0))})).filter(x=>x.nama); const m=new Map();raw.forEach(r=>{const k=`${r.tanggalNorm}|${r.jam}|${r.nama.toLowerCase()}`;if(!m.has(k))m.set(k,r);}); allData=Array.from(m.values()); syncStatus='● Cache - '+allData.length+' data'; render(); } }catch{}
  syncStatus='Memuat...'; render();
  try{
    const j=await jsonp(SYNC_URL+'?action=read');
    if(Array.isArray(j)){
      let raw=j.map(r=>({tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal),nama:r.nama||r.nik,jam:Number(r.jam||0),tul:calcTUL(Number(r.jam||0))})).filter(x=>x.nama);
      const m=new Map();raw.forEach(r=>{const k=`${r.tanggalNorm}|${r.jam}|${r.nama.toLowerCase()}`;if(!m.has(k))m.set(k,r);});
      allData=Array.from(m.values());
      syncStatus='● Sinkron - '+allData.length+' data';
    }else syncStatus='Offline - '+ (j.error||'');
  }catch(e){ syncStatus='Offline - '+e.message; try{ const cached=localStorage.getItem('cache_lembur'); if(cached && allData.length===0){ const j=JSON.parse(cached); let raw=j.map(r=>({tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal),nama:r.nama||r.nik,jam:Number(r.jam||0),tul:calcTUL(Number(r.jam||0))})).filter(x=>x.nama); allData=raw; syncStatus='● Cache Offline'; } }catch{} }
  render();
}

function login(){const p=document.getElementById('apass').value;if(p===ADMIN_PASS){localStorage.setItem('admin_login','true');isLogin=true;fetchData();}else document.getElementById('aerr').innerText='Password salah';}
function logout(){localStorage.removeItem('admin_login');isLogin=false;render();}
function filteredData(){let d=[...allData];const mm=new Map();d.forEach(r=>{const k=`${r.tanggalNorm}|${r.jam}|${r.nama.toLowerCase()}`;if(!mm.has(k))mm.set(k,r);});d=Array.from(mm.values());if(filterBulan!=='all'){d=d.filter(x=>String(parseInt((x.tanggalNorm).split('-')[1]))===String(parseInt(filterBulan)));}if(filterTahun!=='all'){d=d.filter(x=>(x.tanggalNorm).split('-')[0]===filterTahun);}return d;}
let filterBulan=String(new Date().getMonth()+1);let filterTahun='all';
function groupByKaryawan(data){const dedup=new Map();data.forEach(r=>{const k=`${r.tanggalNorm}|${r.jam}|${r.nama.toLowerCase()}`;if(!dedup.has(k))dedup.set(k,r);});const clean=Array.from(dedup.values());const map={};clean.forEach(r=>{const key=normNama(r.nama);if(!map[key])map[key]={nama:r.nama,totalTUL:0,totalJam:0};map[key].totalTUL+=Number(r.tul);map[key].totalJam+=Number(r.jam);});return Object.values(map).sort((a,b)=>b.totalTUL-a.totalTUL);}
function groupByTanggal(data){const dedup=new Map();data.forEach(r=>{const k=`${r.tanggalNorm}|${r.jam}|${r.nama.toLowerCase()}`;if(!dedup.has(k))dedup.set(k,r);});const clean=Array.from(dedup.values());const map={};clean.forEach(r=>{const t=r.tanggalNorm;if(!map[t])map[t]={tanggal:t,totalTUL:0,rows:[]};map[t].totalTUL+=Number(r.tul);map[t].rows.push(r);});return Object.values(map).sort((a,b)=>new Date(b.tanggal)-new Date(a.tanggal));}
function toggleSelectMassal(nama){const key=normNama(nama);if(selectedMassal[key])delete selectedMassal[key];else selectedMassal[key]=true;renderMassalList();}
function renderMassalList(){const c=document.getElementById('massalList');if(!c)return;c.innerHTML=karyawanList.map(k=>{const sel=!!selectedMassal[normNama(k.nama)];return `<button onclick="toggleSelectMassal('${k.nama}')" class="h-[64px] rounded-[18px] border-2 text-left px-5 flex items-center justify-between ${sel?'bg-zinc-900 border-zinc-900 text-white shadow-lg':'bg-white border-zinc-100 hover:border-zinc-200'}"><div><div class="font-bold text-[14px]">${k.nama}</div></div><div class="w-7 h-7 rounded-full grid place-items-center text-[12px] ${sel?'bg-white text-zinc-900':'bg-zinc-100'}">${sel?'✓':''}</div></button>`;}).join('');const cnt=document.getElementById('massalCount');if(cnt)cnt.innerText=Object.keys(selectedMassal).length+' dipilih';}
function selectAllMassal(){if(Object.keys(selectedMassal).length===karyawanList.length)selectedMassal={};else karyawanList.forEach(k=>selectedMassal[normNama(k.nama)]=true);renderMassalList();}

// ULTIMATE FAST MASSAL - bulk sync
async function handleInputMassal(){
  const tgl=document.getElementById('massalTgl').value;
  const jam=Number(document.getElementById('massalJam').value);
  const names=Object.keys(selectedMassal);
  if(!tgl){toast('Pilih tanggal');return;}
  if(names.length===0){toast('Pilih karyawan');return;}
  if(isSaving) return;
  isSaving=true;
  syncStatus='Menyimpan '+names.length+' orang...'; render();
  
  // Optimistic UI - langsung tambah ke allData biar kelihatan cepat
  const newItems=[];
  names.forEach(key=>{
    const k=karyawanList.find(x=>normNama(x.nama)===key);
    if(!k) return;
    newItems.push({tanggal:tgl, nik:k.nama, nama:k.nama, jam:jam});
    // cek dobel lokal
    const exists = allData.some(r=> r.tanggalNorm===normalizeTanggal(tgl) && normNama(r.nama)===key && r.jam===jam);
    if(!exists) {
      allData.push({tanggal:tgl, tanggalNorm:normalizeTanggal(tgl), nama:k.nama, jam:jam, tul:calcTUL(jam)});
    }
  });
  try{ localStorage.setItem('cache_lembur', JSON.stringify(allData.map(r=>({tanggal:r.tanggalNorm, nama:r.nama, jam:r.jam})))); }catch{}
  render();
  
  // Kirim bulk ke sheet - 1 request saja, super cepat!
  try{
    const res = await fetch(SYNC_URL, {
      method:'POST',
      mode:'no-cors',
      body: JSON.stringify({action:'addBulk', items:newItems})
    });
    toast('✅ Berhasil simpan '+newItems.length+' orang! Sinkron cepat');
    selectedMassal={};
    setTimeout(()=>fetchData(), 800);
  }catch(e){
    // fallback parallel
    const promises = newItems.map(item=> fetch(SYNC_URL, {method:'POST', mode:'no-cors', body:JSON.stringify({tanggal:item.tanggal, nik:item.nama, nama:item.nama, jam:item.jam})}));
    await Promise.all(promises);
    toast('✅ Tersimpan '+newItems.length+' (fallback)');
    selectedMassal={};
    setTimeout(()=>fetchData(), 800);
  }
  isSaving=false;
  syncStatus='● Sinkron - '+allData.length+' data';
  render();
}

// HAPUS LANGSUNG HAPUS DI SHEET!
async function hapusTransaksi(tgl,nama,jam){
  if(!confirm(`Hapus lembur ${nama} tgl ${tgl} ${jam} jam? Data di Sheet akan langsung terhapus!`)) return;
  // Optimistic hapus lokal
  allData = allData.filter(r=> !(r.tanggalNorm===normalizeTanggal(tgl) && normNama(r.nama)===normNama(nama) && r.jam===jam));
  try{ localStorage.setItem('cache_lembur', JSON.stringify(allData.map(r=>({tanggal:r.tanggalNorm, nama:r.nama, jam:r.jam})))); }catch{}
  render();
  toast('Menghapus di Sheet...');
  try{
    await fetch(SYNC_URL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:'delete', tanggal:tgl, nama:nama, jam:jam})});
    toast('✅ Terhapus dari Sheet!');
    setTimeout(()=>fetchData(), 600);
  }catch(e){ toast('Gagal hapus: '+e.message); }
}

async function hapusTanggal(tgl){
  if(!confirm(`Hapus SEMUA data tanggal ${tgl}? Semua data di Sheet tanggal ini akan langsung terhapus!`)) return;
  allData = allData.filter(r=> r.tanggalNorm!==normalizeTanggal(tgl));
  try{ localStorage.setItem('cache_lembur', JSON.stringify(allData.map(r=>({tanggal:r.tanggalNorm, nama:r.nama, jam:r.jam})))); }catch{}
  render();
  toast('Menghapus tanggal '+tgl+' di Sheet...');
  try{
    await fetch(SYNC_URL, {method:'POST', mode:'no-cors', body:JSON.stringify({action:'deleteTanggal', tanggal:tgl})});
    toast('✅ Tanggal '+formatTanggal(tgl)+' terhapus dari Sheet!');
    setTimeout(()=>fetchData(), 600);
  }catch(e){ toast('Gagal: '+e.message); }
}

function render(){
  const app=document.getElementById('app');
  if(!isLogin){
    app.innerHTML=`<div class="min-h-screen grid place-items-center p-4"><div class="w-full max-w-[400px] rounded-[32px] bg-white border shadow-xl p-8 text-center"><div class="w-16 h-16 rounded-[20px] bg-zinc-900 text-white grid place-items-center font-black text-[22px] mx-auto mb-4">EF</div><div class="font-black text-[28px] tracking-tight">AREA EF</div><div class="text-[11px] font-bold text-zinc-500 uppercase tracking-[0.2em] mt-1 mb-8">${syncStatus}</div><input id="apass" type="password" placeholder="Password Admin" class="w-full h-14 rounded-[16px] border-2 border-zinc-100 bg-zinc-50 px-5 text-[16px] font-semibold focus:border-zinc-900 outline-none"><div id="aerr" class="text-[12px] text-red-600 font-bold mt-3 min-h-[16px]"></div><button onclick="login()" class="w-full h-14 rounded-[16px] bg-zinc-900 text-white font-bold mt-4">Masuk</button></div></div>`;
    return;
  }
  const data=filteredData(); const grouped=groupByKaryawan(data); const harian=groupByTanggal(data); const totalTUL=data.reduce((s,r)=>s+Number(r.tul),0);
  app.innerHTML=`
  <div class="max-w-[720px] mx-auto">
    <div class="sticky top-0 z-10 bg-white/80 backdrop-blur border-b px-6 h-[72px] flex items-center justify-between">
      <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-zinc-900 text-white grid place-items-center font-black">EF</div><div><div class="font-black text-[18px] leading-none">AREA EF</div><div class="text-[11px] font-bold mt-1 ${syncStatus.includes('Offline')?'text-red-600':'text-green-600'}">${syncStatus}</div></div></div>
      <div class="flex gap-2"><button onclick="fetchData()" class="w-11 h-11 rounded-full bg-white border grid place-items-center ${syncStatus.includes('Memuat')?'spin':''}">↻</button><button onclick="logout()" class="h-11 px-5 rounded-full bg-zinc-900 text-white text-[13px] font-bold">Logout</button></div>
    </div>
    <div class="px-4 pt-4 grid grid-cols-2 gap-3">
      <div class="rounded-[28px] bg-zinc-900 text-white p-6"><div class="text-[11px] opacity-60 font-bold uppercase">Total TUL</div><div class="text-[36px] font-black mt-2">${totalTUL}</div><div class="text-[12px] opacity-60 mt-1">${data.length} transaksi</div></div>
      <div class="rounded-[28px] bg-white border p-6"><div class="text-[11px] text-zinc-500 font-bold uppercase">Karyawan Aktif</div><div class="text-[36px] font-black mt-2">${grouped.length}</div><div class="text-[12px] text-zinc-500 mt-1">Bulan ${filterBulan==='all'?'All':filterBulan}</div></div>
    </div>
    <div class="p-4"><div class="rounded-[20px] bg-white border p-2 flex gap-2">
      <button onclick="activeTab='massal';render()" class="flex-1 h-12 rounded-[14px] font-bold text-[13px] ${activeTab==='massal'?'bg-zinc-900 text-white shadow-lg':'bg-zinc-50 border text-zinc-600'}">Input Massal ${Object.keys(selectedMassal).length?`(${Object.keys(selectedMassal).length})`:''}</button>
      <button onclick="activeTab='harian';render()" class="flex-1 h-12 rounded-[14px] font-bold text-[13px] ${activeTab==='harian'?'bg-zinc-900 text-white shadow-lg':'bg-zinc-50 border text-zinc-600'}">Riwayat 📅</button>
      <button onclick="activeTab='rekap';render()" class="flex-1 h-12 rounded-[14px] font-bold text-[13px] ${activeTab==='rekap'?'bg-zinc-900 text-white shadow-lg':'bg-zinc-50 border text-zinc-600'}">Rekap</button>
    </div></div>
    <div class="p-4 space-y-3">
      ${activeTab==='massal'?`
      <div class="rounded-[28px] bg-white border shadow-sm p-6">
        <div class="flex items-center justify-between mb-6"><div class="font-bold text-[20px]">Input Lembur Massal ⚡ CEPAT</div><button onclick="selectAllMassal()" class="h-11 px-6 rounded-full bg-zinc-900 text-white text-[13px] font-bold">Pilih Semua</button></div>
        <div class="grid grid-cols-2 gap-4 mb-6">
          <div><div class="text-[11px] font-bold text-zinc-500 mb-2 uppercase">Tanggal</div><input id="massalTgl" type="date" value="${new Date().toISOString().slice(0,10)}" class="w-full h-14 rounded-[16px] border-2 border-zinc-100 bg-zinc-50 px-5 text-[16px] font-semibold"></div>
          <div><div class="text-[11px] font-bold text-zinc-500 mb-2 uppercase">Jam</div><select id="massalJam" class="w-full h-14 rounded-[16px] border-2 border-zinc-100 bg-zinc-50 px-5 text-[16px] font-bold"><option value="2">2 jam = 3.5 TUL</option><option value="3" selected>3 jam = 5.5 TUL</option><option value="4">4 jam = 7.5 TUL</option><option value="6">6 jam = 12 TUL</option><option value="7">7 jam = 14 TUL</option><option value="8">8 jam = 17 TUL</option></select></div>
        </div>
        <div class="flex items-center justify-between mb-4"><div id="massalCount" class="text-[13px] font-bold text-zinc-600">0 dipilih</div><div class="text-[11px] text-green-600 font-bold">⚡ 1 klik = sinkron langsung ke Sheet</div></div>
        <button onclick="handleInputMassal()" id="btnMassal" class="w-full h-[56px] rounded-[18px] ${isSaving?'bg-zinc-400':'bg-zinc-900'} text-white font-bold text-[16px] shadow-lg hover:bg-black disabled:opacity-50" ${isSaving?'disabled':''}>${isSaving?'⏳ Menyimpan...':'⚡ Simpan Massal - Sinkron Cepat'}</button>
        <div id="massalList" class="grid grid-cols-2 gap-3 max-h-[420px] overflow-y-auto p-1 mt-6"></div>
      </div>`:''}
      ${activeTab==='harian'?`<div class="space-y-3">${harian.map(h=>`<div class="rounded-[24px] bg-white border overflow-hidden"><div class="px-6 py-4 bg-zinc-900 text-white flex justify-between items-center"><div><div class="font-bold text-[16px]">📅 ${formatTanggal(h.tanggal)}</div><div class="text-[11px] opacity-60 mt-1">${h.rows.length} orang • ${h.totalTUL} TUL</div></div><button onclick="hapusTanggal('${h.tanggal}')" class="h-10 px-5 rounded-full bg-red-600 text-white text-[12px] font-bold hover:bg-red-700">🗑️ Hapus Hari Ini dari Sheet</button></div><div class="divide-y">${h.rows.map(r=>`<div class="px-6 py-4 flex justify-between items-center"><div><div class="font-bold text-[14px]">${r.nama}</div><div class="text-[12px] text-zinc-500">${r.jam} jam = ${r.tul} TUL</div></div><button onclick="hapusTransaksi('${r.tanggal}','${r.nama}',${r.jam})" class="h-9 px-4 rounded-full bg-red-50 border border-red-200 text-red-600 text-[12px] font-bold hover:bg-red-100">🗑️ Hapus</button></div>`).join('')}</div></div>`).join('')}</div>`:''}
      ${activeTab==='rekap'?`<div class="rounded-[28px] bg-white border overflow-hidden"><div class="px-6 py-5 border-b flex justify-between"><div class="font-bold">Rekap TUL - ${data.length} data</div><div class="text-[12px] bg-zinc-100 px-3 py-1 rounded-full font-bold">${grouped.length} orang</div></div><div class="divide-y">${grouped.map(g=>`<div class="px-6 py-5 flex justify-between items-center"><div><div class="font-bold text-[16px]">${g.nama}</div><div class="text-[11px] text-zinc-500">${g.totalJam} jam • ${g.totalTUL} TUL</div></div><span class="h-11 px-5 rounded-full bg-zinc-900 text-white text-[13px] font-bold grid place-items-center">${g.totalTUL} TUL</span></div>`).join('')}</div></div>`:''}
    </div>
  </div>`;
  if(activeTab==='massal')renderMassalList();
}
if(isLogin)fetchData();else render();

<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="ht
