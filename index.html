!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Rekap Lembur & OT [SUPER]</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif}</style>
</head>
<body class="bg-[#f6f5f4] min-h-screen">
<div id="app"></div>

<script>
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbw5cHnAw-eyp-8KPmIhWijZbGDofMhjrSkibD-23AEBimCeT8m9msRm63AGur7N1wWpXw/exec';
const SPREADSHEET_ID = '1_v3QLraptmdhD2FRPdzvMd6hYIFJxVz5YyqjKW1g4lc';
const ADMIN_PASS = 'admin123';

let isLogin = localStorage.getItem('admin_login') === 'true';
let allData = [];
let karyawanList = JSON.parse(localStorage.getItem('rk_kar_admin')||'[]');
let tab = 'dashboard'; // dashboard, lembur, karyawan, riwayat
let filterBulan = String(new Date().getMonth()+1);
let filterTahun = String(new Date().getFullYear());
let search = '';
let loading = false;
let toastMsg = '';

const TUL_MAP={2:3.5,3:5.5,4:7.5,6:12,7:14,8:16};
const getTUL=j=>TUL_MAP[j]||j*2;

function showToast(m){toastMsg=m; render(); setTimeout(()=>{toastMsg=''; render();},3000);}

async function fetchData(){
  loading=true; render();
  try{
    const res = await fetch(SYNC_URL+'?action=read&t='+Date.now());
    const json = await res.json();
    if(Array.isArray(json)){
      allData = json.map((row,i)=>({
        rowIndex: row.rowIndex || i+2,
        id: row.id || row.rowIndex || i,
        tanggal: row.tanggal || row[0],
        nik: row.nik || row[1],
        nama: row.nama || row[2],
        jam: Number(row.jam || row[3]||0),
        tul: Number(row.tul || row[4]||0),
        keterangan: row.keterangan || row[5]||'lembur',
        inputOleh: row.inputOleh || row[6]||'',
        catatan: row.catatan || '',
        timestamp: row.timestamp || ''
      })).filter(r=>r.nik && r.tanggal);
    }
  }catch(e){ console.log(e); showToast('Gagal ambil dari Sheet, pakai cache'); }
  // fetch karyawan
  try{
    const res2 = await fetch(SYNC_URL+'?action=readKaryawan&t='+Date.now());
    const k = await res2.json();
    if(Array.isArray(k) && k.length>0){
      karyawanList = k;
      localStorage.setItem('rk_kar_admin', JSON.stringify(karyawanList));
    }
  }catch(e){ console.log('karyawan fetch fail', e); }

  // fallback karyawan dari lembur
  if(karyawanList.length===0){
    const uniq={};
    allData.forEach(r=>{ if(!uniq[r.nik]) uniq[r.nik]={nik:r.nik,nama:r.nama,pass:'1234'}; });
    karyawanList = Object.values(uniq);
  }

  loading=false; render();
}

function loginAdmin(){
  const p=document.getElementById('apass').value;
  if(p===ADMIN_PASS){localStorage.setItem('admin_login','true'); isLogin=true; fetchData();}
  else document.getElementById('aerr').innerText='Password salah (default admin123)';
}
function logout(){localStorage.removeItem('admin_login'); isLogin=false; render();}

function filteredData(){
  let data=[...allData];
  // filter bulan tahun
  if(filterBulan!=='all'){
    data=data.filter(x=>{
      let m='';
      const t = String(x.tanggal);
      if(t.includes('-')){ const parts=t.split('-'); m = parts[1] ? String(parseInt(parts[1])) : ''; if(parts[0].length!==4) m = String(parseInt(parts[1]||'')); }
      else if(t.includes('/')) m=String(parseInt(t.split('/')[1]));
      else { try{ m=String(new Date(t).getMonth()+1);}catch{} }
      return m===String(parseInt(filterBulan));
    });
  }
  if(filterTahun!=='all'){
    data=data.filter(x=>{
      const t=String(x.tanggal);
      let y='';
      if(t.includes('-')){ y = t.split('-')[0].length===4 ? t.split('-')[0] : t.split('-')[2]; }
      else if(t.includes('/')) y=t.split('/')[2];
      else y=String(new Date(t).getFullYear());
      return String(y)===filterTahun;
    });
  }
  if(search.trim()){
    const s=search.toLowerCase();
    data=data.filter(x=> (x.nik||'').toLowerCase().includes(s) || (x.nama||'').toLowerCase().includes(s));
  }
  return data.sort((a,b)=> new Date(b.tanggal)-new Date(a.tanggal));
}

function groupByKaryawan(data){
  const map={};
  data.forEach(r=>{
    if(!map[r.nik]) map[r.nik]={nik:r.nik,nama:r.nama,totalJam:0,totalTUL:0,hari:0,rows:[]};
    map[r.nik].totalJam+=Number(r.jam);
    map[r.nik].totalTUL+=Number(r.tul);
    map[r.nik].hari+=1;
    map[r.nik].rows.push(r);
  });
  return Object.values(map).sort((a,b)=>b.totalTUL-a.totalTUL);
}

async function handleAddLembur(){
  const tgl=document.getElementById('atgl').value;
  const nik=document.getElementById('anik').value.trim().toUpperCase();
  const nama=document.getElementById('anama').value.trim();
  const jam=parseInt(document.getElementById('ajam').value);
  if(!tgl||!nik||!nama||!jam) return showToast('Lengkapi semua field');
  const payload={tanggal:tgl,nik,nama,jam,tul:getTUL(jam),keterangan:'lembur',inputOleh:'ADMIN',catatan:'Input via Admin'};
  try{
    await fetch(SYNC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    allData.unshift({...payload,rowIndex:0,id:Date.now(),timestamp:new Date().toLocaleString()});
    showToast(`✅ ${nama} ${jam} jam ditambahkan`);
    render();
  }catch(e){ showToast('❌ Gagal simpan'); }
}

async function handleDelete(rowIndex, tanggal, nik){
  if(!confirm(`Hapus data ${nik} tanggal ${tanggal}?`)) return;
  try{
    const url = `${SYNC_URL}?action=delete&row=${rowIndex}&nik=${encodeURIComponent(nik)}&tanggal=${encodeURIComponent(tanggal)}`;
    await fetch(url, {mode:'no-cors'});
    // hapus lokal
    allData = allData.filter(r=> r.rowIndex!==rowIndex);
    showToast('🗑️ Dihapus (refresh untuk sinkron penuh)');
    render();
  }catch(e){ showToast('Gagal hapus'); }
}

async function handleResetPass(nik){
  if(!confirm(`Reset password ${nik} jadi 1234?`)) return;
  const k = karyawanList.find(x=>x.nik===nik);
  if(k){ k.pass='1234'; localStorage.setItem('rk_kar_admin', JSON.stringify(karyawanList)); }
  // sync ke sheet karyawan
  try{
    await fetch(SYNC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'resetPass',nik, newPass:'1234'})});
    showToast(`🔑 Password ${nik} direset ke 1234`);
  }catch(e){ showToast('Reset lokal saja'); }
  render();
}

async function handleAddKaryawan(){
  const nik=document.getElementById('knik').value.trim().toUpperCase();
  const nama=document.getElementById('knama').value.trim();
  const pass=document.getElementById('kpass').value.trim()||'1234';
  if(!nik||!nama) return showToast('NIK & Nama wajib');
  if(karyawanList.some(x=>x.nik===nik)) return showToast('NIK sudah ada');
  karyawanList.push({nik,nama,pass});
  localStorage.setItem('rk_kar_admin', JSON.stringify(karyawanList));
  try{
    await fetch(SYNC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'addKaryawan',nik,nama,pass})});
  }catch{}
  showToast(`✅ Karyawan ${nik} ditambah`);
  document.getElementById('knik').value=''; document.getElementById('knama').value=''; document.getElementById('kpass').value='';
  render();
}

function handleDeleteKaryawan(nik){
  if(!confirm(`Hapus karyawan ${nik}? Data lemburnya tetap ada.`)) return;
  karyawanList = karyawanList.filter(x=>x.nik!==nik);
  localStorage.setItem('rk_kar_admin', JSON.stringify(karyawanList));
  showToast('🗑️ Karyawan dihapus (lokal)');
  render();
}

function exportExcel(){
  const data=filteredData();
  let csv='Tanggal,NIK,Nama,Jam,TUL,Keterangan,Input Oleh,Timestamp\n';
  data.forEach(r=>{ csv+=`"${r.tanggal}","${r.nik}","${r.nama}",${r.jam},${r.tul},"${r.keterangan}","${r.inputOleh}","${r.timestamp}"\n`; });
  const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`Admin-Rekap-${filterBulan}-${filterTahun}.csv`; a.click();
}

function exportPDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  const data=filteredData();
  const grouped=groupByKaryawan(data);
  const bulanNama=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const label=`${filterBulan==='all'?'Semua Bulan':bulanNama[parseInt(filterBulan)]} ${filterTahun==='all'?'':filterTahun}`;
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text(`ADMIN - Riwayat Total TUL Karyawan - ${label}`,14,16);
  doc.setFontSize(10); doc.setFont('helvetica','normal'); doc.text(`Total ${grouped.length} karyawan | ${data.length} data | Total ${data.reduce((a,b)=>a+b.jam,0)} jam | ${data.reduce((a,b)=>a+b.tul,0)} TUL`,14,22);
  const rows=grouped.map((g,i)=>[i+1,g.nik,g.nama,`${g.totalJam} jam`, `${g.totalTUL} TUL`, `${g.hari} hari`]);
  doc.autoTable({startY:26, head:[['No','NIK','Nama','Total Jam','Total TUL','Hari']], body:rows, styles:{fontSize:9}});
  doc.save(`Riwayat-TUL-${filterBulan}-${filterTahun}.pdf`);
}

    app.innerHTML=`<div class="min-h-screen grid place-items-center p-4 bg-zinc-900">

  app.innerHTML=`<div class="max-w-[1440px] mx-auto min-h-screen">

    <div class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b">

            <div class="font-bold text-[14px]">Admin Super • Rekap Lembur</div>
            <div class="text-[10px] text-zinc-500 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-green-500"></span>${data.length} data • ${grouped.length} karyawan • ${labelBulan} ${filterTahun}</div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="fetchData()" class="h-8 px-3 rounded-full bg-zinc-100 text-[11px] font-bold">${loading?'⏳':'🔄'} Refresh</button>
          <a href="./" class="h-8 px-3 rounded-full bg-zinc-900 text-white text-[11px] font-bold grid place-items-center">App Karyawan</a>
          <button onclick="logout()" class="h-8 px-3 rounded-full border text-[11px] font-bold">Logout</button>
        </div>
      </div>
      <!-- TAB -->
      <div class="px-4 md:px-6 flex gap-2 py-2 overflow-x-auto">
        ${['dashboard','lembur','karyawan','riwayat'].map(t=>{
          const label={dashboard:'Dashboard',lembur:'Data Lembur (Tambah/Hapus)',karyawan:'Karyawan & Reset Password',riwayat:'Riwayat Total TUL'}[t];
          return `<button onclick="tab='${t}';render()" class="h-8 px-4 rounded-full text-[12px] font-bold whitespace-nowrap ${tab===t?'bg-zinc-900 text-white':'bg-zinc-100 text-zinc-600'}">${label}</button>`;
        }).join('')}
      </div>
    </div>

    <div class="p-3 md:p-6 space-y-4">
      <!-- FILTER GLOBAL -->
      <div class="rounded-[16px] bg-white border p-3 flex flex-col md:flex-row gap-2 items-end">
        <div class="flex gap-2 flex-1">
          <div class="flex-1"><div class="text-[10px] font-bold uppercase text-zinc-500 mb-1">Bulan</div><select onchange="filterBulan=this.value;render()" class="w-full h-9 rounded-xl border bg-zinc-50 px-3 text-[13px] font-semibold"><option value="all" ${filterBulan==='all'?'selected':''}>Semua Bulan</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${filterBulan==i+1?'selected':''}>${bulanNama[i+1]}</option>`).join('')}</select></div>
          <div class="flex-1"><div class="text-[10px] font-bold uppercase text-zinc-500 mb-1">Tahun</div><select onchange="filterTahun=this.value;render()" class="w-full h-9 rounded-xl border bg-zinc-50 px-3 text-[13px] font-semibold"><option value="all" ${filterTahun==='all'?'selected':''}>Semua Tahun</option><option value="2024" ${filterTahun==='2024'?'selected':''}>2024</option><option value="2025" ${filterTahun==='2025'?'selected':''}>2025</option><option value="2026" ${filterTahun==='2026'?'selected':''}>2026</option></select></div>
          <div class="flex-[2]"><div class="text-[10px] font-bold uppercase text-zinc-500 mb-1">Cari NIK/Nama</div><input value="${search}" oninput="search=this.value;render()" placeholder="K001 / Budi" class="w-full h-9 rounded-xl border bg-zinc-50 px-3 text-[13px]"></div>

        <div class="flex gap-2">
          <button onclick="exportExcel()" class="h-9 px-4 rounded-xl bg-white border text-[12px] font-bold">Excel</button>
          <button onclick="exportPDF()" class="h-9 px-4 rounded-xl bg-indigo-600 text-white text-[12px] font-bold">Export PDF TUL</button>

      </div>

      ${tab==='dashboard'?`
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <div class="rounded-[18px] bg-zinc-900 text-white p-4"><div class="text-[10px] uppercase opacity-60">TOTAL JAM • ${labelBulan.toUpperCase()}</div><div class="text-[32px] font-extrabold mt-2 leading-none">${totalJam}</div><div class="text-[11px] opacity-60 mt-1">${data.length} data lembur</div></div>
          <div class="rounded-[18px] bg-indigo-600 text-white p-4"><div class="text-[10px] uppercase opacity-70">TOTAL TUL</div><div class="text-[32px] font-extrabold mt-2 leading-none">${totalTUL}</div><div class="text-[11px] opacity-70 mt-1">poin TUL • ${labelBulan}</div></div>
          <div class="rounded-[18px] bg-white border p-4"><div class="text-[10px] uppercase font-bold text-zinc-500">KARYAWAN</div><div class="text-[32px] font-extrabold mt-2 leading-none">${grouped.length}</div><div class="text-[11px] text-zinc-500 mt-1">orang aktif</div></div>
          <div class="rounded-[18px] bg-white border p-4"><div class="text-[10px] uppercase font-bold text-zinc-500">RATA-RATA TUL</div><div class="text-[28px] font-bold mt-2 leading-none">${grouped.length? (totalTUL/grouped.length).toFixed(1):0}</div><div class="text-[11px] text-zinc-500 mt-1">per karyawan</div></div>
        </div>
        <div class="rounded-[20px] bg-white border overflow-hidden">
          <div class="px-5 py-3 border-b font-bold text-[13px]">Top Karyawan TUL Tertinggi • ${labelBulan}</div>
          <div class="divide-y">${grouped.slice(0,10).map((g,i)=>`<div class="px-5 py-3 flex items-center gap-3"><div class="w-7 h-7 rounded-full bg-zinc-900 text-white grid place-items-center text-[11px] font-bold">${i+1}</div><div class="flex-1"><div class="font-bold text-[13px]">${g.nama} <span class="font-mono text-[11px] text-zinc-500">${g.nik}</span></div><div class="text-[11px] text-zinc-500">${g.hari} hari • ${g.totalJam} jam</div></div><div class="text-right"><div class="font-extrabold text-[16px] text-indigo-600">${g.totalTUL}</div><div class="text-[10px] text-zinc-500">TUL</div></div></div>`).join('') || '<div class="p-6 text-center text-zinc-500 text-[12px]">Tidak ada data</div>'}</div>
        </div>
      `:''}

      ${tab==='lembur'?`
        <div class="grid md:grid-cols-[360px_1fr] gap-4">
          <div class="rounded-[20px] bg-white border p-4 h-fit sticky top-[120px]">
            <div class="font-bold text-[13px]">Tambah Data Lembur</div>
            <div class="mt-3 space-y-2">
              <div><div class="text-[10px] font-bold uppercase text-zinc-500 mb-1">Tanggal</div><input id="atgl" type="date" value="${new Date().toISOString().slice(0,10)}" class="w-full h-10 rounded-xl border bg-zinc-50 px-3 text-[13px]"></div>
              <div><div class="text-[10px] font-bold uppercase text-zinc-500 mb-1">NIK</div><input id="anik" placeholder="K001" class="w-full h-10 rounded-xl border bg-zinc-50 px-3 text-[13px] font-mono uppercase"></div>
              <div><div class="text-[10px] font-bold uppercase text-zinc-500 mb-1">Nama</div><input id="anama" placeholder="Budi Santoso" class="w-full h-10 rounded-xl border bg-zinc-50 px-3 text-[13px]"></div>

              <button onclick="handleAddLembur()" class="w-full h-11 rounded-xl bg-zinc-900 text-white font-bold text-[13px] mt-2">simpan</button>
              <div class="text-[10px] text-zinc-500">Data akan langsung sync ke Spreadsheet & muncul di app karyawan setelah refresh.</div>
            </div>
          </div>
          <div class="rounded-[20px] bg-white border overflow-hidden">
            <div class="px-5 py-4 border-b flex justify-between items-center"><div class="font-bold text-[13px]">Data Lembur • ${data.length} data</div><div class="text-[11px] text-zinc-500">${labelBulan} ${filterTahun}</div></div>

            ${data.length>200?`<div class="p-3 bg-amber-50 text-[11px] text-center text-amber-800">Tampilkan 200 dari ${data.length}. Export Excel untuk semua.</div>`:''}
          </div>
        </div>
      `:''}

      ${tab==='karyawan'?`
        <div class="grid md:grid-cols-[360px_1fr] gap-4">
          <div class="rounded-[20px] bg-white border p-4 h-fit">
            <div class="font-bold text-[13px]">Tambah Karyawan</div>
            <div class="mt-3 space-y-2">
              <input id="knik" placeholder="NIK / NPK (K001)" class="w-full h-10 rounded-xl border bg-zinc-50 px-3 text-[13px] font-mono uppercase">
              <input id="knama" placeholder="Nama Lengkap" class="w-full h-10 rounded-xl border bg-zinc-50 px-3 text-[13px]">
              <input id="kpass" placeholder="Password (default 1234)" class="w-full h-10 rounded-xl border bg-zinc-50 px-3 text-[13px]">
              <button onclick="handleAddKaryawan()" class="w-full h-11 rounded-xl bg-zinc-900 text-white font-bold text-[13px]">Tambah Karyawan</button>
            </div>
          </div>
          <div class="rounded-[20px] bg-white border overflow-hidden">
            <div class="px-5 py-4 border-b font-bold text-[13px]">Daftar Karyawan • ${karyawanList.length} orang</div>
            <div class="overflow-x-auto"><table class="w-full text-[12px]"><thead class="bg-zinc-50 text-[10px] uppercase font-bold text-zinc-500"><tr><th class="text-left px-4 py-2.5">NIK</th><th class="text-left px-4 py-2.5">Nama</th><th class="text-left px-4 py-2.5">Password</th><th class="text-right px-4 py-2.5">Aksi</th></tr></thead><tbody class="divide-y">${karyawanList.filter(k=>!search || k.nik.toLowerCase().includes(search.toLowerCase()) || k.nama.toLowerCase().includes(search.toLowerCase())).map(k=>`<tr class="hover:bg-zinc-50"><td class="px-4 py-3 font-mono font-bold">${k.nik}</td><td class="px-4 py-3 font-medium">${k.nama}</td><td class="px-4 py-3"><span class="font-mono text-[11px] bg-zinc-100 px-2 py-1 rounded-full">${k.pass||'1234'}</span></td><td class="px-4 py-3 text-right flex justify-end gap-1"><button onclick="handleResetPass('${k.nik}')" class="h-7 px-3 rounded-full bg-amber-100 text-amber-800 text-[11px] font-bold">Reset ke 1234</button><button onclick="handleDeleteKaryawan('${k.nik}')" class="h-7 px-2 rounded-full bg-zinc-100 text-zinc-600 text-[11px] font-bold">Hapus</button></td></tr>`).join('') || '<tr><td colspan="4" class="text-center py-8 text-zinc-500">Belum ada karyawan</td></tr>'}</tbody></table></div>
          </div>
        </div>
      `:''}

      ${tab==='riwayat'?`
        <div class="rounded-[20px] bg-white border overflow-hidden">
          <div class="px-5 py-4 border-b flex justify-between items-center"><div class="font-bold text-[13px]">Riwayat Total TUL Karyawan • ${labelBulan} ${filterTahun}</div><div class="text-[11px] text-zinc-500">Filter bulan & tahun aktif • Klik bar untuk detail</div></div>
          <div class="overflow-x-auto">
            <table class="w-full text-[12px]">
              <thead class="bg-zinc-900 text-white text-[10px] uppercase"><tr><th class="text-left px-4 py-3">Rank</th><th class="text-left px-4 py-3">NIK</th><th class="text-left px-4 py-3">Nama</th><th class="text-center px-4 py-3">Hari</th><th class="text-center px-4 py-3">Total Jam</th><th class="text-center px-4 py-3">Total TUL</th><th class="text-left px-4 py-3">Rincian</th></tr></thead>
              <tbody class="divide-y">
                ${grouped.map((g,i)=>`<tr class="hover:bg-indigo-50/50 ${i<3?'bg-amber-50/30':''}"><td class="px-4 py-3 font-bold">${i+1}</td><td class="px-4 py-3 font-mono font-bold">${g.nik}</td><td class="px-4 py-3 font-bold">${g.nama}</td><td class="px-4 py-3 text-center"><span class="px-2 py-0.5 rounded-full bg-zinc-100">${g.hari}</span></td><td class="px-4 py-3 text-center font-bold">${g.totalJam}</td><td class="px-4 py-3 text-center"><span class="px-3 py-1 rounded-full bg-indigo-600 text-white font-extrabold">${g.totalTUL}</span></td><td class="px-4 py-3 text-[11px] text-zinc-600">${g.rows.slice(0,3).map(r=>`${r.tanggal}:${r.jam}j`).join(' • ')}${g.rows.length>3?` • +${g.rows.length-3} lagi`:''}</td></tr>`).join('') || '<tr><td colspan="7" class="text-center py-10 text-zinc-500">Tidak ada data di periode ini</td></tr>'}
              </tbody>
              <tfoot class="bg-zinc-50 font-bold border-t"><tr><td colspan="4" class="px-4 py-3 text-right">TOTAL:</td><td class="px-4 py-3 text-center">${totalJam}</td><td class="px-4 py-3 text-center">${totalTUL}</td><td class="px-4 py-3"></td></tr></tfoot>
            </table>
          </div>
        </div>
      `:''}

      ${toastMsg?`<div class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-zinc-900 text-white px-5 py-2.5 rounded-full text-[12px] shadow-2xl z-50">${toastMsg}</div>`:''}
    </div>
  </div>`;
}

if(isLogin) fetchData(); else render();
</script>
</body>
</html>
