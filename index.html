var SHEET_MEMBERS = 'Members'; // Sheet daftar anggota

function getSS() {
  return SpreadsheetApp.getActiveSpreadsheet();
}

function getOrCreateSheet(name) {
  var ss = getSS();
  var sh = ss.getSheetByName(name);
  if (!sh) {
    sh = ss.insertSheet(name);
    if (name === SHEET_DATA) {

}

function normTanggal(t) {
  var s = String(t).trim();
  if (s.indexOf('T') >= 0) s = s.split('T')[0];
  s = s.replace('Z','');
  var m = s.match(/(\\d{4})-(\\d{2})-(\\d{2})/);

}

function jsonpResponse(callback, obj) {

        // filter bulan jika diperlukan

    }

    return jsonpResponse(cbErr, { ok:false, error: String(err) });
  }
}
