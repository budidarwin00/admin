<!DOCTYPE html>
<html lang="id"><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");

</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AREA EF - Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#f8fafc;color:#111;min-height:100vh;-webkit-font-smoothing:antialiased}
.header{position:sticky;top:0;z-index:20;background:#0e7490;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.h-left{font-size:18px;font-weight:800;color:#fff;letter-spacing:0.02em}
.btn-keluar{background:#111;color:#fff;border:none;height:36px;padding:0 18px;border-radius:9999px;font-size:13px;font-weight:700;cursor:pointer}
.filter-bar{background:#fff;padding:12px 20px;border-bottom:1px solid #e2e8f0;display:flex;gap:8px;align-items:center}
.select-bulan{height:36px;padding:0 14px;border-radius:9999px;border:1px solid #e2e8f0;background:#f1f5f9;font-size:13px;font-weight:600;cursor:pointer}
.container{max-width:600px;margin:0 auto;padding:0 0 40px 0}
.tgl-card{background:#fff;border-radius:16px;margin:16px 16px 0 16px;overflow:hidden;box-shadow:none;border:1px solid #f1f5f9}
.tgl-card-header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid #f8fafc}
.tgl-date{font-size:16px;font-weight:800;color:#111}
.tgl-meta{font-size:13px;color:#94a3b8;margin-top:2px}
.btn-hapus-tgl{background:#f8fafc;border:1px solid #f1f5f9;color:#64748b;height:32px;padding:0 14px;border-radius:9999px;font-size:12px;font-weight:600;cursor:pointer}
.row-item{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #f8fafc}
.row-item:last-child{border-bottom:none}
.row-left{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:#f1f5f9;border:1px solid #f1f5f9;display:grid;place-items:center;font-size:14px;font-weight:700;color:#334155}
.row-name{font-size:15px;font-weight:600;color:#111}
.row-tul{font-size:13px;color:#94a3b8;margin-top:2px}
.btn-x{width:32px;height:32px;border-radius:50%;background:#f8fafc;border:none;color:#94a3b8;font-size:16px;cursor:pointer;display:grid;place-items:center}
.btn-x:hover{background:#fee2e2;color:#dc2626}
.rekap-card{background:#fff;border-radius:16px;margin:16px;padding:16px;box-shadow:none;border:1px solid #f1f5f9}
.input-wrap{background:#fff;border-radius:16px;margin:16px;padding:18px;box-shadow:none;border:1px solid #f1f5f9}
.btn-pill{height:40px;padding:0 18px;border-radius:9999px;border:1px solid #e2e8f0;background:#fff;font-size:13px;font-weight:600;cursor:pointer}
.btn-pill-black{background:#111;color:#fff;border-color:#111}
.empty{padding:80px 20px;text-align:center;color:#94a3b8;font-size:13px}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff}
.login-input{width:100%;height:48px;border:none;border-bottom:2px solid #111;background:transparent;padding:0;font-size:16px;font-weight:600;outline:none}
.login-btn{width:100%;height:48px;background:#000;color:#fff;border-radius:9999px;border:none;font-size:14px;font-weight:700;margin-top:24px;cursor:pointer}
.inp-tgl{flex:1;height:44px;border:1px solid #e2e8f0;border-radius:10px;padding:0 12px;font-size:14px;font-weight:600}
.inp-jam{width:140px;height:44px;border:1px solid #e2e8f0;border-radius:10px;padding:0 10px;font-size:13px;font-weight:600}
.grid-anggota{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:300px;overflow:auto;margin-top:12px}
.card-anggota{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;cursor:pointer;font-size:13px;font-weight:600}
.card-anggota.checked{background:#111;color:#fff;border-color:#111}
</style>
</head><body>
<div id="app"></div>
<script>
const SYNC_URL='https://script.google.com/macros/s/AKfycbz-Tgif9wJD6PAidITjE3-55BInA4pHZAibDI3mAIYUp_6DQV8may5oJkwyY0nHx4qE/exec';
const FALLBACK_URL='https://script.google.com/macros/s/AKfycbzUWTx3o5DjsfrM7JTZBbnYYaMBzFLbH3-mfs0dCFm1uOGouvDqCBpc3KOgNPgKNoHL/exec';
const ADMIN_PASS='admin123';
const TUL_MAP={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};
function calcTUL(j){return TUL_MAP[j]||j*1.5;}
function isJamValid(j){j=Number(j);return [2,3,4,6,7,8].includes(j);}
function normNama(n){return String(n||'').trim().toLowerCase();}
function normalizeTanggal(t){
  if(!t)return'';
  let s=String(t).trim();
  // FIX ISO dengan T: 2026-10-01T00:00:00.000Z -> ambil sebelum T
  if(s.includes('T')) s=s.split('T')[0];
  // Hapus Z
  s=s.replace('Z','').trim();
  let iso=s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(iso){return iso[1]+'-'+iso[2]+'-'+iso[3];}
  let m=s.match(/(\d{1,2})[\-\/](\d{1,2})[\-\/](\d{4})/);
  if(m){return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}
  m=s.match(/(\d{4})[\-\/](\d{1,2})[\-\/](\d{1,2})/);
  if(m){return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');}
  // Format 01-10-2026 tetap
  m=s.match(/(\d{1,2})[\-\/](\d{1,2})$/);
  if(m){
    let now=new Date();
    return now.getFullYear()+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  }
  try{let d=new Date(s);if(!isNaN(d))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}catch{}
  return s;
}
function formatTanggalDisplay(t){
  let p=normalizeTanggal(t).split('-');
  if(p.length===3) return p[2]+'-'+p[1]+'-'+p[0];
  return t;
}
function parseSort(t){
  let p=normalizeTanggal(t).split('-');
  if(p.length!==3)return 0;
  return new Date(Number(p[0]),Number(p[1])-1,Number(p[2])).getTime();
}
const ALIAS={'kuncoro budi':'Budi','kuncoro':'Budi','budi kuncoro':'Budi','neli':'Nely','nely':'Nely','annisa':'Anisa','aditya zozo':'Aditya','adit':'Aditya','dozen':'Dozen','supri':'Supriyadi','topik':'Topik','zaelani':'Zaelani','aaf':'Aaf'};
function normNamaAnggota(n){if(!n)return'';let k=String(n).trim().toLowerCase();if(ALIAS[k])return ALIAS[k];for(let a in ALIAS){if(k.includes(a))return ALIAS[a];}return String(n).trim().split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');}
const DEFAULT_KARYAWAN=['Aaf','Aditya','Anah','Anisa','Arief','Budi','Dozen','Eka','Nely','Nia','Putri','Supriyadi','Syarif','Topik','Yudi','Zaelani'].map(n=>({nama:n}));
function getKaryawan(){try{let c=localStorage.getItem('custom_karyawan');if(c){let a=JSON.parse(c);if(Array.isArray(a)&&a.length)return a;}}catch{}return DEFAULT_KARYAWAN;}
let allData=[];let isLogin=!!localStorage.getItem('admin_login');
let filterBulan=localStorage.getItem('filterBulan')||'all'; // FIX: default 'all' biar tidak ngikutin bulan sekarang, dan tidak auto reset ke bulan device
let showInput=false;let showKelola=false;
function toast(m){let t=document.createElement('div');t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:9999px;font-size:13px;font-weight:600;z-index:99';t.innerText=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}
function jsonp(url){return new Promise((res,rej)=>{let cb='cb_'+Date.now()+Math.random().toString(36).slice(2);window[cb]=(d)=>{delete window[cb];document.getElementById(cb)?.remove();res(d);};let s=document.createElement('script');s.id=cb;s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&_='+Date.now();s.onerror=()=>{delete window[cb];s.remove();rej();};document.body.appendChild(s);});}
async function fetchData(force=false){
  try{localStorage.removeItem('cache_lembur');}catch{}
  if(force){allData=[];}
  try{
    let j=await jsonp(SYNC_URL+'?action=read&_='+Date.now());
    if(!j||!j.length){try{let j2=await jsonp(FALLBACK_URL+'?action=read&_='+Date.now());if(j2&&j2.length)j=j2;}catch{}}
    if(Array.isArray(j)&&j.length){
      let raw=j.map(r=>{
        let jam=Number(r.jam||0);
        if(!isJamValid(jam))return null;
        let nm=normNamaAnggota(r.nama||r.nik||'');
        if(!nm)return null;
        let norm=normalizeTanggal(r.tanggal);
        if(!norm)return null;
        return{tanggal:r.tanggal,tanggalNorm:norm,nama:nm,jam:jam,tul:calcTUL(jam)};
      }).filter(Boolean);
      allData=raw;
    }
  }catch(e){}
  allData.sort((a,b)=>parseSort(b.tanggalNorm)-parseSort(a.tanggalNorm));
  render();
}
function filtered(){
  if(filterBulan==='all')return allData;
  let target=Number(filterBulan);
  if(isNaN(target))return allData;
  let filteredData=allData.filter(r=>{
    let norm=normalizeTanggal(r.tanggalNorm||r.tanggal);
    let p=norm.split('-');
    if(p.length<2)return false;
    return Number(p[1])===target;
  });
  console.log('FILTER', filterBulan, 'allData', allData.length, 'filtered', filteredData.length);
  return filteredData;
}
function setFilterBulan(v){filterBulan=v;try{localStorage.setItem('filterBulan',v);}catch{}render();}
function groupTanggal(data){
  let m={};
  data.forEach(r=>{
    let key=normalizeTanggal(r.tanggalNorm||r.tanggal);
    if(!key) return;
    if(!m[key])m[key]=[];
    m[key].push(r);
  });
  let keys=Object.keys(m).sort((a,b)=>parseSort(b)-parseSort(a));
  console.log('GROUP KEYS:', keys.length, keys);
  return keys.map(k=>({tanggal:k,rows:m[k]}));
}
function groupKaryawan(data){let m={};data.forEach(r=>{let k=normNama(r.nama);if(!m[k])m[k]={nama:r.nama,total:0,count:0};m[k].total+=r.tul;m[k].count++;});return Object.values(m).sort((a,b)=>b.total-a.total);}
function login(){let p=document.getElementById('apass').value;if(p===ADMIN_PASS){localStorage.setItem('admin_login','1');isLogin=true;fetchData();}else document.getElementById('aerr').innerText='Password salah';}
function logout(){localStorage.removeItem('admin_login');isLogin=false;render();}
function hapusTgl(t){if(!confirm('Hapus semua tanggal '+formatTanggalDisplay(t)+'?'))return;allData=allData.filter(r=>r.tanggalNorm!==t);render();jsonp(SYNC_URL+'?action=deleteTanggal&tanggal='+encodeURIComponent(t.split('-').reverse().join('-'))+'&tanggalISO='+encodeURIComponent(t)+'&_='+Date.now());setTimeout(()=>fetchData(true),1000);}
function hapusOne(t,n,j){if(!confirm('Hapus '+n+' '+j+'j?'))return;allData=allData.filter(r=>!(r.tanggalNorm===t&&normNama(r.nama)===normNama(n)&&Number(r.jam)===Number(j)));render();jsonp(SYNC_URL+'?action=delete&tanggal='+encodeURIComponent(t.split('-').reverse().join('-'))+'&tanggalISO='+encodeURIComponent(t)+'&nama='+encodeURIComponent(n)+'&jam='+j+'&_='+Date.now());setTimeout(()=>fetchData(true),1000);}
function shareWA(){let data=filtered();let gKar=groupKaryawan(data);let total=data.reduce((s,r)=>s+r.tul,0);let bl=document.querySelector('.select-bulan')?.selectedOptions[0]?.text||'Bulan Ini';let txt='*AREA EF - '+bl+'*%0ATotal: '+total+' TUL%0A%0A*REKAP:*%0A';gKar.forEach(k=>{txt+=k.nama+': '+k.total+' TUL ('+k.count+' hari)%0A';});window.open('https://wa.me/?text='+txt,'_blank');}
function toggleCard(el){let cb=el.querySelector('input');cb.checked=!cb.checked;if(cb.checked){el.classList.add('checked');}else{el.classList.remove('checked');}}
function parsePlan(){let txt=(document.getElementById('txtPesan')?.value||'').trim();if(!txt){toast('Tempel plan dulu');return;}let lines=txt.split('\n');let cur='';let items=[];lines.forEach(line=>{line=line.trim();if(!line)return;let m=line.match(/(\d{1,2})[\-\/](\d{1,2})[\-\/](\d{2,4})/);if(m){let d=m[1].padStart(2,'0'),mo=m[2].padStart(2,'0'),y=m[3];if(y.length===2)y='20'+y;cur=d+'-'+mo+'-'+y;return;}let jm=line.match(/(\d{1,2})\s*j/i);if(jm&&cur){let jam=Number(jm[1]);if(!isJamValid(jam))return;let namaPart=line.replace(/\d+\s*j.*/i,'').replace(/[-–—]/g,' ').trim();if(!namaPart)namaPart=line.split(' ')[0];let nm=normNamaAnggota(namaPart);if(nm)items.push({tanggal:cur,nama:nm,jam:jam});}});let cont=document.getElementById('previewPesan');cont.innerHTML=items.length?items.map(it=>'<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;font-weight:600"><span>'+it.tanggal+' - '+it.nama+'</span><span>'+it.jam+'j • '+calcTUL(it.jam)+' TUL</span></div>').join(''):'<div style="font-size:13px;color:#94a3b8">Tidak ada data</div>';cont.style.display='block';cont._items=items;}
async function simpanPlan(){let cont=document.getElementById('previewPesan');let items=cont._items||[];if(!items.length){toast('Preview dulu');return;}toast('Menyimpan '+items.length);try{let fd=new FormData();fd.append('action','addBulk');fd.append('items',JSON.stringify(items));await fetch(SYNC_URL,{method:'POST',body:fd});}catch{}showInput=false;render();setTimeout(()=>fetchData(true),800);}
function simpanMassal(){
  let dayVal=document.getElementById('massalTgl').value.trim();
  let j=Number(document.getElementById('massalJam').value);
  if(!dayVal){toast('Isi tanggal 1-31');return;}
  let d=Number(dayVal);
  if(d<1||d>31){toast('Tanggal 1-31');return;}
  if(!isJamValid(j)){toast('Pilih jam');return;}
  let checked=document.querySelectorAll('#gridAnggota input:checked');
  if(!checked.length){toast('Pilih orang');return;}
  let now=new Date();
  let bln = filterBulan==='all'? (now.getMonth()+1) : Number(filterBulan);
  let thn = now.getFullYear();
  let tglStr = String(d).padStart(2,'0')+'-'+String(bln).padStart(2,'0')+'-'+thn;
  let items=[];checked.forEach(cb=>{items.push({tanggal:tglStr,nama:normNamaAnggota(cb.value),jam:j});});
  (async()=>{toast('Menyimpan '+items.length+' - '+tglStr);try{let fd=new FormData();fd.append('action','addBulk');fd.append('items',JSON.stringify(items));await fetch(SYNC_URL,{method:'POST',body:fd});}catch{}showInput=false;render();fetchData(true);})();
}
function render(){
  if(!isLogin){
    document.getElementById('app').innerHTML='<div class="login-wrap"><div style="width:100%;max-width:320px"><div style="font-size:12px;letter-spacing:0.3em;font-weight:800;margin-bottom:32px">AREA EF</div><input id="apass" type="password" placeholder="Password" class="login-input"><div id="aerr" style="font-size:13px;color:#ef4444;margin-top:10px;min-height:14px;font-weight:600"></div><button onclick="login()" class="login-btn">Masuk</button></div></div>';
    return;
  }
  let data=filtered();let gTgl=groupTanggal(data);let gKar=groupKaryawan(data);
  let html='';
  html+='<div class="header"><div class="h-left">AREA EF</div><button onclick="logout()" class="btn-keluar">Keluar</button></div>';
  html+='<div class="filter-bar"><select onchange="setFilterBulan(this.value)" class="select-bulan"><option value="all" '+(filterBulan==='all'?'selected':'')+'>Semua Bulan</option><option value="1" '+(filterBulan==='1'?'selected':'')+'>Jan</option><option value="2" '+(filterBulan==='2'?'selected':'')+'>Feb</option><option value="3" '+(filterBulan==='3'?'selected':'')+'>Mar</option><option value="4" '+(filterBulan==='4'?'selected':'')+'>Apr</option><option value="5" '+(filterBulan==='5'?'selected':'')+'>Mei</option><option value="6" '+(filterBulan==='6'?'selected':'')+'>Jun</option><option value="7" '+(filterBulan==='7'?'selected':'')+'>Jul</option><option value="8" '+(filterBulan==='8'?'selected':'')+'>Agu</option><option value="9" '+(filterBulan==='9'?'selected':'')+'>Sep</option><option value="10" '+(filterBulan==='10'?'selected':'')+'>Okt</option><option value="11" '+(filterBulan==='11'?'selected':'')+'>Nov</option><option value="12" '+(filterBulan==='12'?'selected':'')+'>Des</option></select><button onclick="shareWA()" class="btn-pill" style="margin-left:auto">Share WA</button></div>';
  html+='<div class="container">';
  html+='<div style="padding:16px"><button onclick="showInput=!showInput;render()" class="btn-pill btn-pill-black">'+(showInput?'Tutup':'Input')+'</button></div>';

  if(showInput){
    html+='<div class="input-wrap">';
    let now=new Date();
    let blnNum = filterBulan==='all'? (now.getMonth()+1) : Number(filterBulan);
    let thnNum = now.getFullYear();
    let blnLabel = ['','Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][blnNum]||'';
    html+='<div><div style="font-size:12px;font-weight:700;margin-bottom:12px">INPUT MASSAL — '+blnLabel+' '+thnNum+'</div><div style="display:flex;gap:8px;margin-bottom:12px"><input id="massalTgl" type="number" min="1" max="31" placeholder="Tgl 1-31" class="inp-tgl"><select id="massalJam" class="inp-jam"><option value="">Jam</option><option value="2">2j • 3.5 TUL</option><option value="3">3j • 5.5 TUL</option><option value="4">4j • 7.5 TUL</option><option value="6">6j • 12 TUL</option><option value="7">7j • 14 TUL</option><option value="8">8j • 17 TUL</option></select></div><div id="gridAnggota" class="grid-anggota">'+getKaryawan().map(k=>'<div class="card-anggota" onclick="toggleCard(this)"><input type="checkbox" value="'+k.nama+'" style="display:none"><span>'+k.nama+'</span></div>').join('')+'</div><button onclick="simpanMassal()" style="margin-top:14px;width:100%;height:44px;background:#111;color:#fff;border-radius:9999px;border:none;font-size:14px;font-weight:700">Simpan Massal</button></div>';
    html+='<div style="margin-top:20px;padding-top:16px;border-top:1px solid #f1f5f9"><div style="font-size:12px;font-weight:700;margin-bottom:8px">PASTE PLAN WA</div><textarea id="txtPesan" style="width:100%;min-height:80px;border:1px solid #e2e8f0;border-radius:10px;padding:10px;font-size:12px" placeholder="18-10-2026\nBudi 6j"></textarea><div id="previewPesan" style="margin-top:10px;display:none"></div><div style="display:flex;gap:8px;margin-top:10px"><button onclick="parsePlan()" class="btn-pill">Preview</button><button onclick="simpanPlan()" class="btn-pill btn-pill-black">Simpan Plan</button></div></div>';
    html+='</div>';
  }

  if(gKar.length){
    html+='<div class="rekap-card"><div style="font-size:12px;font-weight:800;letter-spacing:0.1em;margin-bottom:12px">REKAP PER ANGGOTA — '+data.length+' transaksi</div>';
    for(let k of gKar){
      html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f8fafc"><div><div style="font-size:14px;font-weight:700">'+k.nama+'</div><div style="font-size:11px;color:#94a3b8;margin-top:2px">'+k.count+' hari</div></div><div style="font-size:14px;font-weight:800">'+k.total+' TUL</div></div>';
    }
    html+='</div>';
  }

  let maxShow = window.maxShow || 8;
  if(gTgl.length===0){html+='<div class="empty">TIDAK ADA DATA di sheet data lembur<br><small>Filter: '+filterBulan+' • Total: '+allData.length+' • Coba pilih Semua Bulan</small></div>';}
  else{
    let gShow = gTgl.slice(0,maxShow);
    for(let g of gShow){
      let tglDisplay=formatTanggalDisplay(g.tanggal);
      let totalTUL=g.rows.reduce((s,r)=>s+r.tul,0);
      let orang=g.rows.length;
      html+='<div class="tgl-card"><div class="tgl-card-header"><div><div class="tgl-date">'+tglDisplay+'</div><div class="tgl-meta">'+orang+' orang • '+totalTUL+' TUL</div></div><button onclick="hapusTgl(\''+g.tanggal+'\')" class="btn-hapus-tgl">Hapus</button></div>';
      for(let r of g.rows){
        let initial=r.nama.charAt(0).toUpperCase();
        html+='<div class="row-item"><div class="row-left"><div class="avatar">'+initial+'</div><div><div class="row-name">'+r.nama+'</div><div class="row-tul">'+r.jam+'j • '+r.tul+' TUL</div></div></div><button onclick="hapusOne(\''+r.tanggalNorm+'\',\''+r.nama+'\',\''+r.jam+'\')" class="btn-x">✕</button></div>';
      }
      html+='</div>';
    }
    if(gTgl.length>maxShow){
      html+='<div style="padding:16px"><button onclick="window.maxShow=(window.maxShow||8)+10;render()" class="btn-pill btn-pill-black" style="width:100%">Load lagi ('+(gTgl.length-maxShow)+' tanggal lagi)</button></div>';
    }
  }

}
