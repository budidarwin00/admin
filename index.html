<html lang="id"><head><style>

</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AREA EF</title><script src="https://cdn.tailwindcss.com"></script>
<style>*{font-family:ui-monospace,Menlo,monospace} button{cursor:pointer}</style></head>
<body class="bg-white"><div class="max-w-[440px] mx-auto min-h-screen pb-32">
<header class="flex justify-between items-center px-5 py-4 border-b border-gray-100 sticky top-0 bg-white z-10">
<div class="text-[11px] tracking-[0.2em] text-[#94A3B8]">AREA EF</div>
<button id="monthBtn" class="text-[11px] tracking-[0.2em] text-[#94A3B8]">OKT 2026</button></header>
<div id="loading" class="px-5 py-3 text-[11px] text-[#94A3B8]">Memuat data Sheet...</div>
<div class="px-5 pt-5"><div class="text-[11px] tracking-[0.2em] text-[#94A3B8] mb-3">TOTAL</div><div id="totalBox" class="border border-[#F1F5F9] rounded-2xl p-4 text-[13px]"></div></div>
<div class="px-5 pt-6"><div class="text-[11px] tracking-[0.2em] text-[#94A3B8] mb-3">RIWAYAT — <span id="riwayatTitle">OKT 2026</span></div><div id="riwayatBox" class="space-y-2"></div></div>
<button id="fab" class="fixed bottom-6 right-6 w-14 h-14 bg-black text-white rounded-full flex items-center justify-center text-2xl shadow-[0_8px_24px_rgba(0,0,0,0.2)] z-20">+</button>
<div id="inputSheet" class="fixed inset-0 bg-white z-30 hidden flex-col max-w-[440px] mx-auto">
<div class="flex justify-between items-center px-5 py-4 border-b"><span class="text-[11px] tracking-[0.2em] text-[#94A3B8]">INPUT</span><button id="closeInput" class="text-[11px] border px-3 py-1 rounded-full">TUTUP</button></div>
<div class="p-5 space-y-4 overflow-auto"><div class="flex gap-2"><input id="tglInput" type="number" min="1" max="31" placeholder="Tgl" class="w-[86px] h-11 border-2 border-black rounded-xl text-center font-bold outline-none"><div class="flex gap-1 flex-wrap flex-1" id="jamGrid"></div></div>
<div class="text-[11px] text-[#94A3B8]">NAMA (dari Sheet)</div><div id="namaGrid" class="grid grid-cols-2 gap-2"></div>
<div id="status" class="text-[10px] text-[#94A3B8] h-4"></div></div>
<div class="p-5 mt-auto border-t bg-white sticky bottom-0"><button id="simpanBtn" class="w-full h-12 bg-black text-white rounded-full text-[13px]">Simpan Massal</button></div></div>
<div id="monthModal" class="fixed inset-0 bg-black/30 z-40 hidden"><div class="max-w-[440px] mx-auto bg-white mt-20 rounded-2xl p-5 m-5"><div class="text-[11px] text-[#94A3B8] mb-3">PILIH BULAN</div><div id="monthGrid" class="grid grid-cols-4 gap-2"></div><button id="closeMonth" class="mt-4 w-full h-10 border rounded-full text-[11px]">TUTUP</button></div></div></div>
<script>
const ENDPOINT="https://script.google.com/macros/s/AKfycbz-Tgif9wJD6PAidITjE3-55BInA4pHZAibDI3mAIYUp_6DQV8may5oJkwyY0nHx4qE/exec";
const SHEET_ID="1puDZArSMAgbqH4RdxNUB2VPDemhCuHiJqES3gueeZ-I";
let selectedMonth=9, selectedYear=2026, selectedJam=null, selectedTgl=new Date().getDate(), selectedNames=new Set(), allData=[];
const JAM_TUL={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};
const MONTHS=["JAN","FEB","MAR","APR","MEI","JUN","JUL","AGU","SEP","OKT","NOV","DES"];
const FALLBACK=["Aaf","Aditya","Anah","Anisa","Arief","Budi","Dozen","Eka","Nely","Nia","Putri","Supriyadi","Syarif","Topik","Yudi","Zaelani"];
function titleCase(s){return String(s).trim().toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());}
function parseDash(d){
 if(!d) return null;
 let s=String(d).trim();
 if(s.includes("Date(")){ let m=s.match(/Date\((\d+),(\d+),(\d+)\)/); if(m) return {d:+m[3],m:+m[2],y:+m[1]}; }
 let parts=s.split(/[-/]/); if(parts.length>=3){ let dd=parseInt(parts[0]), mm=parseInt(parts[1]), yy=parseInt(parts[2]); if(yy<100) yy+=2000; return {d:dd,m:mm-1,y:yy}; }
 return null;
}
async function fetchGviz(){
 try{
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Data%20Lembur&range=A:E`;
  const res=await fetch(url); const txt=await res.text();
  const jsonStr=txt.substring(txt.indexOf("{"), txt.lastIndexOf("}")+1);
  const data=JSON.parse(jsonStr); const rows=data.table.rows||[]; const out=[];
  for(const r of rows){ const c=r.c||[]; const a=c[0]?.f||c[0]?.v||"", b=c[1]?.v||"", d=c[3]?.v||c[3]?.f||""; if(!a&&!b) continue; out.push({tanggal:String(a), nama:String(b), jam:String(d).replace(/[^0-9]/g,"")}); }
  return out;
 }catch(e){ console.log(e); return null; }
}
async function fetchApps(){
 try{ const res=await fetch(ENDPOINT+"?action=read",{cache:"no-store"}); const j=await res.json(); if(Array.isArray(j)) return j.map(x=>({tanggal:x.tanggal||"", nama:x.nama||"", jam:String(x.jam||"").replace(/[^0-9]/g,"")})); return null; }catch(e){return null;}
}
async function loadData(){
 document.getElementById("loading").textContent="Memuat data Sheet..."; document.getElementById("loading").style.display="block";
 let data=await fetchGviz(); if(!data||data.length==0) data=await fetchApps();
 if(data&&data.length>0){ allData=data; localStorage.setItem("ef_lembur",JSON.stringify(data)); }
 else { try{ allData=JSON.parse(localStorage.getItem("ef_lembur")||"[]"); }catch{ allData=[]; } }
 document.getElementById("loading").style.display="none"; render();
}
function render(){
 const filtered=allData.filter(x=>{ const p=parseDash(x.tanggal); return p&&p.m===selectedMonth&&p.y===selectedYear; });
 const namesSet=new Map(); for(const r of allData){ const n=titleCase(r.nama); if(n) namesSet.set(n.toLowerCase(),n); }
 const names=namesSet.size? Array.from(namesSet.values()).sort(): FALLBACK;
 const ng=document.getElementById("namaGrid"); ng.innerHTML="";
 for(const n of names){ const b=document.createElement("button"); b.textContent=n; b.className=`h-10 border rounded-xl text-[13px] ${selectedNames.has(n)?'bg-black text-white border-black':'bg-white border-[#E2E8F0]'}`; b.onclick=()=>{ if(selectedNames.has(n)) selectedNames.delete(n); else selectedNames.add(n); renderNamesOnly(); }; ng.appendChild(b); }
 const totalBox=document.getElementById("totalBox");
 if(filtered.length==0) totalBox.innerHTML=`<div class="text-[#94A3B8]">Belum ada data di ${MONTHS[selectedMonth]} ${selectedYear}. Tap + untuk input.</div>`;
 else{ const by={}; for(const r of filtered){ const n=titleCase(r.nama); const j=parseInt(r.jam)||0; if(!by[n]) by[n]={hari:0,tul:0}; by[n].hari++; by[n].tul+=JAM_TUL[j]||0; } let html=""; for(const [k,v] of Object.entries(by).sort()) html+=`<div class="flex justify-between py-2 border-b border-[#F8FAFC] last:border-0"><span>${k}</span><span>${v.hari} hari • ${v.tul} TUL</span></div>`; totalBox.innerHTML=html; }
 const rb=document.getElementById("riwayatBox"); const byDate={}; for(const r of filtered){ if(!byDate[r.tanggal]) byDate[r.tanggal]=[]; byDate[r.tanggal].push(r); }
 rb.innerHTML=""; const sorted=Object.keys(byDate).sort((a,b)=>{ const pa=parseDash(a),pb=parseDash(b); if(!pa||!pb) return 0; return new Date(pa.y,pa.m,pa.d)-new Date(pb.y,pb.m,pb.d); });
 if(sorted.length==0) rb.innerHTML=`<div class="text-[#94A3B8] text-[13px]">Tidak ada riwayat.</div>`;
 else for(const d of sorted.reverse()){ const arr=byDate[d]; const p=parseDash(d); const label=p?`${String(p.d).padStart(2,"0")} ${MONTHS[p.m].toLowerCase()} ${p.y} ${arr.length} orang`:`${d} ${arr.length} orang`; const div=document.createElement("div"); div.className="border border-[#F1F5F9] rounded-2xl p-3"; div.innerHTML=`<button class="w-full flex justify-between text-[13px]"><span>${label}</span><span class="text-[#94A3B8]">∨</span></button><div class="hidden mt-3 space-y-1 text-[12px]"></div>`; const btn=div.querySelector("button"), det=div.querySelector("div"); btn.onclick=()=>{ if(det.classList.contains("hidden")){ det.classList.remove("hidden"); let ht=""; const gb={}; for(const r of arr){ const n=titleCase(r.nama); const j=parseInt(r.jam)||0; if(!gb[n]) gb[n]=0; gb[n]+=JAM_TUL[j]||0; } for(const [k,v] of Object.entries(gb)) ht+=`<div class="flex justify-between"><span>${k}</span><span>${v} TUL</span></div>`; ht+=`<button class="mt-3 w-full h-8 bg-red-50 text-red-600 rounded-full text-[11px] del">Hapus tanggal ini</button>`; det.innerHTML=ht; det.querySelector(".del").onclick=async()=>{ if(confirm("Hapus "+d+"?")) await deleteDate(d); }; } else det.classList.add("hidden"); }; rb.appendChild(div); }
 document.getElementById("riwayatTitle").textContent=`${MONTHS[selectedMonth]} ${selectedYear}`; document.getElementById("monthBtn").textContent=`${MONTHS[selectedMonth]} ${selectedYear}`;
}
function renderNamesOnly(){ const ng=document.getElementById("namaGrid"); for(const b of ng.children){ const n=b.textContent; b.className=`h-10 border rounded-xl text-[13px] ${selectedNames.has(n)?'bg-black text-white border-black':'bg-white border-[#E2E8F0]'}`; } }
async function deleteDate(tgl){ const s=document.getElementById("status"); s.textContent="Menghapus..."; try{ await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"delete",tanggal:tgl})}); await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"delete_date",tanggal:tgl})}); }catch(e){} setTimeout(()=>{ loadData(); s.textContent="Terhapus"; setTimeout(()=>s.textContent="",2000); },1200); }
document.getElementById("fab").onclick=()=>{ document.getElementById("inputSheet").classList.remove("hidden"); document.getElementById("inputSheet").classList.add("flex"); document.getElementById("tglInput").value=selectedTgl; };
document.getElementById("closeInput").onclick=()=>{ document.getElementById("inputSheet").classList.add("hidden"); };
document.getElementById("monthBtn").onclick=()=>{ document.getElementById("monthModal").classList.remove("hidden"); };
document.getElementById("closeMonth").onclick=()=>{ document.getElementById("monthModal").classList.add("hidden"); };
const jamGrid=document.getElementById("jamGrid"); [2,3,4,6,7,8].forEach(j=>{ const b=document.createElement("button"); b.textContent=j+"j"; b.className="px-3 h-11 border rounded-xl text-[13px]"; b.onclick=()=>{ selectedJam=j; for(const x of jamGrid.children) x.className="px-3 h-11 border rounded-xl text-[13px]"; b.className="px-3 h-11 bg-black text-white rounded-xl text-[13px] border-black"; }; jamGrid.appendChild(b); });
const mg=document.getElementById("monthGrid"); for(let y=2024;y<=2027;y++){ for(let m=0;m<12;m++){ const b=document.createElement("button"); b.textContent=MONTHS[m]+" "+y; b.className=`h-10 border rounded-xl text-[11px] ${m===selectedMonth&&y===selectedYear?'bg-black text-white':''}`; b.onclick=()=>{ selectedMonth=m; selectedYear=y; document.getElementById("monthModal").classList.add("hidden"); render(); }; mg.appendChild(b); }}
document.getElementById("simpanBtn").onclick=async()=>{
 const tglVal=parseInt(document.getElementById("tglInput").value); if(!tglVal||!selectedJam||selectedNames.size==0){ alert("Isi Tgl, Jam, Nama"); return; }
 const dash=`${String(tglVal).padStart(2,"0")}-${String(selectedMonth+1).padStart(2,"0")}-${selectedYear}`;
 const slash=`${String(tglVal).padStart(2,"0")}/${String(selectedMonth+1).padStart(2,"0")}/${selectedYear}`;
 const rows=[]; for(const n of selectedNames) rows.push([dash,n,"",String(selectedJam),slash]);
 const s=document.getElementById("status"); s.textContent=`Mengirim ${rows.length} data ke Sheet...`;
 try{
  await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"bulk",rows})});
  for(const n of selectedNames) await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"save",tanggal:dash,nama:n,jam:String(selectedJam)})});
 }catch(e){}
 s.textContent="Terkirim! Memuat ulang...";
 setTimeout(async()=>{ await loadData(); s.textContent="Tersimpan di Sheet - cek baris akhir"; selectedNames.clear(); renderNamesOnly(); setTimeout(()=>{ s.textContent=""; document.getElementById("inputSheet").classList.add("hidden"); },1500); },1500);
};
loadData();
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
