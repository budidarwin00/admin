<!DOCTYPE html>
<html lang="id"><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {

}
</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AREA EF - Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#fff;color:#111;min-height:100vh}
.mono{font-family:JetBrains Mono,Menlo,monospace}
.header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,0.96);backdrop-filter:blur(12px);border-bottom:1px solid #f1f5f9;padding:12px 20px;display:flex;justify-content:space-between;align-items:flex-start}
.h-left{font-size:11px;letter-spacing:0.25em;color:#94a3b8;padding-top:8px}
.h-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.h-top{display:flex;gap:8px;align-items:center}
.select-bulan{height:34px;padding:0 30px 0 14px;border-radius:9999px;border:1px solid #e2e8f0;background:#f8fafc;font-size:12px;appearance:none;cursor:pointer}
.btn-keluar{height:34px;padding:0 12px;border:none;background:none;font-size:12px;color:#64748b;cursor:pointer}
.btn-share-wa{height:32px;padding:0 14px;border-radius:9999px;border:1px solid #e2e8f0;background:#fff;font-size:11px;cursor:pointer}
.container{max-width:560px;margin:0 auto;padding:28px 20px}
.total-row{display:flex;align-items:baseline;gap:8px;margin-bottom:20px}
.total-num{font-family:JetBrains Mono;font-size:52px;font-weight:300;line-height:1;letter-spacing:-0.04em}
.total-label{font-size:10px;letter-spacing:0.2em;color:#94a3b8}
.action-row{display:flex;gap:8px;margin-bottom:28px}
.pill{height:38px;padding:0 18px;border-radius:9999px;border:1px solid #e2e8f0;background:#f8fafc;font-size:12px;cursor:pointer}
.pill-black{background:#000;color:#fff;border-color:#000}
.input-wrap{border:1.5px solid #111;border-radius:20px;padding:18px;margin-bottom:32px}
.input-title{font-family:JetBrains Mono;font-size:11px;letter-spacing:0.12em;margin-bottom:12px}
.row-tgl-jam{display:flex;gap:8px;margin-bottom:12px}
.inp-tgl{flex:1;height:40px;border:1px solid #e2e8f0;border-radius:12px;padding:0 12px;font-size:13px}
.inp-jam{width:80px;height:40px;border:1px solid #e2e8f0;border-radius:12px;padding:0 12px;font-size:13px}
.grid-anggota{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:300px;overflow:auto;padding:2px}
.card-anggota{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;cursor:pointer}
.card-anggota.checked{background:#111;color:#fff;border-color:#111}
.card-text{font-size:12px}
.textarea{width:100%;min-height:90px;border:1px solid #e2e8f0;border-radius:12px;padding:12px;font-family:JetBrains Mono;font-size:12px;background:#f8fafc;outline:none}
.preview{margin-top:12px;border:1px solid #f1f5f9;border-radius:12px;padding:12px;display:none;background:#fff}
.btn-sm{height:34px;padding:0 16px;border-radius:9999px;border:1px solid #e2e8f0;background:#fff;font-size:11px;cursor:pointer}
.btn-sm-black{background:#000;color:#fff;border-color:#000}
.rekap-title{font-family:JetBrains Mono;font-size:10px;letter-spacing:0.2em;color:#94a3b8;margin-bottom:12px}
.rekap-box{border:1px solid #f1f5f9;border-radius:16px;overflow:hidden;margin-bottom:32px}
.rekap-item{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #f8fafc}
.row-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #f8fafc}
.btn-hapus{font-size:11px;color:#64748b;background:#f8fafc;border:1px solid #e2e8f0;border-radius:9999px;padding:5px 12px;cursor:pointer}
.btn-x{width:28px;height:28px;border-radius:50%;border:1px solid #e2e8f0;background:#fff;color:#64748b;cursor:pointer;display:grid;place-items:center}
.detail-title{font-family:JetBrains Mono;font-size:10px;letter-spacing:0.2em;color:#94a3b8;margin-bottom:10px}
.tgl-group{margin-bottom:20px;border:1px solid #f8fafc;border-radius:16px;padding:12px 14px}
.tgl-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.empty{padding:60px 0;text-align:center;font-family:JetBrains Mono;font-size:11px;color:#cbd5e1;letter-spacing:0.2em}
.footer{margin-top:48px;padding-top:20px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-input{width:100%;height:44px;border:none;border-bottom:1px solid #e2e8f0;background:transparent;padding:0;font-size:14px;outline:none}
.login-btn{width:100%;height:44px;background:#000;color:#fff;border-radius:9999px;border:none;font-size:12px;margin-top:20px}
</style>
</head><body>
<div id="app"></div>
<script>
const SYNC_URL='https://script.google.com/macros/s/AKfycbz-Tgif9wJD6PAidITjE3-55BInA4pHZAibDI3mAIYUp_6DQV8may5oJkwyY0nHx4qE/exec';
const FALLBACK_URL='https://script.google.com/macros/s/AKfycbzUWTx3o5DjsfrM7JTZBbnYYaMBzFLbH3-mfs0dCFm1uOGouvDqCBpc3KOgNPgKNoHL/exec';
const ADMIN_PASS='admin123';
const TUL_MAP={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};
function calcTUL(j){return TUL_MAP[j]||j*1.5;}
function isJamValid(j){j=Number(j);return j>0&&j<=24;}
function normNama(n){return String(n||'').trim().toLowerCase();}
function normalizeTanggal(t){if(!t)return'';let s=String(t).trim();let m=s.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);if(m){return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}m=s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);if(m){return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');}try{let d=new Date(s);if(!isNaN(d))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}catch{}return s;}
function formatTanggal(t){let p=normalizeTanggal(t).split('-');if(p.length===3)return p[2]+'-'+p[1]+'-'+p[0];return t;}
function parseSort(t){let p=normalizeTanggal(t).split('-');if(p.length!==3)return 0;return new Date(p[0],p[1]-1,p[2]).getTime();}
const ALIAS={'kuncoro budi':'Budi','kuncoro':'Budi','budi kuncoro':'Budi','neli':'Nely','nely':'Nely','annisa':'Anisa','aditya zozo':'Aditya','adit':'Aditya','dozen':'Dozen','supri':'Supriyadi','topik':'Topik','zaelani':'Zaelani','aaf':'Aaf'};
function normNamaAnggota(n){if(!n)return'';let k=String(n).trim().toLowerCase();if(ALIAS[k])return ALIAS[k];for(let a in ALIAS){if(k.includes(a))return ALIAS[a];}return String(n).trim().split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');}
const DEFAULT_KARYAWAN=['Aaf','Aditya','Anah','Anisa','Arief','Budi','Dozen','Eka','Nely','Nia','Putri','Supriyadi','Syarif','Topik','Yudi','Zaelani'].map(n=>({nama:n}));
function getKaryawan(){try{let c=localStorage.getItem('custom_karyawan');if(c){let a=JSON.parse(c);if(Array.isArray(a)&&a.length)return a;}}catch{}return DEFAULT_KARYAWAN;}
let allData=[];let isLogin=!!localStorage.getItem('admin_login');
let filterBulan=String(new Date().getMonth()+1);
let showInput=false;let showKelola=false;
function toast(m){let t=document.createElement('div');t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:10px 20px;border-radius:9999px;font-size:11px;z-index:99';t.innerText=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}
function jsonp(url){return new Promise((res,rej)=>{let cb='cb_'+Date.now()+Math.random().toString(36).slice(2);window[cb]=(d)=>{delete window[cb];document.getElementById(cb)?.remove();res(d);};let s=document.createElement('script');s.id=cb;s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&_='+Date.now();s.onerror=()=>{delete window[cb];s.remove();rej();};document.body.appendChild(s);});}
async function fetchData(force=false){
  if(force){try{localStorage.removeItem('cache_lembur');allData=[];}catch{}}
  try{let cc=localStorage.getItem('cache_lembur');if(cc&&!allData.length){let j=JSON.parse(cc);allData=j.map(r=>({tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal),nama:r.nama,jam:Number(r.jam),tul:calcTUL(Number(r.jam))}));if(allData.length)render();}}catch{}
  try{
    let j=await jsonp(SYNC_URL+'?action=read&_='+Date.now());
    if(!j||!j.length){try{let j2=await jsonp(FALLBACK_URL+'?action=read&_='+Date.now());if(j2&&j2.length)j=j2;}catch{}}
    if(Array.isArray(j)&&j.length){
      let raw=j.map(r=>{let jam=Number(r.jam||0);if(!isJamValid(jam))return null;let nm=normNamaAnggota(r.nama||r.nik||'');if(!nm)return null;return{tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal),nama:nm,jam:jam,tul:calcTUL(jam)};}).filter(Boolean);
      let dedup={};let out=[];raw.forEach(r=>{let k=r.tanggalNorm+'|'+normNama(r.nama)+'|'+r.jam;if(!dedup[k]){dedup[k]=1;out.push(r);}});
      if(out.length)allData=out;
      try{localStorage.setItem('cache_lembur',JSON.stringify(allData));}catch{}
    }
  }catch(e){}
  allData.sort((a,b)=>parseSort(b.tanggalNorm)-parseSort(a.tanggalNorm));
  render();
}
function filtered(){if(filterBulan==='all')return allData;return allData.filter(r=>{let p=r.tanggalNorm.split('-');return p.length===3&&Number(p[1])===Number(filterBulan);});}
function groupTanggal(data){let m={};data.forEach(r=>{if(!m[r.tanggalNorm])m[r.tanggalNorm]=[];m[r.tanggalNorm].push(r);});return Object.keys(m).sort((a,b)=>parseSort(b)-parseSort(a)).map(k=>({tanggal:k,rows:m[k]}));}
function groupKaryawan(data){let m={};data.forEach(r=>{let k=normNama(r.nama);if(!m[k])m[k]={nama:r.nama,total:0,count:0};m[k].total+=r.tul;m[k].count++;});return Object.values(m).sort((a,b)=>b.total-a.total);}
function login(){let p=document.getElementById('apass').value;if(p===ADMIN_PASS){localStorage.setItem('admin_login','1');isLogin=true;fetchData();}else document.getElementById('aerr').innerText='Password salah';}
function logout(){localStorage.removeItem('admin_login');isLogin=false;render();}
function hapusTgl(t){if(!confirm('Hapus semua '+formatTanggal(t)+'?'))return;allData=allData.filter(r=>r.tanggalNorm!==t);try{localStorage.setItem('cache_lembur',JSON.stringify(allData));}catch{}render();jsonp(SYNC_URL+'?action=deleteTanggal&tanggal='+encodeURIComponent(t.split('-').reverse().join('-'))+'&tanggalISO='+encodeURIComponent(t)+'&_='+Date.now());setTimeout(()=>fetchData(true),1000);}
function hapusOne(t,n,j){if(!confirm('Hapus '+n+' '+j+'j?'))return;allData=allData.filter(r=>!(r.tanggalNorm===t&&normNama(r.nama)===normNama(n)&&Number(r.jam)===Number(j)));try{localStorage.setItem('cache_lembur',JSON.stringify(allData));}catch{}render();jsonp(SYNC_URL+'?action=delete&tanggal='+encodeURIComponent(t.split('-').reverse().join('-'))+'&tanggalISO='+encodeURIComponent(t)+'&nama='+encodeURIComponent(n)+'&jam='+j+'&_='+Date.now());setTimeout(()=>fetchData(true),1000);}
function shareWA(){let data=filtered();let gKar=groupKaryawan(data);let total=data.reduce((s,r)=>s+r.tul,0);let bl=document.querySelector('.select-bulan')?.selectedOptions[0]?.text||'Bulan Ini';let txt='*AREA EF - '+bl+'*%0ATotal: '+total+' TUL%0A%0A*REKAP:*%0A';gKar.forEach(k=>{txt+=k.nama+': '+k.total+' TUL ('+k.count+' hari)%0A';});window.open('https://wa.me/?text='+txt,'_blank');}
function toggleCard(el){el.classList.toggle('checked');let cb=el.querySelector('input');cb.checked=!cb.checked;}
function parsePlan(){let txt=(document.getElementById('txtPesan')?.value||'').trim();if(!txt){toast('Tempel plan dulu');return;}let lines=txt.split('\n');let cur='';let items=[];lines.forEach(line=>{line=line.trim();if(!line)return;let m=line.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);if(m){let d=m[1].padStart(2,'0'),mo=m[2].padStart(2,'0'),y=m[3];if(y.length===2)y='20'+y;cur=d+'-'+mo+'-'+y;return;}let jm=line.match(/(\d{1,2})\s*j/i);if(jm&&cur){let jam=Number(jm[1]);let namaPart=line.replace(/\d+\s*j.*/i,'').replace(/[-–—]/g,' ').trim();if(!namaPart)namaPart=line.split(' ')[0];let nm=normNamaAnggota(namaPart);if(nm&&isJamValid(jam))items.push({tanggal:cur,nama:nm,jam:jam});}});let cont=document.getElementById('previewPesan');cont.innerHTML=items.length?items.map(it=>'<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:11px"><span>'+it.tanggal+' - '+it.nama+'</span><span>'+it.jam+'j • '+calcTUL(it.jam)+' TUL</span></div>').join(''):'<div style="font-size:11px;color:#94a3b8">Tidak ada data</div>';cont.style.display='block';cont._items=items;}
async function simpanPlan(){let cont=document.getElementById('previewPesan');let items=cont._items||[];if(!items.length){toast('Preview dulu');return;}toast('Menyimpan '+items.length);try{let fd=new FormData();fd.append('action','addBulk');fd.append('items',JSON.stringify(items));await fetch(SYNC_URL,{method:'POST',body:fd});}catch{}items.forEach(it=>allData.push({tanggal:it.tanggal,tanggalNorm:normalizeTanggal(it.tanggal),nama:it.nama,jam:it.jam,tul:calcTUL(it.jam)}));try{localStorage.setItem('cache_lembur',JSON.stringify(allData));}catch{}showInput=false;render();setTimeout(()=>fetchData(true),800);}
function simpanMassal(){
  let t=document.getElementById('massalTgl').value.trim();let j=Number(document.getElementById('massalJam').value);
  if(!t){toast('Isi tanggal');return;}
  if(!isJamValid(j)){toast('Jam tidak valid');return;}
  let checked=document.querySelectorAll('#gridAnggota input:checked');
  if(!checked.length){toast('Pilih orang');return;}
  let items=[];checked.forEach(cb=>{items.push({tanggal:t,nama:normNamaAnggota(cb.value),jam:j});});
  (async()=>{toast('Menyimpan '+items.length);try{let fd=new FormData();fd.append('action','addBulk');fd.append('items',JSON.stringify(items));await fetch(SYNC_URL,{method:'POST',body:fd});}catch{}items.forEach(it=>allData.push({tanggal:it.tanggal,tanggalNorm:normalizeTanggal(it.tanggal),nama:it.nama,jam:it.jam,tul:calcTUL(it.jam)}));try{localStorage.setItem('cache_lembur',JSON.stringify(allData));}catch{}showInput=false;render();fetchData(true);})();
}
function render(){
  if(!isLogin){
    document.getElementById('app').innerHTML='<div class="login-wrap"><div style="width:100%;max-width:320px"><div style="font-size:10px;letter-spacing:0.3em;color:#94a3b8;margin-bottom:32px">AREA EF</div><input id="apass" type="password" placeholder="Password" class="login-input"><div id="aerr" style="font-size:11px;color:#ef4444;margin-top:10px;min-height:14px"></div><button onclick="login()" class="login-btn">Masuk</button></div></div>';
    return;
  }
  let data=filtered();let gTgl=groupTanggal(data);let gKar=groupKaryawan(data);let total=data.reduce((s,r)=>s+r.tul,0);
  let html='';
  html+='<div class="header"><div class="h-left">AREA EF</div><div class="h-right"><div class="h-top"><select onchange="filterBulan=this.value;render()" class="select-bulan"><option value="all" '+(filterBulan==='all'?'selected':'')+'>Semua Bulan</option><option value="1" '+(filterBulan==='1'?'selected':'')+'>Jan</option><option value="2" '+(filterBulan==='2'?'selected':'')+'>Feb</option><option value="3" '+(filterBulan==='3'?'selected':'')+'>Mar</option><option value="4" '+(filterBulan==='4'?'selected':'')+'>Apr</option><option value="5" '+(filterBulan==='5'?'selected':'')+'>Mei</option><option value="6" '+(filterBulan==='6'?'selected':'')+'>Jun</option><option value="7" '+(filterBulan==='7'?'selected':'')+'>Jul</option><option value="8" '+(filterBulan==='8'?'selected':'')+'>Agu</option><option value="9" '+(filterBulan==='9'?'selected':'')+'>Sep</option><option value="10" '+(filterBulan==='10'?'selected':'')+'>Okt</option><option value="11" '+(filterBulan==='11'?'selected':'')+'>Nov</option><option value="12" '+(filterBulan==='12'?'selected':'')+'>Des</option></select><button onclick="logout()" class="btn-keluar">Keluar</button></div><button onclick="shareWA()" class="btn-share-wa">Share WA</button></div></div>';
  html+='<div class="container">';
  html+='<div class="total-row"><div class="total-num">'+total+'</div><div class="total-label">TUL</div></div>';
  html+='<div class="action-row"><button onclick="fetchData(true)" class="pill">Refresh</button><button onclick="showInput=!showInput;render()" class="pill pill-black">'+(showInput?'Tutup':'Input')+'</button></div>';

  if(showInput){
    html+='<div class="input-wrap">';
    html+='<div><div class="input-title">INPUT MASSAL PERTANGGAL</div><div class="row-tgl-jam"><input id="massalTgl" type="text" placeholder="DD-MM-YYYY" class="inp-tgl"><input id="massalJam" type="number" placeholder="Jam" class="inp-jam"></div><div id="gridAnggota" class="grid-anggota">'+getKaryawan().map(k=>'<label class="card-anggota" onclick="toggleCard(this)"><input type="checkbox" value="'+k.nama+'" style="display:none"><span class="card-text">'+k.nama+'</span></label>').join('')+'</div><button onclick="simpanMassal()" style="margin-top:12px;width:100%;height:40px;background:#000;color:#fff;border-radius:9999px;border:none;font-size:12px">Simpan Massal</button></div>';
    html+='<div style="margin-top:20px;padding-top:20px;border-top:1px solid #f1f5f9"><div class="input-title">PASTE PLAN WA</div><textarea id="txtPesan" class="textarea" placeholder="18-10-2025\nBudi 6j\nAnisa 4j"></textarea><div id="previewPesan" class="preview"></div><div style="display:flex;gap:8px;margin-top:12px"><button onclick="parsePlan()" class="btn-sm">Preview</button><button onclick="simpanPlan()" class="btn-sm btn-sm-black">Simpan Plan</button></div></div>';
    html+='</div>';
  }

  if(gKar.length){
    html+='<div style="margin-bottom:28px"><div class="rekap-title">REKAP PER ANGGOTA — '+data.length+' transaksi</div><div class="rekap-box">';
    for(let k of gKar){html+='<div class="rekap-item"><div><div style="font-size:13px;font-weight:500">'+k.nama+'</div><div style="font-family:JetBrains Mono;font-size:10px;color:#94a3b8;margin-top:2px">'+k.count+' hari</div></div><div class="mono" style="font-size:13px">'+k.total+' TUL</div></div>';}
    html+='</div></div>';
  }

  if(gTgl.length===0){html+='<div class="empty">TIDAK ADA DATA</div>';}
  else{
    html+='<div class="detail-title">DETAIL HARIAN</div>';
    for(let g of gTgl){
      html+='<div class="tgl-group"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div class="mono" style="font-size:11px;font-weight:500">'+formatTanggal(g.tanggal)+'</div><button onclick="hapusTgl(\''+g.tanggal+'\')" class="btn-hapus">hapus tanggal</button></div>';
      for(let r of g.rows){html+='<div class="row-item"><div style="font-size:13px">'+r.nama+' <span style="font-family:JetBrains Mono;font-size:11px;color:#64748b;margin-left:6px">'+r.jam+'j • '+r.tul+' TUL</span></div><button onclick="hapusOne(\''+r.tanggalNorm+'\',\''+r.nama+'\',\''+r.jam+'\')" class="btn-x">✕</button></div>';}
      html+='</div>';
    }
  }

  html+='<div style="margin-top:48px;padding-top:20px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between"><button onclick="showKelola=!showKelola;render()" style="font-family:JetBrains Mono;font-size:10px;color:#94a3b8;background:none;border:none">Kelola anggota</button><span style="font-family:JetBrains Mono;font-size:9px;color:#cbd5e1">'+allData.length+' DATA</span></div>';
  if(showKelola){
    let kar=getKaryawan();
