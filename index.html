<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin V4 - Bulk Massal Cepat</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif}</style>
</head>
<body class="bg-[#f6f5f4] min-h-screen">
<div id="app"></div>
<script>
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbw5cHnAw-eyp-8KPmIhWijZbGDofMhjrSkibD-23AEBimCeT8m9msRm63AGur7N1wWpXw/exec';
const ADMIN_PASS = 'admin123';
const TUL_MAP={2:3.5,3:5.5,4:7.5,6:12,7:14,8:16};
const calcTUL=j=>TUL_MAP[j]||j*2;
function normNama(n){ return String(n||'').trim().toLowerCase(); }
function normalizeTanggal(t){
  if(!t) return '';
  let str = String(t).trim();
  if(str.includes('T')) str = str.split('T')[0];
  if(str.includes(' ')) str = str.split(' ')[0];
  try{
    const d = new Date(t);
    if(!isNaN(d.getTime())){
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    }
  }catch{}
  return str;
}
function formatTanggal(t){
  const norm = normalizeTanggal(t);
  const parts = norm.split('-');
  if(parts.length===3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
  return norm;
}
const DEFAULT_KARYAWAN = [
  {nama:'Nia',pass:'1234'},{nama:'Aditya',pass:'1234'},{nama:'Anisa',pass:'1234'},{nama:'Aaf',pass:'1234'},{nama:'Syarif',pass:'1234'},{nama:'Budi',pass:'1234'},{nama:'Topik',pass:'1234'},{nama:'Yudi',pass:'1234'},{nama:'Dozen',pass:'1234'},{nama:'Putri',pass:'1234'},{nama:'Arief',pass:'1234'},{nama:'Anah',pass:'1234'},{nama:'Supriyadi',pass:'1234'},{nama:'Eka',pass:'1234'},{nama:'Nely',pass:'1234'},{nama:'Zaelani',pass:'1234'},
];
let isLogin = localStorage.getItem('admin_login')==='true';
let allData=[];
let karyawanList=JSON.parse(localStorage.getItem('rk_kar_admin_nonik')||'null');
if(!karyawanList || karyawanList.length<16){ karyawanList=DEFAULT_KARYAWAN; localStorage.setItem('rk_kar_admin_nonik', JSON.stringify(karyawanList)); }
let filterBulan=String(new Date().getMonth()+1);
let filterTahun='all';
let selectedMassal = {};
let syncStatus = '● Sinkron';
let lastSync = '';
let activeTab = 'massal';

function showToast(m){ const t=document.createElement('div'); t.className='fixed bottom-4 left-1/2 -translate-x-1/2 bg-zinc-900 text-white px-4 py-2 rounded-full text-[12px] z-50 max-w-[90%] text-center'; t.innerText=m; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb='cb_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);
    window[cb]=(data)=>{ delete window[cb]; document.getElementById(cb)?.remove(); resolve(data); };
    const s=document.createElement('script'); s.id=cb;
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&t='+Date.now();
    s.onerror=()=>{ delete window[cb]; s.remove(); reject(new Error('fail')); };
    document.body.appendChild(s);
    setTimeout(()=>{ if(window[cb]){ delete window[cb]; s.remove(); reject(new Error('Timeout')); } },8000);
  });
}
async function fetchData(){
  syncStatus = '⏳ Syncing...'; render();
  try{
    const j = await jsonp(SYNC_URL+'?action=read');
    if(Array.isArray(j)) {
      allData=j.map(row=>({tanggal:row.tanggal, tanggalNorm: normalizeTanggal(row.tanggal), nama:row.nama||row.nik, jam:Number(row.jam||0), tul:calcTUL(Number(row.jam||0)), rowIndex: row.rowIndex})).filter(x=>x.nama);
      syncStatus = '● Sinkron';
      lastSync = new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
    } else { syncStatus = '● Offline'; }
  }catch(e){ console.log(e); syncStatus = '● Offline'; }
  render();
}
function login(){ const p=document.getElementById('apass').value; if(p===ADMIN_PASS){ localStorage.setItem('admin_login','true'); isLogin=true; fetchData(); } else document.getElementById('aerr').innerText='Password salah'; }
function logout(){ localStorage.removeItem('admin_login'); isLogin=false; render(); }
function filteredData(){
  let d=[...allData];
  if(filterBulan!=='all'){ d=d.filter(x=>{ const norm = x.tanggalNorm || normalizeTanggal(x.tanggal); const m = norm.split('-')[1]; return String(parseInt(m))===String(parseInt(filterBulan)); }); }
  if(filterTahun!=='all'){ d=d.filter(x=>{ const norm = x.tanggalNorm || normalizeTanggal(x.tanggal); const y = norm.split('-')[0]; return String(y)===filterTahun; }); }
  return d;
}
function groupByKaryawan(data){
  const map={}; data.forEach(r=>{ const key=normNama(r.nama); if(!map[key]) map[key]={nama:r.nama,totalJam:0,totalTUL:0,hari:0}; map[key].totalJam+=Number(r.jam); map[key].totalTUL+=Number(r.tul); map[key].hari+=1; }); return Object.values(map).sort((a,b)=>b.totalTUL-a.totalTUL);
}
function groupByTanggal(data){
  const map={};
  data.forEach(r=>{
    const tNorm = r.tanggalNorm || normalizeTanggal(r.tanggal);
    if(!map[tNorm]) map[tNorm]={tanggal:tNorm, totalJam:0, totalTUL:0, rows:[]};
    map[tNorm].totalJam+=Number(r.jam);
    map[tNorm].totalTUL+=Number(r.tul);
    map[tNorm].rows.push(r);
  });
  return Object.values(map).sort((a,b)=> new Date(b.tanggal) - new Date(a.tanggal));
}
function toggleSelectMassal(nama){ const key=normNama(nama); if(selectedMassal[key]) delete selectedMassal[key]; else selectedMassal[key]=true; renderMassalList(); }
function selectAllMassal(){ const allSelected = Object.keys(selectedMassal).length === karyawanList.length; if(allSelected){ selectedMassal={}; } else { selectedMassal={}; karyawanList.forEach(k=>{ selectedMassal[normNama(k.nama)]=true; }); } renderMassalList(); }
function renderMassalList(){
  const container=document.getElementById('massalList');
  if(!container) return;
  container.innerHTML = karyawanList.map(k=>{
    const key=normNama(k.nama);
    const isSelected = !!selectedMassal[key];
    return `<label class="flex items-center gap-3 px-4 py-3 rounded-[18px] border-2 cursor-pointer ${isSelected?'bg-zinc-900 text-white border-zinc-900':'bg-white border-zinc-200'}"><input type="checkbox" ${isSelected?'checked':''} onchange="toggleSelectMassal('${k.nama}')" class="w-5 h-5 rounded"><span class="text-[14px] font-semibold">${k.nama}</span></label>`;
  }).join('');
  const countEl=document.getElementById('massalCount');
  if(countEl) countEl.innerText = `${Object.keys(selectedMassal).length} karyawan dipilih`;
}

// BULK MASSAL - FIX LAMBAT & HILANG SEBAGIAN
async function handleInputMassal(){
  const tgl=document.getElementById('massalTgl').value;
  const jam=parseInt(document.getElementById('massalJam').value);
  const selectedNames = Object.keys(selectedMassal).map(key=>{ const k=karyawanList.find(x=>normNama(x.nama)===key); return k ? k.nama : key; });
  if(!tgl || !jam){ showToast('Isi tanggal & jam'); return; }
  if(selectedNames.length===0){ showToast('Pilih minimal 1'); return; }
  
  const tNorm = normalizeTanggal(tgl);
  const newRows = selectedNames.map(nama=>({tanggal:tNorm, tanggalNorm: tNorm, nama:nama, jam:jam, tul:calcTUL(jam)}));
  allData.unshift(...newRows);
  render();
  showToast(`✅ ${selectedNames.length} karyawan tersimpan INSTAN`);
  selectedMassal={}; renderMassalList();
  
  syncStatus='⏳ Menyimpan ke Sheet...'; render();
  
  // BULK INSERT - SATU KALI KIRIM SEMUA, BUKAN SATU PER SATU!
  const payload = {
    action: 'bulkMassal',
    data: selectedNames.map(nama=>({
      tanggal: tNorm,
      nik: normNama(nama),
      nama: nama,
      jam: jam,
      tul: calcTUL(jam),
      keterangan: 'lembur massal',
      inputOleh: 'admin',
      catatan: 'Input massal bulk V4'
    }))
  };
  
  try{
    const res = await fetch(SYNC_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify(payload)
    });
    // no-cors tidak bisa baca respon, tapi di Apps Script sudah setValues bulk
    console.log('Bulk sent:', selectedNames.length);
    showToast(`✅ ${selectedNames.length} terkirim ke Sheet (bulk)`);
  }catch(err){
    console.error(err);
    // Fallback: kirim satu per satu kalau bulk gagal (Apps Script belum update)
    showToast('⚠️ Bulk gagal, coba satu per satu...');
    for(const nama of selectedNames){
      try{
        await fetch(SYNC_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({tanggal:tNorm, nik:normNama(nama), nama:nama, jam:jam, tul:calcTUL(jam)})});
        await new Promise(r=>setTimeout(r, 300));
      }catch{}
    }
  }
  
  syncStatus='● Sinkron'; lastSync=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); render();
  setTimeout(fetchData, 1500);
}

async function hapusTransaksi(tgl, nama, jam){
  const tNorm = normalizeTanggal(tgl);
  if(!confirm(`Hapus ${nama} ${formatTanggal(tgl)} ${jam} jam? Hapus permanen!`)) return;
  showToast('⏳ Menghapus...');
  try{
    const target = allData.find(r=> normalizeTanggal(r.tanggal)===tNorm && normNama(r.nama)===normNama(nama) && String(r.jam)===String(jam));
    let res;
    if(target && target.rowIndex){
      res = await jsonp(`${SYNC_URL}?action=delete&row=${target.rowIndex}&t=${Date.now()}`);
    } else {
      res = await jsonp(`${SYNC_URL}?action=deleteTransaksi&tanggal=${encodeURIComponent(tNorm)}&nik=${encodeURIComponent(normNama(nama))}&nama=${encodeURIComponent(nama)}&jam=${encodeURIComponent(jam)}&t=${Date.now()}`);
    }
    allData = allData.filter(r=> !(normalizeTanggal(r.tanggal)===tNorm && normNama(r.nama)===normNama(nama) && String(r.jam)===String(jam)));
    showToast('✅ Terhapus permanen');
    render();
    setTimeout(fetchData, 1200);
  }catch(err){
    showToast('❌ Gagal hapus - update Apps Script V3!');
  }
}
async function hapusTanggal(tgl){
  const tNorm = normalizeTanggal(tgl);
  const data = allData.filter(x=> (x.tanggalNorm||normalizeTanggal(x.tanggal))===tNorm);
  if(data.length===0){ showToast('Tidak ada data'); return; }
  if(!confirm(`Hapus semua ${data.length} data tanggal ${formatTanggal(tgl)}? Hapus permanen di Sheet!`)) return;
  showToast(`⏳ Menghapus ${data.length} data tanggal ${formatTanggal(tgl)}...`);
  // Hapus pakai rowIndex dari besar ke kecil biar tidak geser
  const sorted = [...data].sort((a,b)=> (b.rowIndex||0) - (a.rowIndex||0));
  let deleted = 0;
  for(const r of sorted){
    try{
      if(r.rowIndex){
        await jsonp(`${SYNC_URL}?action=delete&row=${r.rowIndex}&t=${Date.now()}`);
      } else {
        await jsonp(`${SYNC_URL}?action=deleteTransaksi&tanggal=${encodeURIComponent(tNorm)}&nik=${encodeURIComponent(normNama(r.nama))}&nama=${encodeURIComponent(r.nama)}&jam=${encodeURIComponent(r.jam)}&t=${Date.now()}`);
      }
      deleted++;
      showToast(`⏳ ${deleted}/${data.length} terhapus...`);
    }catch(err){
      console.error(err);
    }
    await new Promise(res=>setTimeout(res, 500));
  }
  // Hapus lokal
  allData = allData.filter(x=> (x.tanggalNorm||normalizeTanggal(x.tanggal))!==tNorm);
  showToast(`✅ ${formatTanggal(tgl)} terhapus ${deleted} data`);
  render();
  setTimeout(fetchData, 1000);
}
async function hapusKaryawanTUL(nama){
  const data = filteredData().filter(x=>normNama(x.nama)===normNama(nama));
  if(data.length===0){ showToast('Tidak ada data'); return; }
  if(!confirm(`Hapus ${data.length} data ${nama}?`)) return;
  showToast(`⏳ Menghapus ${data.length} data ${nama}...`);
  for(const r of data){
    try{ 
      if(r.rowIndex) await jsonp(`${SYNC_URL}?action=delete&row=${r.rowIndex}&t=${Date.now()}`);
      else await jsonp(`${SYNC_URL}?action=deleteTransaksi&tanggal=${encodeURIComponent(r.tanggalNorm||normalizeTanggal(r.tanggal))}&nik=${encodeURIComponent(normNama(nama))}&jam=${encodeURIComponent(r.jam)}&t=${Date.now()}`);
    }catch{}
    await new Promise(res=>setTimeout(res, 300));
  }
  showToast(`✅ ${nama} terhapus`);
  fetchData();
}
function shareWA(nama, totalTUL){ window.open(`https://wa.me/?text=${encodeURIComponent(nama+' '+totalTUL+' tul')}`, '_blank'); }
function render(){
  const app=document.getElementById('app');
  if(!isLogin){
    app.innerHTML=`<div class="min-h-screen grid place-items-center p-4 bg-zinc-900">
      <div class="w-full max-w-[340px] bg-white rounded-[24px] p-7 shadow-2xl">
        <div class="w-12 h-12 rounded-full bg-zinc-900 text-white grid place-items-center font-bold text-[18px]">A</div>
        <h1 class="font-bold text-[20px] mt-4">Admin V4 Bulk</h1>
        <p class="text-[11px] text-zinc-500 mt-1">Bulk massal cepat - tidak hilang sebagian</p>
        <div class="mt-5 space-y-3">
          <input id="apass" type="password" placeholder="Password admin123" class="w-full h-12 rounded-xl border-2 border-zinc-100 bg-zinc-50 px-4 text-[14px]">
          <div id="aerr" class="text-[11px] text-red-600 min-h-[14px]"></div>
          <button onclick="login()" class="w-full h-12 rounded-xl bg-zinc-900 text-white font-bold text-[14px]">Masuk</button>
        </div>
      </div>
    </div>`; return;
  }
  const data=filteredData(); 
  const grouped=groupByKaryawan(data);
  const harian=groupByTanggal(data);
  const bulanNama=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember']; 
  const labelBulan=filterBulan==='all'?'Semua Bulan':bulanNama[parseInt(filterBulan)];
  app.innerHTML=`<div class="max-w-[900px] mx-auto min-h-screen bg-white">
    <div class="px-6 h-[64px] flex items-center justify-between border-b bg-white sticky top-0 z-10">
      <div>
        <div class="font-bold text-[18px] leading-none">Admin V4 Bulk</div>
        <div class="text-[11px] text-zinc-500 flex items-center gap-2 mt-1"><span class="${syncStatus.includes('Sinkron')?'text-green-600':'text-amber-600'} font-bold">${syncStatus}</span><span>• ${allData.length} data • ${grouped.length} karyawan</span>${lastSync?`<span>• ${lastSync}</span>`:''}</div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="fetchData()" class="h-10 w-10 rounded-full bg-zinc-100 border grid place-items-center">🔄</button>
        <button onclick="logout()" class="h-10 px-6 rounded-full bg-zinc-900 text-white text-[13px] font-bold">Logout</button>
      </div>
    </div>
    <div class="px-4 py-3 bg-[#f6f5f4] sticky top-[64px] z-10">
      <div class="flex gap-2 p-1.5 bg-white rounded-[20px] border shadow-sm overflow-x-auto">
        <button onclick="activeTab='massal';render()" class="flex-1 whitespace-nowrap h-11 px-5 rounded-[14px] font-bold text-[13px] ${activeTab==='massal'?'bg-zinc-900 text-white':'bg-zinc-50 text-zinc-600 border'}">Input Massal</button>
        <button onclick="activeTab='harian';render()" class="flex-1 whitespace-nowrap h-11 px-5 rounded-[14px] font-bold text-[13px] ${activeTab==='harian'?'bg-zinc-900 text-white':'bg-zinc-50 text-zinc-600 border'}">Riwayat Harian 📅 ${harian.length>0?`(${harian.length})`:''}</button>
        <button onclick="activeTab='rekap';render()" class="flex-1 whitespace-nowrap h-11 px-5 rounded-[14px] font-bold text-[13px] ${activeTab==='rekap'?'bg-zinc-900 text-white':'bg-zinc-50 text-zinc-600 border'}">Rekap TUL</button>
      </div>
    </div>
    <div class="p-4 space-y-4 bg-[#f6f5f4]">
      ${activeTab==='massal'?`
      <div class="rounded-[28px] bg-white border shadow-sm p-5">
        <div class="flex items-center justify-between mb-2"><div class="font-bold text-[18px]">Input Lembur Massal - BULK CEPAT</div><button onclick="selectAllMassal()" class="h-10 px-5 rounded-full bg-zinc-900 text-white text-[13px] font-bold">Pilih Semua</button></div>
        <div class="text-[11px] text-green-600 bg-green-50 border border-green-200 rounded-xl p-3 mb-4">✅ V4 BULK: Sekali kirim 16 karyawan langsung masuk Sheet semua! Tidak hilang sebagian lagi. Sinkron 2x lebih cepat.</div>
        <div class="grid grid-cols-2 gap-3 mb-4">
          <div><div class="text-[12px] text-zinc-500 mb-1.5 ml-1">Tanggal</div><input id="massalTgl" type="date" value="${new Date().toISOString().slice(0,10)}" class="w-full h-12 rounded-[16px] border-2 border-zinc-100 bg-zinc-50 px-4 text-[15px] font-semibold"></div>
          <div><div class="text-[12px] text-zinc-500 mb-1.5 ml-1">Jam</div><select id="massalJam" class="w-full h-12 rounded-[16px] border-2 border-zinc-100 bg-zinc-50 px-4 text-[15px] font-bold"><option value="2">2 jam = 3.5 TUL</option><option value="3" selected>3 jam = 5.5 TUL</option><option value="4">4 jam = 7.5 TUL</option><option value="6">6 jam = 12 TUL</option><option value="8">8 jam = 16 TUL</option></select></div>
        </div>
        <div id="massalCount" class="text-[13px] font-bold text-zinc-600 mb-3">0 karyawan dipilih</div>
        <button onclick="handleInputMassal()" class="w-full h-14 rounded-[18px] bg-zinc-900 text-white font-bold text-[16px] mb-5">Simpan BULK (${karyawanList.length} karyawan sekaligus)</button>
        <div id="massalList" class="grid grid-cols-2 gap-3 max-h-[400px] overflow-y-auto p-1"></div>
      </div>
      `:''}
      ${activeTab==='harian'?`
      <div class="space-y-3">
        ${harian.length===0?`<div class="rounded-[24px] bg-white border p-10 text-center text-zinc-500">Tidak ada data</div>`:
        harian.map(h=>`
          <div class="rounded-[24px] bg-white border shadow-sm overflow-hidden">
            <div class="px-5 py-4 bg-zinc-900 text-white flex justify-between items-center">
              <div><div class="font-bold text-[15px]">📅 ${formatTanggal(h.tanggal)}</div><div class="text-[11px] opacity-70 mt-0.5">${h.rows.length} orang • ${h.totalJam} jam • ${h.totalTUL} TUL</div></div>
              <button onclick="hapusTanggal('${h.tanggal}')" class="h-9 px-4 rounded-full bg-red-600 text-white text-[12px] font-bold">Hapus Hari</button>
            </div>
            <div class="divide-y">
              ${h.rows.map(r=>`<div class="px-5 py-3 flex items-center justify-between"><div><div class="font-bold text-[13px]">${r.nama}</div><div class="text-[11px] text-zinc-500">${formatTanggal(r.tanggal)} • ${r.jam} jam = ${r.tul} TUL</div></div><button onclick="hapusTransaksi('${r.tanggal}','${r.nama}',${r.jam})" class="h-8 px-3 rounded-full bg-red-50 border border-red-200 text-red-600 text-[11px] font-bold">Hapus</button></div>`).join('')}
            </div>
          </div>
        `).join('')}
      </div>
      `:''}
      ${activeTab==='rekap'?`
      <div class="rounded-[24px] bg-white border shadow-sm overflow-hidden">
        <div class="px-5 py-4 border-b font-bold text-[15px]">Rekap TUL - ${labelBulan} (${grouped.length})</div>
        <div class="divide-y">${grouped.length===0?`<div class="py-10 text-center text-zinc-500">Tidak ada data</div>`:grouped.map(g=>`<div class="px-5 py-4 flex items-center justify-between"><div><div class="font-bold text-[15px]">${g.nama}</div></div><div class="flex gap-2 items-center"><button onclick="shareWA('${g.nama}',${g.totalTUL})" class="h-9 px-5 rounded-full bg-zinc-900 text-white text-[13px] font-bold">${g.totalTUL} TUL</button><button onclick="hapusKaryawanTUL('${g.nama}')" class="h-9 px-4 rounded-full bg-red-600 text-white text-[12px] font-bold">Hapus</button></div></div>`).join('')}</div>
      </div>
      `:''}
    </div>
  </div>`;
  if(activeTab==='massal') renderMassalList();
}
if(isLogin) fetchData(); else render();
</script>
</body>
</html>
