<!DOCTYPE html>
<html lang="id">
<head><style>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Input Massal</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif}</style>
</head>
<body class="bg-[#f6f5f4] min-h-screen">
<div id="app"></div>
<script>
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbw5cHnAw-eyp-8KPmIhWijZbGDofMhjrSkibD-23AEBimCeT8m9msRm63AGur7N1wWpXw/exec';
const ADMIN_PASS = 'admin123';
const TUL_MAP={2:3.5,3:5.5,4:7.5,6:12,7:14,8:16};
const calcTUL=j=>TUL_MAP[j]||j*2;
function normNama(n){ return String(n||'').trim().toLowerCase(); }
const DEFAULT_KARYAWAN = [
  {nama:'Nia',pass:'1234'},{nama:'Aditya',pass:'1234'},{nama:'Anisa',pass:'1234'},{nama:'Aaf',pass:'1234'},{nama:'Syarif',pass:'1234'},{nama:'Budi',pass:'1234'},{nama:'Topik',pass:'1234'},{nama:'Yudi',pass:'1234'},{nama:'Dozen',pass:'1234'},{nama:'Putri',pass:'1234'},{nama:'Arief',pass:'1234'},{nama:'Anah',pass:'1234'},{nama:'Supriyadi',pass:'1234'},{nama:'Eka',pass:'1234'},{nama:'Nely',pass:'1234'},{nama:'Zaelani',pass:'1234'},
];
let isLogin = localStorage.getItem('admin_login')==='true';
let allData=[];
let karyawanList=JSON.parse(localStorage.getItem('rk_kar_admin_nonik')||'null');
if(!karyawanList || karyawanList.length<16){ karyawanList=DEFAULT_KARYAWAN; localStorage.setItem('rk_kar_admin_nonik', JSON.stringify(karyawanList)); }
let filterBulan=String(new Date().getMonth()+1);
let filterTahun=String(new Date().getFullYear());
let search=''; let loading=false;
let selectedMassal = {};
function showToast(m){ const t=document.createElement('div'); t.className='fixed bottom-4 left-1/2 -translate-x-1/2 bg-zinc-900 text-white px-4 py-2 rounded-full text-[12px] z-50'; t.innerText=m; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb='cb_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);
    window[cb]=(data)=>{ delete window[cb]; document.getElementById(cb)?.remove(); resolve(data); };
    const s=document.createElement('script'); s.id=cb;
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&t='+Date.now();
    s.onerror=()=>{ delete window[cb]; s.remove(); reject(new Error('fail')); };
    document.body.appendChild(s);
    setTimeout(()=>{ if(window[cb]){ delete window[cb]; s.remove(); reject(new Error('Timeout')); } },10000);
  });
}
async function fetchData(){
  loading=true; render();
  try{
    const j = await jsonp(SYNC_URL+'?action=read');
    if(Array.isArray(j)) {
      allData=j.map((row,i)=>{ let tul=calcTUL(Number(row.jam||0)); return {tanggal:row.tanggal, nama:row.nama||row.nik, jam:Number(row.jam||0), tul:tul} }).filter(x=>x.nama);
    }
  }catch(e){}
  try{
    const k = await jsonp(SYNC_URL+'?action=readKaryawan');
    if(Array.isArray(k) && k.length>0){
      const uniq={}; k.forEach(x=>{ const n=normNama(x.nama||x.nik); if(n && !uniq[n]) uniq[n]={nama:(x.nama||x.nik), pass:x.pass||'1234'}; });
      karyawanList=Object.values(uniq);
      if(karyawanList.length<16){ DEFAULT_KARYAWAN.forEach(d=>{ if(!karyawanList.some(x=>normNama(x.nama)===normNama(d.nama))) karyawanList.push(d); }); }
      localStorage.setItem('rk_kar_admin_nonik', JSON.stringify(karyawanList));
    }
  }catch(e){}
  loading=false; render();
}
function login(){ const p=document.getElementById('apass').value; if(p===ADMIN_PASS){ localStorage.setItem('admin_login','true'); isLogin=true; fetchData(); } else document.getElementById('aerr').innerText='Password salah'; }
function logout(){ localStorage.removeItem('admin_login'); isLogin=false; render(); }
function filteredData(){
  let d=[...allData];
  if(filterBulan!=='all'){ d=d.filter(x=>{ const t=String(x.tanggal); let m=''; if(t.includes('-')) m=t.split('-')[1]; else if(t.includes('/')) m=t.split('/')[1]; else m=String(new Date(t).getMonth()+1); return String(parseInt(m))===String(parseInt(filterBulan)); }); }
  if(filterTahun!=='all'){ d=d.filter(x=>{ const t=String(x.tanggal); let y=''; if(t.includes('-')) y=t.split('-')[0].length===4 ? t.split('-')[0] : t.split('-')[2]; else if(t.includes('/')) y=t.split('/')[2]; else y=String(new Date(t).getFullYear()); return String(y)===filterTahun; }); }
  if(search.trim()){ const s=search.toLowerCase(); d=d.filter(x=> x.nama.toLowerCase().includes(s)); }
  return d;
}
function groupByKaryawan(data){
  const map={}; data.forEach(r=>{ const key=normNama(r.nama); if(!map[key]) map[key]={nama:r.nama,totalJam:0,totalTUL:0,hari:0}; map[key].totalJam+=Number(r.jam); map[key].totalTUL+=Number(r.tul); map[key].hari+=1; }); return Object.values(map).sort((a,b)=>b.totalTUL-a.totalTUL);
}
function toggleSelectMassal(nama){
  const key=normNama(nama);
  if(selectedMassal[key]) delete selectedMassal[key];
  else selectedMassal[key]=true;
  renderMassalList();
}
function selectAllMassal(){
  const allSelected = Object.keys(selectedMassal).length === karyawanList.length;
  if(allSelected){ selectedMassal={}; }
  else { selectedMassal={}; karyawanList.forEach(k=>{ selectedMassal[normNama(k.nama)]=true; }); }
  renderMassalList();
}
function renderMassalList(){
  const container=document.getElementById('massalList');
  if(!container) return;
  container.innerHTML = karyawanList.map(k=>{
    const checked = selectedMassal[normNama(k.nama)] ? 'checked' : '';
    return `<label class="flex items-center gap-2 px-3 py-2 rounded-xl border bg-white hover:bg-zinc-50 cursor-pointer ${checked?'bg-zinc-900 text-white border-zinc-900':''}">
      <input type="checkbox" ${checked} onchange="toggleSelectMassal('${k.nama}')" class="w-4 h-4 rounded">
      <span class="text-[12px] font-semibold">${k.nama}</span>
    </label>`;
  }).join('');
  const countEl=document.getElementById('massalCount');
  if(countEl) countEl.innerText = `${Object.keys(selectedMassal).length} karyawan dipilih`;
}
async function handleInputMassal(){
  const tgl=document.getElementById('massalTgl').value;
  const jam=parseInt(document.getElementById('massalJam').value);
  const selectedNames = Object.keys(selectedMassal).map(key=>{
    const k=karyawanList.find(x=>normNama(x.nama)===key);
    return k ? k.nama : key;
  });
  if(!tgl || !jam){ showToast('Isi tanggal & jam'); return; }
  if(selectedNames.length===0){ showToast('Pilih minimal 1 karyawan'); return; }
  if(!confirm(`Simpan lembur?\nTanggal: ${tgl}\nJam: ${jam} jam = ${calcTUL(jam)} TUL\nKaryawan: ${selectedNames.length} orang`)) return;
  showToast(`⏳ Menyimpan ${selectedNames.length} data...`);
  let success=0;
  for(const nama of selectedNames){
    const payload={tanggal:tgl, nik:normNama(nama), nama:nama, jam:jam, tul:calcTUL(jam)};
    try{ await fetch(SYNC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); success++; }catch{}
    await new Promise(r=>setTimeout(r, 300));
  }
  showToast(`✅ ${success} data tersimpan`);
  const pesanMassal = `LEMBUR ${tgl} ${jam} jam = ${calcTUL(jam)} TUL\n${selectedNames.map(n=>`• ${n}`).join('\n')}`;
  setTimeout(()=>{ window.open(`https://wa.me/?text=${encodeURIComponent(pesanMassal)}`, '_blank'); }, 800);
  setTimeout(fetchData, 1500);
}
async function hapusTransaksi(tgl, nama, jam){
  if(!confirm(`Hapus ${nama} - ${tgl} - ${jam} jam?`)) return;
  try{
    await jsonp(`${SYNC_URL}?action=deleteTransaksi&tanggal=${encodeURIComponent(tgl)}&nik=${encodeURIComponent(normNama(nama))}&jam=${encodeURIComponent(jam)}`);
    showToast('🗑️ Dihapus');
    setTimeout(fetchData, 800);
  }catch{ showToast('❌ Gagal hapus'); }
}
async function hapusKaryawanTUL(nama){
  if(!confirm(`Hapus semua TUL ${nama} di filter bulan ini?`)) return;
  const data = filteredData().filter(x=>normNama(x.nama)===normNama(nama));
  if(data.length===0){ showToast('Tidak ada data'); return; }
  if(!confirm(`Yakin hapus ${data.length} data ${nama}?`)) return;
  let del=0;
  for(const r of data){
    try{ await jsonp(`${SYNC_URL}?action=deleteTransaksi&tanggal=${encodeURIComponent(r.tanggal)}&nik=${encodeURIComponent(normNama(nama))}&jam=${encodeURIComponent(r.jam)}`); del++; }catch{}
    await new Promise(r=>setTimeout(r, 200));
  }
  showToast(`🗑️ ${del} data ${nama} dihapus`);
  setTimeout(fetchData, 1000);
}
function shareWA(nama, totalTUL){
  const pesan = `${nama} ${totalTUL} tul`;
  window.open(`https://wa.me/?text=${encodeURIComponent(pesan)}`, '_blank');
}
function shareAllWA(){
  const data = filteredData(); const grouped = groupByKaryawan(data);
  const bulanNama = filterBulan==='all' ? 'Semua Bulan' : ['', 'Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][parseInt(filterBulan)] || filterBulan;
  let pesan = `Update tul bulan ${bulanNama}\n` + grouped.map(g=> `${g.nama} ${g.totalTUL} tul`).join('\n');
  window.open(`https://wa.me/?text=${encodeURIComponent(pesan)}`, '_blank');
}
function render(){
  const app=document.getElementById('app');
  if(!isLogin){
    app.innerHTML=`<div class="min-h-screen grid place-items-center p-4 bg-zinc-900">
      <div class="w-full max-w-[360px] bg-white rounded-[24px] p-6 shadow-2xl">
        <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-zinc-900 text-white grid place-items-center font-bold">A</div><div><h1 class="font-bold text-[16px] leading-none">Admin</h1><p class="text-[11px] text-zinc-500 mt-1">16 Karyawan</p></div></div>
        <div class="mt-6 space-y-3"><input id="apass" type="password" placeholder="Password admin123" class="w-full h-11 rounded-xl border px-4 text-[14px] bg-zinc-50"><div id="aerr" class="text-[11px] text-red-600 min-h-[14px]"></div><button onclick="login()" class="w-full h-11 rounded-xl bg-zinc-900 text-white font-bold text-[13px]">Masuk</button></div>
      </div>
    </div>`; return;
  }
  const data=filteredData(); const grouped=groupByKaryawan(data);
  const bulanNama=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember']; const labelBulan=filterBulan==='all'?'Semua Bulan':bulanNama[parseInt(filterBulan)];

  app.innerHTML=`<div class="max-w-[900px] mx-auto min-h-screen bg-white md:my-4 md:rounded-[24px] md:border md:shadow-xl overflow-hidden">
    <div class="px-5 h-[48px] flex items-center justify-between border-b bg-white sticky top-0 z-10">
      <div class="font-bold text-[14px]">Admin</div>
      <button onclick="logout()" class="h-8 px-3 rounded-full bg-zinc-900 text-white text-[11px] font-bold">Logout</button>
    </div>
    <div class="p-4 space-y-4 bg-[#f6f5f4]">
      <div class="rounded-[20px] bg-white border shadow-sm p-4">
        <div class="flex items-center justify-between mb-3">
          <div class="font-bold text-[14px]">Input Lembur Massal</div>
          <button onclick="selectAllMassal()" class="h-8 px-3 rounded-full bg-zinc-900 text-white text-[11px] font-bold">Pilih Semua</button>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-2 mb-3">
          <div><div class="text-[10px] text-zinc-500 mb-1">Tanggal</div><input id="massalTgl" type="date" value="${new Date().toISOString().slice(0,10)}" class="w-full h-10 rounded-xl border bg-zinc-50 px-3 text-[13px]"></div>
          <div><div class="text-[10px] text-zinc-500 mb-1">Jam</div><select id="massalJam" class="w-full h-10 rounded-xl border bg-zinc-50 px-3 text-[13px] font-bold"><option value="2">2 jam = 3.5 TUL</option><option value="3" selected>3 jam = 5.5 TUL</option><option value="4">4 jam = 7.5 TUL</option><option value="6">6 jam = 12 TUL</option><option value="7">7 jam = 14 TUL</option><option value="8">8 jam = 16 TUL</option></select></div>
          <div class="flex flex-col justify-end"><div id="massalCount" class="text-[11px] font-bold text-zinc-600 mb-1">0 karyawan dipilih</div><button onclick="handleInputMassal()" class="w-full h-10 rounded-xl bg-zinc-900 text-white font-bold text-[13px]">Simpan</button></div>
        </div>
        <div id="massalList" class="grid grid-cols-2 md:grid-cols-3 gap-2 max-h-[280px] overflow-y-auto p-1"></div>
      </div>
      <div class="rounded-[16px] bg-white border p-3 flex gap-2">
        <select onchange="filterBulan=this.value;render()" class="flex-1 h-10 rounded-xl border bg-zinc-50 px-3 text-[13px] font-semibold"><option value="all" ${filterBulan==='all'?'selected':''}>Semua Bulan</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${filterBulan==i+1?'selected':''}>${bulanNama[i+1]}</option>`).join('')}</select>
        <select onchange="filterTahun=this.value;render()" class="flex-1 h-10 rounded-xl border bg-zinc-50 px-3 text-[13px] font-semibold"><option value="all" ${filterTahun==='all'?'selected':''}>Semua Tahun</option><option value="2024">2024</option><option value="2025">2025</option><option value="2026">2026</option></select>
        <button onclick="shareAllWA()" class="h-10 px-4 rounded-xl bg-zinc-900 text-white text-[12px] font-bold">WA All</button>
      </div>
      <div class="rounded-[20px] bg-white border shadow-sm overflow-hidden">
        <div class="px-4 py-3 border-b flex justify-between items-center"><div class="font-bold text-[13px]">Rekap TUL - ${labelBulan}</div><div class="text-[11px] text-zinc-500">${grouped.length} karyawan</div></div>
        <div class="overflow-x-auto"><table class="w-full text-[12px]"><thead class="bg-zinc-50 text-[10px] uppercase font-bold text-zinc-500"><tr><th class="text-left px-4 py-2.5">#</th><th class="text-left px-4 py-2.5">Nama</th><th class="text-center px-4 py-2.5">TUL</th><th class="text-center px-4 py-2.5">Aksi</th></tr></thead><tbody class="divide-y">${grouped.length===0?`<tr><td colspan="4" class="py-10 text-center text-zinc-500">Tidak ada data</td></tr>`:grouped.map((g,i)=>`<tr><td class="px-4 py-3 font-bold">${i+1}</td><td class="px-4 py-3 font-semibold">${g.nama}<div class="text-[10px] text-zinc-500">${g.totalJam}j • ${g.hari} hari</div></td><td class="px-4 py-3 text-center font-bold">${g.totalTUL}</td><td class="px-4 py-3 text-center"><div class="flex gap-1 justify-center"><button onclick="shareWA('${g.nama}',${g.totalTUL})" class="h-7 px-2 rounded-full bg-zinc-900 text-white text-[10px] font-bold">WA</button><button onclick="hapusKaryawanTUL('${g.nama}')" class="h-7 px-2 rounded-full bg-red-600 text-white text-[10px] font-bold">Hapus</button></div></td></tr>`).join('')}</tbody></table></div>
      </div>
      <div class="rounded-[20px] bg-white border shadow-sm overflow-hidden">
        <div class="px-4 py-3 border-b font-bold text-[13px]">Detail Riwayat (${data.length})</div>
        <div class="divide-y max-h-[400px] overflow-y-auto">
          ${data.length===0?`<div class="p-6 text-center text-[12px] text-zinc-500">Tidak ada data</div>`:
            data.slice(0,100).map(r=>`<div class="px-4 py-2.5 flex items-center gap-3"><div class="flex-1"><div class="font-bold text-[12px]">${r.nama} • ${r.tanggal}</div><div class="text-[10px] text-zinc-500">${r.jam} jam = ${r.tul} TUL</div></div><button onclick="hapusTransaksi('${r.tanggal}','${r.nama}',${r.jam})" class="h-7 px-3 rounded-full bg-red-50 border border-red-200 text-red-600 text-[10px] font-bold">Hapus</button></div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
  renderMassalList();
}
if(isLogin) fetchData(); else render();
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
