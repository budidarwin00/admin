<script>
const URL='https://script.google.com/macros/s/AKfycbz-Tgif9wJD6PAidITjE3-55BInA4pHZAibDI3mAIYUp_6DQV8may5oJkwyY0nHx4qE/exec';
const TUL={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};
const calc=j=>TUL[j]||j*1.5;
const norm=t=>{let s=String(t).trim();if(s.includes('T'))s=s.split('T')[0];s=s.replace('Z','');let m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];m=s.match(/(\d{1,2})[\-\/](\d{1,2})[\-\/](\d{4})/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return s;}
const fmt=t=>{let p=norm(t).split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:t;}

function toISODate(ddmmyyyy){let m=ddmmyyyy.match(/(\d{1,2})-(\d{1,2})-(\d{4})/);if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); return '';}
function j(u){return new Promise((r,jo)=>{let c='cb'+Date.now();window[c]=d=>{delete window[c];document.getElementById(c)?.remove();r(d);};let s=document.createElement('script');s.id=c;s.src=u+'&callback='+c+'&_='+Date.now();s.onerror=()=>{delete window[c];s.remove();jo();};document.body.appendChild(s);});}
let all=[],filter=localStorage.getItem('fb')||'all',show=6,login=!!localStorage.getItem('admin_login');
let members=[];
let parsedWA=[];
async function load(){let a=document.getElementById('a');if(!login)return render();a.innerHTML='<div class=empty>Loading...</div>';try{let d=await j(URL+'?action=read');if(Array.isArray(d)){all=d.map(x=>{let jn=Number(x.jam||0);if(![2,3,4,6,7,8].includes(jn))return null;let t=norm(x.tanggal);return{tanggal:t,nama:String(x.nama||'').trim(),jam:jn,tul:calc(jn)}}).filter(Boolean);}}catch{} try{let m=await j(URL+'?action=listmembers');if(m&&m.members)members=m.members;}catch{} render();}
function f(){if(filter==='all')return all;return all.filter(r=>Number(r.tanggal.split('-')[1])===Number(filter));}
function g(d){let m={};d.forEach(r=>{if(!m[r.tanggal])m[r.tanggal]=[];m[r.tanggal].push(r);});return Object.keys(m).sort((a,b)=>new Date(b)-new Date(a)).map(k=>({tanggal:k,rows:m[k]}));}
function gk(d){let m={};d.forEach(r=>{if(!m[r.nama])m[r.nama]={nama:r.nama,c:0,tot:0};m[r.nama].c++;m[r.nama].tot+=r.tul;});return Object.values(m).sort((a,b)=>b.tot-a.tot);}
function exportPDF(){let data=f();let html='<html><head><title>AREA EF Admin</title><style>body{font-family:system-ui;padding:20px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #ddd;padding:6px;font-size:11px}th{background:#f1f5f9}</style></head><body>';html+='<h2>AREA EF - Rekap '+data.length+' data</h2>';let rk=gk(data);html+='<h3>Rekap</h3><table><tr><th>Nama</th><th>Hari</th><th>TUL</th></tr>';rk.forEach(k=>{html+='<tr><td>'+k.nama+'</td><td>'+k.c+'</td><td>'+k.tot+'</td></tr>';});html+='</table><br><h3>Detail</h3><table><tr><th>Tanggal</th><th>Nama</th><th>Jam</th><th>TUL</th></tr>';data.forEach(r=>{html+='<tr><td>'+fmt(r.tanggal)+'</td><td>'+r.nama+'</td><td>'+r.jam+'</td><td>'+r.tul+'</td></tr>';});html+='</table><br><button onclick=window.print()>Cetak</button></body></html>';let w=window.open('','_blank');w.document.write(html);w.document.close();}
function parseWAPlan(){
  let txt=document.getElementById('waPlan').value||'';
  if(!txt.trim()){alert('Paste plan WA dulu');return;}
  let lines=txt.split(/\n/).map(s=>s.trim()).filter(Boolean);
  let tanggal='';
  // cari tanggal di teks
  for(let line of lines){
    let m=line.match(/(\d{1,2})[\-\/\.](\d{1,2})[\-\/\.](\d{2,4})/);
    if(m){
      let d=m[1].padStart(2,'0'), mo=m[2].padStart(2,'0'), y=m[3];
      if(y.length===2) y=(Number(y)<=30?'20'+y:'19'+y);
      tanggal=d+'-'+mo+'-'+y;
      break;
    }
  }
  // jika input tanggal manual ada, pakai itu
  let manualTgl=document.getElementById('tglMasal').value;
  if(manualTgl){ tanggal=toDDMMYYYY(manualTgl); }
  if(!tanggal){
    // coba ambil dari input tanggal wa
    let waTgl=document.getElementById('waTanggal').value;
    if(waTgl) tanggal=toDDMMYYYY(waTgl);
  }
  if(!tanggal){ alert('Tanggal tidak ketemu, isi tanggal manual dulu'); return; }
  parsedWA=[];
  lines.forEach(line=>{
    // skip baris yang hanya tanggal
    if(line.match(/^\s*\d{1,2}[\-\/\.]/) && line.match(/\d{2,4}\s*$/ ) && line.split(/\s+/).length<=2) return;
    // cari jam: 2j, 2 j, 2jam, 2 jam, 8j, etc.
    let mJam=line.match(/(\d+)\s*j(?:am)?/i);
    if(!mJam) mJam=line.match(/(\d+)\s*jam/i);
    if(!mJam) return;
    let jam=Number(mJam[1]);
    if(![2,3,4,6,7,8].includes(jam)) return;
    let nama=line.replace(mJam[0],'').replace(/[-:,]/g,'').trim();
    // ambil kata pertama sebagai nama anggota
    if(!nama) return;
    // normalisasi nama ke 1 kata terakhir
    let parts=nama.split(/\s+/);
    let namaPendek=parts[0];
    // cek di members cache
    let lower=nama.toLowerCase();
    for(let mem of members){
      let short=(mem.nama||'').toLowerCase();
      if(lower.includes(short) || short.includes(lower) || lower.includes((mem.namaLengkapAsli||'').toLowerCase())){
        namaPendek=mem.nama;
        break;
      }
    }
    parsedWA.push({tanggal:tanggal,nama:namaPendek,jam:jam,raw:line});
  });
  if(parsedWA.length===0){alert('Tidak ada data jam ketemu. Format: Budi 2j atau Nely 4j'); return;}
  // tampilkan preview
  let previewDiv=document.getElementById('waPreview');
  let html='<div style="margin-top:10px"><b>Preview ('+parsedWA.length+' data) - Tanggal: '+tanggal+'</b><table class=preview-table><tr><th>Tanggal</th><th>Nama (anggota)</th><th>Jam</th><th>TUL</th><th>Raw</th></tr>';
  parsedWA.forEach(p=>{
    html+='<tr><td>'+p.tanggal+'</td><td>'+p.nama+'</td><td>'+p.jam+'j</td><td>'+(TUL[p.jam]||'')+'</td><td style="color:#94a3b8">'+p.raw+'</td></tr>';
  });
  html+='</table><div style="margin-top:8px"><button onclick=simpanWA() class=btn btn-green>Simpan '+parsedWA.length+' Data</button></div></div>';
  previewDiv.innerHTML=html;
  // set tanggal input
  let iso=toISODate(tanggal);
  if(iso) document.getElementById('tglMasal').value=iso;
}
async function simpanWA(){
  if(parsedWA.length===0){alert('Preview kosong');return;}
  let btn=document.getElementById('btnSimpanWA');
  if(btn){btn.innerText='Menyimpan...';btn.disabled=true;}
  try{
    let dataStr=encodeURIComponent(JSON.stringify(parsedWA));
    let res=await j(URL+'?action=addbulk&data='+dataStr);
    if(res&&res.ok){
      alert('Berhasil simpan '+res.added+' data dari WA');
      parsedWA=[];
      document.getElementById('waPreview').innerHTML='';
      document.getElementById('waPlan').value='';
      load();
    } else {
      alert('Gagal: '+(res.error||'unknown'));
    }
  }catch(e){alert('Gagal konek: '+e.message);}
  if(btn){btn.innerText='Simpan';btn.disabled=false;}
}
async function simpanMasal(){let tglInput=document.getElementById('tglMasal');if(!tglInput||!tglInput.value){alert('Pilih tanggal dulu');return;}let tgl=toDDMMYYYY(tglInput.value);let items=[];document.querySelectorAll('.jam-select').forEach(sel=>{let jam=Number(sel.value);let nama=sel.getAttribute('data-nama');if(jam&&nama){items.push({tanggal:tgl,nama:nama,jam:jam});}});if(items.length===0){alert('Pilih jam minimal 1 anggota');return;}let btn=document.getElementById('btnMasal');btn.innerText='Menyimpan '+items.length+' data...';btn.disabled=true;try{let dataStr=encodeURIComponent(JSON.stringify(items));let res=await j(URL+'?action=addbulk&data='+dataStr);if(res&&res.ok){alert('Berhasil simpan '+res.added+' data');document.querySelectorAll('.jam-select').forEach(s=>s.value='0');load();}else{alert('Gagal: '+(res.error||'unknown'));}}catch(e){alert('Gagal konek: '+e.message);}btn.innerText='Simpan Massal';btn.disabled=false;}
function doLogin(){let p=document.getElementById('p').value;if(p==='admin123'){localStorage.setItem('admin_login','1');login=true;load();}else document.getElementById('e').innerText='Salah';}

h+='<div class=wa-box><div class=wa-h>PASTE PLAN WA - Cek Preview & Simpan</div><div style="padding:12px"><div style="font-size:11px">Paste format WA, contoh:<br>05-05-2026<br>Budi 2j<br>Nely 4j<br>Aditya 6j</div><textarea id=waPlan class=wa-text placeholder="Paste plan WA di sini...&#10;05-05-2026&#10;Budi 2j&#10;Nely 4j&#10;Aditya 6j"></textarea><div style="margin-top:8px;display:flex;gap:8px"><button onclick=parseWAPlan() class=btn btn-b>Cek Preview</button><button id=btnSimpanWA onclick=simpanWA() class=btn btn-green>Simpan</button></div><div id=waPreview></div></div></div>';
// Massal manual
h+='<div class=masal><div class=masal-h><span>SIMPAN MASSAL Manual - Pilih Jam</span><button id=btnMasal onclick=simpanMasal() class=btn btn-green>Simpan Massal</button></div>';if(members.length===0){h+='<div class=empty>Memuat anggota...</div>';}else{members.forEach(m=>{let nm=m.nama||'';h+='<div class=masal-row><span>'+nm+' <small style="color:#94a3b8">'+(m.namaLengkapAsli||'')+'</small></span><select class="sel jam-select" data-nama="'+nm+'"><option value=0>Tidak Lembur</option><option value=2>2j (3.5)</option><option value=3>3j (5.5)</option><option value=4>4j (7.5)</option><option value=6>6j (12)</option><option value=7>7j (14)</option><option value=8>8j (17)</option></select></div>';});}h+='</div>';
if(rk.length){h+='<div class=rekap><div style="font-size:10px;font-weight:700;letter-spacing:.1em">REKAP '+data.length+' DATA</div>';rk.forEach(k=>{h+='<div class=row style="padding:6px 0"><span>'+k.nama+' • '+k.c+' hari</span><b>'+k.tot+' TUL</b></div>'});h+='</div>';}if(gg.length===0){h+='<div class=empty>TIDAK ADA DATA<br>Total: '+all.length+'</div>';}else{gg.slice(0,show).forEach(x=>{let tot=x.rows.reduce((s,r)=>s+r.tul,0);h+='<div class=card><div class=card-h><div><div class=dt>'+fmt(x.tanggal)+'</div><div class=meta>'+x.rows.length+' orang • '+tot+' TUL</div></div><button onclick="if(confirm('Hapus '+fmt(x.tanggal)+' ?')){j(''+URL+'?action=deletetanggal&tanggal='+x.tanggal+'').then(()=>load())}" class=btn>Hapus</button></div>';x.rows.forEach(r=>{h+='<div class=row><span>'+r.nama+'</span><span>'+r.jam+'j • '+r.tul+' TUL</span></div>'});h+='</div>';});if(show<gg.length)h+='<div style=padding:12px><button onclick=show+=8;render() class="btn btn-b" style="width:100%;height:38px">Load lagi ('+(gg.length-show)+')</button></div>';}a.innerHTML=h;let tglEl=document.getElementById('tglMasal');if(tglEl&&!tglEl.value){let now=new Date();tglEl.value=now.toISOString().split('T')[0];}}

</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
