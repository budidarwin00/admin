</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AREA EF - Admin</title>
<script src="https://cdn.tailwindcss.com"></script>

</head><body>
<div id="app"></div>
<script>
const SYNC_URL='https://script.google.com/macros/s/AKfycbz-Tgif9wJD6PAidITjE3-55BInA4pHZAibDI3mAIYUp_6DQV8may5oJkwyY0nHx4qE/exec';
const FALLBACK_URL='https://script.google.com/macros/s/AKfycbzUWTx3o5DjsfrM7JTZBbnYYaMBzFLbH3-mfs0dCFm1uOGouvDqCBpc3KOgNPgKNoHL/exec';
const ADMIN_PASS='admin123';
const TUL_MAP={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};
function calcTUL(j){j=Number(j);return TUL_MAP[j]||j*1.5;}
function isJamValid(j){j=Number(j);return j>0&&j<=24;}
function normNama(n){return String(n||'').trim().toLowerCase();}
function normalizeTanggal(t){if(!t)return'';let s=String(t).trim();let m=s.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);if(m){return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}m=s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);if(m){return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');}try{let d=new Date(s);if(!isNaN(d))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}catch(e){}return s;}
function formatTanggal(t){let p=normalizeTanggal(t).split('-');if(p.length===3)return p[2]+'-'+p[1]+'-'+p[0];return t;}
function parseSort(t){let p=normalizeTanggal(t).split('-');if(p.length!==3)return 0;return new Date(p[0],p[1]-1,p[2]).getTime();}
const ALIAS={'kuncoro budi':'Budi','kuncoro':'Budi','budi kuncoro':'Budi','neli':'Nely','nely':'Nely','annisa':'Anisa','aditya zozo':'Aditya','adit':'Aditya','dozen':'Dozen','supri':'Supriyadi','topik':'Topik','zaelani':'Zaelani','aaf':'Aaf'};
function normNamaAnggota(n){if(!n)return'';let k=String(n).trim().toLowerCase();if(ALIAS[k])return ALIAS[k];for(let a in ALIAS){if(k.includes(a))return ALIAS[a];}return String(n).trim().split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');}
const DEFAULT_KARYAWAN=['Aaf','Aditya','Anah','Anisa','Arief','Budi','Dozen','Eka','Nely','Nia','Putri','Supriyadi','Syarif','Topik','Yudi','Zaelani'].map(n=>({nama:n}));
function getKaryawan(){try{let c=localStorage.getItem('custom_karyawan');if(c){let a=JSON.parse(c);if(Array.isArray(a)&&a.length)return a;}}catch{}return DEFAULT_KARYAWAN;}
let allData=[];let isLogin=!!localStorage.getItem('admin_login');let filterBulan='all';let showInput=false;let showKelola=false;
function toast(m){let t=document.createElement('div');t.className='fixed bottom-6 left-1/2 -translate-x-1/2 bg-black text-white px-5 py-2.5 rounded-full text-[11px] z-50';t.innerText=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}
function jsonp(url){return new Promise((res,rej)=>{let cb='cb_'+Date.now()+Math.random().toString(36).slice(2);window[cb]=(d)=>{delete window[cb];document.getElementById(cb)?.remove();res(d);};let s=document.createElement('script');s.id=cb;s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&_='+Date.now();s.onerror=()=>{delete window[cb];s.remove();rej(new Error('offline'));};document.body.appendChild(s);});}
async function fetchData(force=false){
  if(force){try{localStorage.removeItem('cache_lembur');allData=[];}catch{}}
  try{let cc=localStorage.getItem('cache_lembur');if(cc&&!allData.length){let j=JSON.parse(cc);allData=j.map(r=>({tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal),nama:r.nama,jam:Number(r.jam),tul:calcTUL(Number(r.jam))}));}}
  catch{}
  try{
    let j=await jsonp(SYNC_URL+'?action=read&_='+Date.now());
    if(!j||!j.length){try{let j2=await jsonp(FALLBACK_URL+'?action=read&_='+Date.now());if(j2&&j2.length)j=j2;}catch{}}
    if(Array.isArray(j)&&j.length){
      let raw=j.map(r=>{let jam=Number(r.jam||0);if(!isJamValid(jam))return null;let nm=normNamaAnggota(r.nama||r.nik||'');if(!nm)return null;return{tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal),nama:nm,jam:jam,tul:calcTUL(jam)};}).filter(Boolean);
      let dedup={};let out=[];raw.forEach(r=>{let k=r.tanggalNorm+'|'+normNama(r.nama)+'|'+r.jam;if(!dedup[k]){dedup[k]=1;out.push(r);}});
      if(out.length)allData=out;
      try{localStorage.setItem('cache_lembur',JSON.stringify(allData));}catch{}
    }
  }catch(e){}
  allData.sort((a,b)=>parseSort(b.tanggalNorm)-parseSort(a.tanggalNorm));
  render();
}
function filtered(){if(filterBulan==='all')return allData;return allData.filter(r=>{let p=r.tanggalNorm.split('-');return p.length===3&&Number(p[1])===Number(filterBulan);});}
function groupTanggal(data){let m={};data.forEach(r=>{if(!m[r.tanggalNorm])m[r.tanggalNorm]=[];m[r.tanggalNorm].push(r);});return Object.keys(m).sort((a,b)=>parseSort(b)-parseSort(a)).map(k=>({tanggal:k,rows:m[k]}));}
function groupKaryawan(data){let m={};data.forEach(r=>{let k=normNama(r.nama);if(!m[k])m[k]={nama:r.nama,total:0,count:0};m[k].total+=r.tul;m[k].count++;});return Object.values(m).sort((a,b)=>b.total-a.total);}
function login(){let p=document.getElementById('apass').value;if(p===ADMIN_PASS){localStorage.setItem('admin_login','1');isLogin=true;fetchData();}else document.getElementById('aerr').innerText='Password salah';}
function logout(){localStorage.removeItem('admin_login');isLogin=false;render();}
function hapusTgl(t){if(!confirm('Hapus semua '+formatTanggal(t)+'?'))return;allData=allData.filter(r=>r.tanggalNorm!==t);try{localStorage.setItem('cache_lembur',JSON.stringify(allData));}catch{}render();jsonp(SYNC_URL+'?action=deleteTanggal&tanggal='+encodeURIComponent(t.split('-').reverse().join('-'))+'&tanggalISO='+encodeURIComponent(t)+'&_='+Date.now());setTimeout(()=>fetchData(true),1000);}
function hapusOne(t,n,j){if(!confirm('Hapus '+n+'?'))return;allData=allData.filter(r=>!(r.tanggalNorm===t&&normNama(r.nama)===normNama(n)&&Number(r.jam)===Number(j)));try{localStorage.setItem('cache_lembur',JSON.stringify(allData));}catch{}render();jsonp(SYNC_URL+'?action=delete&tanggal='+encodeURIComponent(t.split('-').reverse().join('-'))+'&tanggalISO='+encodeURIComponent(t)+'&nama='+encodeURIComponent(n)+'&jam='+j+'&_='+Date.now());setTimeout(()=>fetchData(true),1000);}
function parsePlan(){let txt=(document.getElementById('txtPesan')?.value||'').trim();if(!txt){toast('Tempel plan dulu');return;}let lines=txt.split('\n');let cur='';let items=[];lines.forEach(line=>{line=line.trim();if(!line)return;let m=line.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);if(m){let d=m[1].padStart(2,'0'),mo=m[2].padStart(2,'0'),y=m[3];if(y.length===2)y='20'+y;cur=d+'-'+mo+'-'+y;return;}let jm=line.match(/(\d{1,2})\s*j/i);if(jm&&cur){let jam=Number(jm[1]);let namaPart=line.replace(/\d+\s*j.*/i,'').replace(/[-–—]/g,' ').trim();if(!namaPart)namaPart=line.split(' ')[0];let nm=normNamaAnggota(namaPart);if(nm&&isJamValid(jam))items.push({tanggal:cur,nama:nm,jam:jam});}});let cont=document.getElementById('previewPesan');cont.innerHTML=items.length?items.map(it=>'<div class="flex justify-between py-1 text-[11px]"><span>'+it.tanggal+' - '+it.nama+'</span><span>'+it.jam+'j • '+calcTUL(it.jam)+' TUL</span></div>').join(''):'<div class="text-[11px] text-slate-400">Tidak ada data</div>';cont.classList.remove('hidden');cont._items=items;}
async function simpanPlan(){let cont=document.getElementById('previewPesan');let items=cont._items||[];if(!items.length){toast('Preview dulu');return;}toast('Menyimpan '+items.length);try{let fd=new FormData();fd.append('action','addBulk');fd.append('items',JSON.stringify(items));await fetch(SYNC_URL,{method:'POST',body:fd});}catch{}items.forEach(it=>allData.push({tanggal:it.tanggal,tanggalNorm:normalizeTanggal(it.tanggal),nama:it.nama,jam:it.jam,tul:calcTUL(it.jam)}));try{localStorage.setItem('cache_lembur',JSON.stringify(allData));}catch{}showInput=false;render();setTimeout(()=>fetchData(true),800);}
function simpanManual(){let t=document.getElementById('manTgl').value.trim();let n=normNamaAnggota(document.getElementById('manNama').value.trim());let j=Number(document.getElementById('manJam').value);if(!t||!n||!isJamValid(j)){toast('Lengkapi');return;}let items=[{tanggal:t,nama:n,jam:j}];(async()=>{try{let fd=new FormData();fd.append('action','addBulk');fd.append('items',JSON.stringify(items));await fetch(SYNC_URL,{method:'POST',body:fd});}catch{}allData.push({tanggal:t,tanggalNorm:normalizeTanggal(t),nama:n,jam:j,tul:calcTUL(j)});try{localStorage.setItem('cache_lembur',JSON.stringify(allData));}catch{}showInput=false;render();fetchData(true);})();}
function render(){
  if(!isLogin){
    document.getElementById('app').innerHTML='<div class="min-h-screen grid place-items-center p-6"><div class="w-full max-w-[320px]"><div class="mb-12"><div class="text-[10px] tracking-[0.3em] text-slate-400">AREA EF</div><div class="text-[24px] font-light mt-2">Admin</div></div><input id="apass" type="password" placeholder="Password" class="w-full h-[44px] border-b border-slate-200 bg-transparent px-0 text-[14px] focus:border-black focus:outline-none"><div id="aerr" class="text-[11px] text-red-500 mt-3 min-h-[14px]"></div><button onclick="login()" class="w-full h-[44px] bg-black text-white rounded-full text-[12px] mt-6">Masuk</button></div></div>';
    return;
  }
  let data=filtered();let gTgl=groupTanggal(data);let gKar=groupKaryawan(data);let total=data.reduce((s,r)=>s+r.tul,0);
  let html='';
  html+='<div class="sticky top-0 z-10 bg-white/80 backdrop-blur border-b border-slate-100 px-6 py-4 flex justify-between items-center"><div class="text-[10px] tracking-[0.25em] text-slate-400">AREA EF</div><div class="flex gap-3 items-center"><span class="mono text-[11px] text-slate-500">'+allData.length+' data</span><button onclick="logout()" class="text-[11px] text-slate-400">Keluar</button></div></div>';
  html+='<div class="max-w-[520px] mx-auto px-6 py-8">';
  // Total + filter - super simple, no nav bar
  html+='<div class="mb-8"><div class="flex items-baseline gap-2"><div class="mono text-[54px] font-light leading-none tracking-tighter">'+total+'</div><div class="text-[10px] tracking-[0.2em] text-slate-400">TUL</div></div>';
  html+='<div class="mt-6 flex gap-2"><select onchange="filterBulan=this.value;render()" class="h-[36px] px-4 rounded-full bg-slate-50 border border-slate-200 text-[11px]"><option value="all" '+(filterBulan==='all'?'selected':'')+'>Semua Bulan</option><option value="1" '+(filterBulan==='1'?'selected':'')+'>Jan</option><option value="2" '+(filterBulan==='2'?'selected':'')+'>Feb</option><option value="3" '+(filterBulan==='3'?'selected':'')+'>Mar</option><option value="4" '+(filterBulan==='4'?'selected':'')+'>Apr</option><option value="5" '+(filterBulan==='5'?'selected':'')+'>Mei</option><option value="6" '+(filterBulan==='6'?'selected':'')+'>Jun</option><option value="7" '+(filterBulan==='7'?'selected':'')+'>Jul</option><option value="8" '+(filterBulan==='8'?'selected':'')+'>Agu</option><option value="9" '+(filterBulan==='9'?'selected':'')+'>Sep</option><option value="10" '+(filterBulan==='10'?'selected':'')+'>Okt</option><option value="11" '+(filterBulan==='11'?'selected':'')+'>Nov</option><option value="12" '+(filterBulan==='12'?'selected':'')+'>Des</option></select><button onclick="fetchData(true)" class="h-[36px] px-4 rounded-full border border-slate-200 text-[11px]">Refresh</button><button onclick="showInput=!showInput;render()" class="h-[36px] px-5 rounded-full bg-black text-white text-[11px]">'+(showInput?'Tutup':'Input')+'</button></div></div>';

  if(showInput){
    html+='<div class="mb-10 space-y-4 border border-black rounded-[20px] p-5">';
    html+='<div><div class="mono text-[11px] mb-2">PASTE PLAN</div><textarea id="txtPesan" rows="5" class="w-full bg-slate-50 border border-slate-100 rounded-[12px] p-3 text-[12px] mono" placeholder="18-10-2025&#10;Budi 6j&#10;Anisa 4j"></textarea><div id="previewPesan" class="hidden mt-3 bg-white border rounded-[12px] p-3"></div><div class="flex gap-2 mt-3"><button onclick="parsePlan()" class="h-[32px] px-4 rounded-full border text-[11px]">Preview</button><button onclick="simpanPlan()" class="h-[32px] px-4 rounded-full bg-black text-white text-[11px]">Simpan</button></div></div>';
    html+='<div class="pt-4 border-t border-slate-100"><div class="mono text-[11px] mb-2">MANUAL</div><div class="grid grid-cols-3 gap-2"><input id="manTgl" placeholder="DD-MM-YYYY" class="h-[36px] border rounded-[10px] px-3 text-[12px]"><select id="manNama" class="h-[36px] border rounded-[10px] px-2 text-[12px]"><option value="">Nama</option>'+getKaryawan().map(k=>'<option>'+k.nama+'</option>').join('')+'</select><input id="manJam" type="number" placeholder="Jam" class="h-[36px] border rounded-[10px] px-3 text-[12px]"></div><button onclick="simpanManual()" class="mt-2 w-full h-[36px] bg-black text-white rounded-full text-[11px]">Simpan Manual</button></div>';
    html+='</div>';
  }

  // REKAP - langsung terlihat, tanpa tab
  if(gKar.length){
    html+='<div class="mb-10"><div class="mono text-[10px] tracking-[0.2em] text-slate-400 mb-3">REKAP PER ANGGOTA — '+data.length+' transaksi</div><div class="border border-slate-100 rounded-[16px] divide-y divide-slate-50">';
    for(let k of gKar){html+='<div class="flex justify-between items-center p-4"><div><div class="text-[13px]">'+k.nama+'</div><div class="mono text-[10px] text-slate-400">'+k.count+' hari</div></div><div class="mono text-[13px]">'+k.total+' TUL</div></div>';}
    html+='</div></div>';
  }

  // HISTORY - tanpa bar navigasi
  if(gTgl.length===0){html+='<div class="py-20 text-center mono text-[11px] text-slate-300">TIDAK ADA DATA</div>';}
  else{
    html+='<div class="mb-3 mono text-[10px] tracking-[0.2em] text-slate-400">DETAIL HARIAN</div>';
    for(let g of gTgl){
      html+='<div class="mb-6"><div class="flex justify-between items-center py-2"><div class="mono text-[11px] text-slate-500">'+formatTanggal(g.tanggal)+'</div><button onclick="hapusTgl(\''+g.tanggal+'\')" class="text-[10px] text-slate-300">hapus tgl</button></div>';
      for(let r of g.rows){html+='<div class="flex justify-between py-3 border-t border-slate-50"><div class="text-[13px]">'+r.nama+' <span class="mono text-[11px] text-slate-400">'+r.jam+'j • '+r.tul+'</span></div><button onclick="hapusOne(\''+r.tanggalNorm+'\',\''+r.nama+'\',\''+r.jam+'\')" class="text-[10px] text-slate-200">✕</button></div>';}
      html+='</div>';
    }
  }

  html+='<div class="mt-16 pt-6 border-t border-slate-100 flex justify-between"><button onclick="showKelola=!showKelola;render()" class="mono text-[10px] text-slate-400">'+(showKelola?'Tutup kelola':'Kelola anggota')+'</button><span class="mono text-[9px] text-slate-300">'+allData.length+' DATA</span></div>';
  if(showKelola){
    let kar=getKaryawan();
    html+='<div class="mt-4 border border-slate-200 rounded-[16px] p-4"><div class="mono text-[11px] mb-3">ANGGOTA ('+kar.length+')</div><div class="space-y-2">'+kar.map(k=>'<div class="flex justify-between text-[12px] py-1 border-b border-slate-50"><span>'+k.nama+'</span><button onclick="if(confirm(\'Hapus '+k.nama+'?\')){let a=getKaryawan().filter(x=>x.nama!==\''+k.nama+'\');localStorage.setItem(\'custom_karyawan\',JSON.stringify(a));render();}" class="text-[10px] text-slate-300">hapus</button></div>').join('')+'</div><div class="mt-3 flex gap-2"><input id="newNama" placeholder="Nama baru" class="flex-1 h-[32px] border rounded-full px-3 text-[11px]"><button onclick="let v=document.getElementById(\'newNama\').value.trim();if(!v)return;let a=getKaryawan();a.push({nama:v});localStorage.setItem(\'custom_karyawan\',JSON.stringify(a));render();" class="h-[32px] px-4 bg-black text-white rounded-full text-[11px]">Tambah</button></div></div>';
  }

  html+='</div>';
  document.getElementById('app').innerHTML=html;
}
fetchData();
</script>
