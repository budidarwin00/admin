<div id="app"></div>
<script>
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbwVWEV9p0d23Co_3Bt0NT0z-YTWNRHh4DBCCmhGc2C9FcQbhgowLK0i0FyzQKgyRsvrYQ/exec';
const ADMIN_PASS='admin123';
const TUL_MAP={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};
const calcTUL=j=>TUL_MAP[j]||j*2;
const LOGO_DATA = "REPLACE_WITH_BASE64";
function normNama(n){return String(n||'').trim().toLowerCase();}
function normalizeTanggal(t){if(!t)return'';let s=String(t).trim();if(s.includes('T'))s=s.split('T')[0];if(s.includes(' '))s=s.split(' ')[0];try{const d=new Date(t);if(!isNaN(d.getTime())){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}}catch{}return s;}
function formatTanggal(t){const p=normalizeTanggal(t).split('-');if(p.length===3)return `${p[2]}-${p[1]}-${p[0]}`;return t;}
const DEFAULT_KARYAWAN=[{nama:'Nia',pass:'1234'},{nama:'Aditya',pass:'1234'},{nama:'Anisa',pass:'1234'},{nama:'Aaf',pass:'1234'},{nama:'Syarif',pass:'1234'},{nama:'Budi',pass:'1234'},{nama:'Topik',pass:'1234'},{nama:'Yudi',pass:'1234'},{nama:'Dozen',pass:'1234'},{nama:'Putri',pass:'1234'},{nama:'Arief',pass:'1234'},{nama:'Anah',pass:'1234'},{nama:'Supriyadi',pass:'1234'},{nama:'Eka',pass:'1234'},{nama:'Nely',pass:'1234'},{nama:'Zaelani',pass:'1234'}];
let isLogin=localStorage.getItem('admin_login')==='true';
let allData=[];let karyawanList=JSON.parse(localStorage.getItem('rk_kar_admin_nonik')||'null');if(!karyawanList||karyawanList.length<16){karyawanList=DEFAULT_KARYAWAN;localStorage.setItem('rk_kar_admin_nonik',JSON.stringify(karyawanList));}
let selectedMassal={};let syncStatus='● Sinkron';let activeTab='massal';
function showToast(m){const t=document.createElement('div');t.className='fixed bottom-4 left-1/2 -translate-x-1/2 bg-zinc-900 text-white px-5 py-3 rounded-full text-[13px] font-semibold z-50';t.innerText=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3000);}
function jsonp(url){return new Promise((res,rej)=>{const cb='cb_'+Date.now()+Math.random().toString(36).slice(2);window[cb]=d=>{delete window[cb];document.getElementById(cb)?.remove();res(d);};const s=document.createElement('script');s.id=cb;s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&t='+Date.now();s.onerror=()=>{delete window[cb];s.remove();rej(new Error('fail'));};document.body.appendChild(s);setTimeout(()=>{if(window[cb]){delete window[cb];s.remove();rej(new Error('Timeout'));}},12000);});}
async function fetchData(){syncStatus='Memuat...';render();try{const j=await jsonp(SYNC_URL+'?action=read');if(Array.isArray(j)){let raw=j.map(r=>({tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal),nama:r.nama||r.nik,jam:Number(r.jam||0),tul:calcTUL(Number(r.jam||0))})).filter(x=>x.nama);const m=new Map();raw.forEach(r=>{const k=`${r.tanggalNorm}|${r.jam}|${String(r.nama).toLowerCase().trim()}`;if(!m.has(k))m.set(k,r);});allData=Array.from(m.values());syncStatus='● Sinkron - '+allData.length+' data';}else syncStatus='Offline';}catch(e){syncStatus='Offline';}render();}
function login(){const p=document.getElementById('apass').value;if(p===ADMIN_PASS){localStorage.setItem('admin_login','true');isLogin=true;fetchData();}else document.getElementById('aerr').innerText='Password salah';}
function logout(){localStorage.removeItem('admin_login');isLogin=false;render();}
function filteredData(){let d=[...allData];const mm=new Map();d.forEach(r=>{const k=`${r.tanggalNorm}|${r.jam}|${String(r.nama).toLowerCase().trim()}`;if(!mm.has(k))mm.set(k,r);});d=Array.from(mm.values());if(filterBulan!=='all'){d=d.filter(x=>{const m=(x.tanggalNorm||normalizeTanggal(x.tanggal)).split('-')[1];return String(parseInt(m))===String(parseInt(filterBulan));});}if(filterTahun!=='all'){d=d.filter(x=>{const y=(x.tanggalNorm||normalizeTanggal(x.tanggal)).split('-')[0];return String(y)===filterTahun;});}return d;}
let filterBulan=String(new Date().getMonth()+1);let filterTahun='all';
function groupByKaryawan(data){const dedup=new Map();data.forEach(r=>{const k=`${r.tanggalNorm}|${r.jam}|${String(r.nama).toLowerCase().trim()}`;if(!dedup.has(k))dedup.set(k,r);});const clean=Array.from(dedup.values());const map={};clean.forEach(r=>{const key=normNama(r.nama);if(!map[key])map[key]={nama:r.nama,totalTUL:0,totalJam:0};map[key].totalTUL+=Number(r.tul);map[key].totalJam+=Number(r.jam);});return Object.values(map).sort((a,b)=>b.totalTUL-a.totalTUL);}
function groupByTanggal(data){const dedup=new Map();data.forEach(r=>{const k=`${r.tanggalNorm}|${r.jam}|${String(r.nama).toLowerCase().trim()}`;if(!dedup.has(k))dedup.set(k,r);});const clean=Array.from(dedup.values());const map={};clean.forEach(r=>{const tNorm=r.tanggalNorm||normalizeTanggal(r.tanggal);if(!map[tNorm])map[tNorm]={tanggal:tNorm,totalJam:0,totalTUL:0,rows:[]};map[tNorm].totalJam+=Number(r.jam);map[tNorm].totalTUL+=Number(r.tul);map[tNorm].rows.push(r);});return Object.values(map).sort((a,b)=>new Date(b.tanggal)-new Date(a.tanggal));}
function toggleSelectMassal(n){const k=normNama(n);if(selectedMassal[k])delete selectedMassal[k];else selectedMassal[k]=true;renderMassalList();}
function renderMassalList(){const c=document.getElementById('massalList');if(!c)return;c.innerHTML=karyawanList.map(k=>{const sel=!!selectedMassal[normNama(k.nama)];return `<button onclick="toggleSelectMassal('${k.nama}')" class="h-[64px] rounded-[18px] border-2 text-left px-5 flex items-center justify-between transition-all ${sel?'bg-zinc-900 border-zinc-900 text-white shadow-lg':'bg-white border-zinc-100'}"><div><div class="font-bold text-[14px]">${k.nama}</div><div class="text-[11px] opacity-60">${k.pass}</div></div><div class="w-7 h-7 rounded-full grid place-items-center text-[12px] ${sel?'bg-white text-zinc-900':'bg-zinc-100'}">${sel?'✓':''}</div></button>`;}).join('');const cnt=document.getElementById('massalCount');if(cnt)cnt.innerText=Object.keys(selectedMassal).length+' dipilih';}
function selectAllMassal(){if(Object.keys(selectedMassal).length===karyawanList.length)selectedMassal={};else karyawanList.forEach(k=>selectedMassal[normNama(k.nama)]=true);renderMassalList();}
async function handleInputMassal(){const tgl=document.getElementById('massalTgl').value;const jam=Number(document.getElementById('massalJam').value);const names=Object.keys(selectedMassal);if(!tgl){showToast('Pilih tanggal');return;}if(names.length===0){showToast('Pilih karyawan');return;}syncStatus='Menyimpan...';render();for(let key of names){const k=karyawanList.find(x=>normNama(x.nama)===key);if(!k)continue;try{await fetch(SYNC_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({tanggal:tgl,nama:k.nama,jam:jam,nik:k.nama})});}catch(e){}}showToast('Berhasil simpan '+names.length+' data');selectedMassal={};setTimeout(fetchData,1500);}
async function hapusTransaksi(tgl,nama,jam){if(!confirm('Hapus '+nama+'?'))return;try{await fetch(SYNC_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'delete',tanggal:tgl,nama:nama,jam:jam})});showToast('Dihapus');setTimeout(fetchData,800);}catch(e){}}
async function hapusTanggal(tgl){if(!confirm('Hapus tanggal '+tgl+'?'))return;try{await fetch(SYNC_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'deleteTanggal',tanggal:tgl})});showToast('Hapus hari');setTimeout(fetchData,800);}catch(e){}}
function render(){
const app=document.getElementById('app');
if(!isLogin){
