<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif;background:linear-gradient(135deg,#ecfeff 0%,#cffafe 50%,#a5f3fc 100%);min-height:100vh} .aqua{background:linear-gradient(135deg,#0891b2 0%,#0e7490 100%)}</style>
<style>
.led-ring{
  background: conic-gradient(from 0deg, transparent 0deg, #ffffff 20deg, transparent 40deg, transparent 180deg, #ccfbf1 200deg, transparent 220deg);
  animation: spin 2s linear infinite;
  mask: radial-gradient(circle, transparent 36px, black 37px, black 42px, transparent 43px);
}
@keyframes spin{ to{ transform: rotate(360deg); } }
.led-dot{
  position:absolute; width:5px; height:5px; border-radius:50%; background:#ffffff; box-shadow:0 0 6px #ffffff;
  top:50%; left:50%;

.led-dot.active{ background:#fff; box-shadow:0 0 10px #fff, 0 0 14px #ccfbf1; transform: scale(1.4); }

</head><body><div id="app"></div><script>

const SYNC_URL='https://script.google.com/macros/s/AKfycbwr3utIlkimCQcJln2Gug7D0XOypnazzboyFiv5oZFFOf_Hk_XGyhKm9G2sx0Su1LU/exec';
const LOGO_URI='';
const ADMIN_PASS='admin123';
const TUL_MAP={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};
function calcTUL(j){
  j=Number(j);
  if(isNaN(j) || j<=0 || j>24 || Math.abs(j)>100) return 0; // filter rusak
  return TUL_MAP[j]||j*1.5;
}

function parseTglSort(tglStr){
  // tgl format dd-MM-yyyy or dd/MM/yyyy
  if(!tglStr) return 0;
  let parts = String(tglStr).split(/[-/]/);
  if(parts.length!==3) return 0;
  let d = Number(parts[0]), m = Number(parts[1]), y = Number(parts[2]);
  if(isNaN(d)||isNaN(m)||isNaN(y)) return 0;
  return new Date(y, m-1, d).getTime();
}

function isJamValid(j){
  j=Number(j);
  return !isNaN(j) && j>0 && j<=24 && Math.abs(j)<=100;
}
function normNama(n){return String(n||'').trim().toLowerCase();}
function normalizeTanggal(t){if(!t)return'';let s=String(t).trim();if(s.includes('T'))s=s.split('T')[0];try{const d=new Date(t);if(!isNaN(d))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}catch{}return s;}
function formatTanggal(t){const p=normalizeTanggal(t).split('-');if(p.length===3)return p[2]+'-'+p[1]+'-'+p[0];return t;}
const DEFAULT_KARYAWAN=[{nama:'Nia'},{nama:'Aditya'},{nama:'Anisa'},{nama:'Aaf'},{nama:'Syarif'},{nama:'Budi'},{nama:'Topik'},{nama:'Yudi'},{nama:'Dozen'},{nama:'Putri'},{nama:'Arief'},{nama:'Anah'},{nama:'Supriyadi'},{nama:'Eka'},{nama:'Nely'},{nama:'Zaelani'}];
let allData=[]; let isLogin=!!localStorage.getItem('admin_login'); let syncStatus='● Sinkron'; let activeTab='rekap'; let filterBulan=String(new Date().getMonth()+1);

function toast(m){const t=document.createElement('div');t.className='fixed bottom-4 left-1/2 -translate-x-1/2 bg-[#0891b2] text-white px-5 py-3 rounded-full text-[15px] font-bold z-50';t.innerText=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500);}
function jsonp(url){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+Math.floor(Math.random()*1000); window[cb]=(d)=>{delete window[cb]; document.getElementById(cb)?.remove(); if(Array.isArray(d)){try{localStorage.setItem('cache_lembur',JSON.stringify(d)); localStorage.setItem('cache_lembur_time',Date.now());}catch{} resolve(d);} else resolve(d);}; const s=document.createElement('script'); s.id=cb; s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&_='+Date.now()+Math.random(); s.onerror=()=>{delete window[cb]; s.remove(); try{const c=localStorage.getItem('cache_lembur'); if(c){resolve(JSON.parse(c)); return;}}catch{} reject(new Error('Offline'));}; document.body.appendChild(s); setTimeout(()=>{if(window[cb]){delete window[cb]; s.remove(); try{const c=localStorage.getItem('cache_lembur'); if(c){const j=JSON.parse(c); resolve(j); return;}}catch{} reject(new Error('Timeout'));}},15000);});}
async function fetchData(force=false){
  if(force){
    try{ localStorage.removeItem('cache_lembur'); }catch{}
    allData=[];
  }
  // Jika bukan force, tampilkan cache dulu biar cepat
  if(!force){
    try{const c=localStorage.getItem('cache_lembur'); if(c && allData.length===0){const j=JSON.parse(c); allData=j.map(r=>({tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal),nama:r.nama||r.nik,jam:Number(r.jam||0),tul:calcTUL(Number(r.jam||0))})); syncStatus='● Cache - '+allData.length+' (klik ↻ untuk paksa sinkron)'; render();}}catch{}
  }
  // Kalau ada cache, jangan tampilkan Memuat yang bikin blank
  let hasCache = false;
  try{ hasCache = !!localStorage.getItem('cache_lembur'); }catch{}
  if(!hasCache || allData.length===0){ syncStatus='⏳ Memuat...'; render(); }
  try{
    const j=await jsonp(SYNC_URL+'?action=read&_nocache='+Date.now()+Math.random());
    if(Array.isArray(j)){
      let raw=j.map(r=>{let jam=Number(r.jam||0); if(!isJamValid(jam)){console.warn('Data rusak skip:',r); jam=0;} return {tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal),nama:r.nama||r.nik,jam:jam,tul:calcTUL(jam)};}).filter(x=>x.nama && x.jam>0);
      allData=raw;
      syncStatus='● Sinkron - '+allData.length+' | '+new Date().toLocaleTimeString();
      try{ localStorage.setItem('cache_lembur', JSON.stringify(allData)); }catch{}
    } else syncStatus='Offline';
  }catch(e){
    syncStatus='● Offline - pakai cache';
    console.error(e);
    // jika gagal fetch, coba pakai cache
    try{
      const c=localStorage.getItem('cache_lembur');
      if(c){ const j=JSON.parse(c); allData=j.map(r=>({tanggal:r.tanggal,tanggalNorm:normalizeTanggal(r.tanggal),nama:r.nama||r.nik,jam:Number(r.jam||0),tul:calcTUL(Number(r.jam||0))})); }
    }catch{}
  }
  allData.sort((a,b)=> parseTglSort(a.tanggalNorm||a.tanggal) - parseTglSort(b.tanggalNorm||b.tanggal));
  render();
}
function forceSync(){
  toast('🔄 Paksa sinkron...');
  fetchData(true);
}

function login(){const p=document.getElementById('apass').value; if(p===ADMIN_PASS){localStorage.setItem('admin_login','1'); isLogin=true; fetchData();} else document.getElementById('aerr').innerText='Password salah';}
function logout(){localStorage.removeItem('admin_login'); isLogin=false; render();}
function filteredData(){
  const map=new Map();
  allData.forEach(r=>{const key=r.tanggalNorm+'|'+normNama(r.nama)+'|'+r.jam; if(!map.has(key)) map.set(key,r);});
  let d=Array.from(map.values());
  if(filterBulan!=='all'){ d=d.filter(r=> Number(r.tanggalNorm.split('-')[1])===Number(filterBulan)); }
  return d;
}
function groupByKaryawan(data){const m={}; data.forEach(r=>{const k=normNama(r.nama); if(!m[k]) m[k]={nama:r.nama,totalTUL:0,count:0}; m[k].totalTUL+=Number(r.tul); m[k].count+=1;}); return Object.values(m).sort((a,b)=>b.totalTUL-a.totalTUL);}
function groupByTanggal(data){const m={}; data.forEach(r=>{if(!m[r.tanggalNorm]) m[r.tanggalNorm]={tanggal:r.tanggalNorm,rows:[]}; m[r.tanggalNorm].rows.push(r);}); return Object.values(m).sort((a,b)=>new Date(b.tanggal)-new Date(a.tanggal));}
function waAll(){
  const data=filteredData(); const grouped=groupByKaryawan(data);
  const bulanNames={1:'Januari',2:'Februari',3:'Maret',4:'April',5:'Mei',6:'Juni',7:'Juli',8:'Agustus',9:'September',10:'Oktober',11:'November',12:'Desember'};
  const bln=filterBulan==='all'?'Semua Bulan':bulanNames[Number(filterBulan)];
  let txt='*REKAP LEMBUR AREA EF - '+bln.toUpperCase()+'*\n\n';
  grouped.forEach((g,i)=>{txt+=(i+1)+'. '+g.nama+' - '+g.totalTUL+' TUL ('+g.count+' hari)\n';});
  txt+='\nTotal: '+grouped.reduce((s,g)=>s+g.totalTUL,0)+' TUL';
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
}
function updateJam(){
  const el=document.getElementById('jamDigital'); const elTgl=document.getElementById('tglDigital'); const elTh=document.getElementById('tglTahun'); const elHari=document.getElementById('hariDigital');
  const elJam=document.getElementById('jarumJam'); const elMenit=document.getElementById('jarumMenit');
  if(!el) return;
  const now=new Date();
  const jam=String(now.getHours()).padStart(2,'0'); const menit=String(now.getMinutes()).padStart(2,'0'); const detik=String(now.getSeconds()).padStart(2,'0');
  const bulanNames=['JAN','FEB','MAR','APR','MEI','JUN','JUL','AGU','SEP','OKT','NOV','DES'];
  const hariNames=['MINGGU','SENIN','SELASA','RABU','KAMIS','JUMAT','SABTU'];
  const tgl = String(now.getDate()).padStart(2,'0')+' '+bulanNames[now.getMonth()];
  const th = String(now.getFullYear());
  const hari = hariNames[now.getDay()];
  el.innerText=jam+':'+menit+':'+detik;
  if(elTgl) elTgl.innerText=tgl;
  if(elTh) elTh.innerText=th;
  if(elHari) elHari.innerText=hari;
  if(elJam){ const hDeg = (now.getHours()%12)*30 + now.getMinutes()*0.5; elJam.style.transform='translateX(-50%) rotate('+hDeg+'deg)'; }
  if(elMenit){ const mDeg = now.getMinutes()*6 + now.getSeconds()*0.1; elMenit.style.transform='translateX(-50%) rotate('+mDeg+'deg)'; }
  const sec = now.getSeconds();
  const dots = document.querySelectorAll('.led-dot');
  dots.forEach((d,i)=>{
    const isActive = i===sec || i=== (sec+1)%60 || i=== (sec+2)%60;
    d.classList.toggle('active', isActive);
    d.classList.toggle('off', !isActive);
  });
}
function initLedDots(){
  const c=document.getElementById('ledDots'); if(!c) return; c.innerHTML='';
  for(let i=0;i<60;i++){
    const dot=document.createElement('div');
    dot.className='led-dot';
    const angle = (i*6 -90) * Math.PI/180;
    const r=40;
    const x = Math.cos(angle)*r;
    const y = Math.sin(angle)*r;
    dot.style.transform = `translate(-50%,-50%) translate(${x}px, ${y}px)`;
    c.appendChild(dot);
  }
}
setTimeout(initLedDots, 300);

setInterval(updateJam,1000);

function render(){
  // Pastikan data sudah urut tanggal untuk rekap
  allData.sort((a,b)=> parseTglSort(a.tanggalNorm||a.tanggal) - parseTglSort(b.tanggalNorm||b.tanggal));

  const app=document.getElementById('app');
  if(!isLogin){app.innerHTML=`<div class="min-h-screen grid place-items-center p-4 bg-gradient-to-br from-[#0891b2] to-[#a5f3fc]"><div class="w-full max-w-[340px] rounded-[20px] bg-white shadow-xl p-6 text-center border border-[#a5f3fc]"><img src="${LOGO_URI}" class="w-14 h-14 mx-auto rounded-[12px] object-contain mb-3"><div class="font-black text-[16px] text-[#0e7490]">AREA EF</div><div class="text-[10px] font-bold text-[#0891b2] mt-1 mb-4">${syncStatus}</div><input id="apass" type="password" placeholder="Password" class="w-full h-10 rounded-[10px] border-2 border-slate-100 bg-slate-50 px-3 text-[13px] outline-none focus:border-[#0891b2]"><div id="aerr" class="text-[10px] text-red-600 mt-2"></div><button onclick="login()" class="w-full h-10 rounded-[10px] aqua text-white font-bold mt-3 text-[13px]">Masuk</button></div></div>`; return;}
  const data=filteredData(); const grouped=groupByKaryawan(data); const harian=groupByTanggal(data);
  const hbHtml = bannerHariBesarHtml();
  
  app.innerHTML=`
  <div class="max-w-[480px] mx-auto min-h-screen bg-gradient-to-br from-[#ecfeff] via-[#cffafe] to-[#a5f3fc] relative">
    
    
    <div class="relative z-10 pb-3">
    <!-- HEADER COMPACT - Hemat layar -->
    <div class="sticky top-0 z-20 bg-[#0891b2] rounded-b-[22px] shadow-[0_4px_16px_rgba(0,0,0,0.35)] border-b-2 border-[#a5f3fc] overflow-hidden">
      <div class="px-3 h-[56px] flex justify-between items-center gap-2">
        <div class="font-black text-[20px] text-white tracking-wide shrink-0">AREA EF</div>
        <div class="flex-1 flex justify-center">
          <div class="h-8 px-3 rounded-full bg-black/20 backdrop-blur border border-white/10 text-white flex items-center gap-2">
            <div id="jamDigital" class="text-[12px] font-black font-mono tracking-wider">00:00:00</div>
            <div class="w-px h-3 bg-white/30"></div>
            <div id="tglDigital" class="text-[10px] font-bold">14 SEP</div>
            <div id="tglTahun" class="hidden"></div>
            <div id="hariDigital" class="hidden"></div>
            <div id="ledDots" class="hidden"></div>
          </div>
        </div>
        <button onclick="logout()" class="h-7 px-3.5 rounded-full bg-black text-white text-[11px] font-black flex items-center gap-1 shadow">LOGOUT</button>
      </div>
    </div>
    <!-- BAR 2: INPUT WA | NAV Input/History/Rekap | SHARE WA - Sejajar -->
    <div class="px-2 pt-2.5 flex justify-between items-center gap-1.5">
      <button onclick="openPesan()" class="h-9 px-3 rounded-full bg-white border border-[#a5f3fc] text-[#0891b2] text-[11px] font-black flex items-center gap-1 shadow-sm shrink-0"><span class="w-4 h-4 rounded-full bg-[#25D366] grid place-items-center text-white text-[9px]">✆</span> INPUT</button>
      <div class="flex-1 bg-white/90 backdrop-blur border border-[#a5f3fc] rounded-full p-1 flex gap-1 shadow-sm">
        <button onclick="activeTab='input';render();window.scrollTo(0,0)" class="flex-1 h-7 rounded-full text-[10px] font-black transition ${activeTab==='input'?'bg-[#0891b2] text-black shadow':'text-[#71717a]'}">Input</button>
        <button onclick="activeTab='history';render();window.scrollTo(0,0)" class="flex-1 h-7 rounded-full text-[10px] font-black transition ${activeTab==='history'?'bg-[#0891b2] text-black shadow':'text-[#71717a]'}">History</button>
        <button onclick="activeTab='rekap';render();window.scrollTo(0,0)" class="flex-1 h-7 rounded-full text-[10px] font-black transition ${activeTab==='rekap'?'bg-[#0891b2] text-black shadow':'text-[#71717a]'}">Rekap</button>
      </div>
      <button onclick="waAll()" class="h-9 px-3 rounded-full bg-[#22c55e] text-white text-[11px] font-black flex items-center gap-1 shadow-sm shrink-0"><span class="w-4 h-4 rounded-full bg-white grid place-items-center text-[#22c55e] text-[9px]">✆</span> SHARE</button>
    </div>
    ${hbHtml}
<div class="p-3">


      
      ${activeTab==='input'?`<div class="space-y-2">
        <div class="bg-white/80 backdrop-blur-xl border border-white/60 rounded-[16px] p-2.5 shadow-[0_4px_12px_rgba(39,39,42,0.08)]">
          <div class="flex gap-1.5 items-end">
            <div class="flex-1">
              <div class="text-[9px] font-bold text-[#0891b2] mb-0.5 ml-1">TGL</div>
              <input id="massalTgl" type="date" value="${new Date().toISOString().slice(0,10)}" class="w-full h-[36px] rounded-[10px] border border-[#a5f3fc] bg-white px-2 text-[12px] font-bold text-[#0e7490] focus:border-[#0891b2] outline-none">
            </div>
            <div class="w-[75px]">
              <div class="text-[9px] font-bold text-[#0891b2] mb-0.5 ml-1">JAM</div>
              <select id="massalJam" class="w-full h-[36px] rounded-[10px] border border-[#a5f3fc] bg-white px-2 text-[12px] font-bold focus:border-[#0891b2] outline-none"><option value="2">2j</option><option value="3" selected>3j</option><option value="4">4j</option><option value="6">6j</option><option value="7">7j</option><option value="8">8j</option></select>
            </div>
            <button onclick="selectAllMassal()" class="h-[36px] px-3 rounded-[10px] bg-[#0891b2] border border-[#a5f3fc] text-[#0891b2] text-[10px] font-black">Pilih</button>
            <button onclick="handleInputMassal()" class="h-[36px] px-4 rounded-[10px] bg-[#0891b2] text-black text-[11px] font-black shadow-sm">Simpan</button>
          </div>
          <div id="massalList" class="grid grid-cols-2 gap-1.5 mt-2.5 max-h-[60vh] overflow-auto pr-0.5"></div>
        </div>
      </div>`:''}
      ${activeTab==='history'?`<div class="space-y-3">
        ${harian.length===0?`<div class="bg-white/80 backdrop-blur-xl border border-white/60 rounded-[20px] p-8 text-center shadow-[0_8px_24px_rgba(39,39,42,0.12)]"><div class="text-[32px] mb-2"></div><div class="font-bold text-[#0e7490] text-[14px]">Belum ada data</div><div class="text-[11px] text-[#71717a] mt-1">Data lembur harian akan muncul di sini</div></div>`:
        harian.map(h=>`<div class="bg-white/80 backdrop-blur-xl border border-white/60 rounded-[20px] overflow-hidden shadow-[0_8px_24px_rgba(39,39,42,0.08)]">
          <div class="px-4 py-3 bg-gradient-to-r from-[#0891b2] to-[#0e7490] text-white flex justify-between items-center">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-full bg-white/20 grid place-items-center text-[14px]"></div>
              <div>
                <div class="font-black text-[13px]">${formatTanggal(h.tanggal)}</div>
                <div class="text-[10px] opacity-80">${h.rows.length} orang • ${h.rows.reduce((s,r)=>s+r.tul,0)} TUL</div>
              </div>
            </div>
            <button onclick="hapusTanggal('${h.tanggal}')" class="h-7 px-3 rounded-full bg-white/20 backdrop-blur text-white text-[10px] font-bold border border-white/20 hover:bg-white/30 transition">Hapus</button>
          </div>
          <div class="divide-y divide-[#f0fdfa]/80">
            ${h.rows.map(r=>`<div class="px-4 py-3 flex justify-between items-center hover:bg-[#0891b2]/50 transition">

                <div class="w-9 h-9 rounded-full bg-gradient-to-br from-[#ccfbf1] to-[#f0fdfa] border border-[#a5f3fc] grid place-items-center font-black text-[12px] text-[#0891b2]">${r.nama.charAt(0)}</div>
                <div>
                  <div class="font-bold text-[13px] text-[#0f172a]">${r.nama}</div>
                  <div class="text-[10px] font-bold text-[#0891b2] bg-[#0891b2] px-2 py-0.5 rounded-full inline-block mt-0.5">${r.jam}j = ${r.tul} TUL</div>
                </div>
              </div>
              <button onclick="hapusTransaksi('${r.tanggal}','${r.nama}',${r.jam})" class="w-7 h-7 rounded-full bg-red-50 text-red-500 border border-red-100 grid place-items-center text-[12px] hover:bg-red-100 transition">✕</button>
            </div>`).join('')}

        </div>`).join('')}
      </div>`:''}
      ${activeTab==='rekap'?`<div class="space-y-3">

        <div class="bg-white/80 backdrop-blur-xl border border-white/60 rounded-[20px] overflow-hidden shadow-[0_8px_24px_rgba(39,39,42,0.12)] divide-y divide-[#f0fdfa]">

            else { icon='<div class="w-10 h-10 rounded-full bg-[#0891b2] border border-[#a5f3fc] grid place-items-center font-black text-[13px] text-[#0891b2]">'+(i+1)+'</div>'; }
            return `<div class="px-4 py-3.5 flex justify-between items-center hover:bg-[#0891b2]/50 transition ${rankStyle}">

let parsedPesan=[];
const bulanMap={januari:'01',februari:'02',maret:'03',april:'04',mei:'05',juni:'06',juli:'07',agustus:'08',september:'09',oktober:'10',november:'11',desember:'12'};

function parseTglPlan(text){
  // Support: 15 September 2026, 15September 2026, Selasa, 15September 2026, 15 September2026
  let m = text.match(/(\d{1,2})\s*,?\s*(januari|februari|maret|april|mei|juni|juli|agustus|september|oktober|november|desember)\s*(\d{4})/i);
  if(!m) return '';
  let d=m[1].padStart(2,'0'), bln=bulanMap[m[2].toLowerCase()], y=m[3];
  return `${d}-${bln}-${y}`;
}
function isValidName(w){
  const ignore=['wip','ts','mold','turun','repair','avi','assy','mask','cch','insulator','repacking','stand','by','s1','s2','s3','mp','1mp','2mp','3mp','e05','e09','f01','f05','f06','f11','f12','f13','f14','f15','f17','f18','f19','f20','f21'];
  if(!w) return false;
  if(ignore.includes(w.toLowerCase())) return false;
  if(w.length<2) return false;
  if(/\d/.test(w)) return false;
  if(w.includes('*')) return false;
  return true;
}
function parsePlan(){
  const txt = document.getElementById('txtPesan').value.trim();
  if(!txt){ alert('Paste Plan dulu'); return; }
  parsedPesan=[];
  let tglPlan = parseTglPlan(txt) || '';
  if(!tglPlan){
    let today = new Date();
    tglPlan = `${String(today.getDate()).padStart(2,'0')}-${String(today.getMonth()+1).padStart(2,'0')}-${today.getFullYear()}`;
  }
  let autoJam = null;
  let timeMatch = txt.match(/(\d{1,2})[.:](\d{2})\s*-\s*(\d{1,2})[.:](\d{2})/);
  if(timeMatch){
    let sh = parseInt(timeMatch[1]);
    let eh = parseInt(timeMatch[3]);
    let diffJam = eh - sh;
    if(diffJam < 0) diffJam += 24;
    if((sh===6 && eh===15) || (sh===15 && eh===23) || (sh===23 && eh===6)){
      diffJam = diffJam - 1;
    }
    if(diffJam < 1) diffJam = 1;
    if(diffJam > 8) diffJam = 8;
    autoJam = diffJam;
  }
  const aliasMap = {
    'neli': 'Nely',
    'nely': 'Nely',
    'annisa': 'Anisa',
    'annissa': 'Anisa',
    'anisa': 'Anisa'
  };
  const daftarValid = new Set(DEFAULT_KARYAWAN.map(k=>k.nama.toLowerCase()));
  const seen = new Set();
  const lines = txt.split('\n');
  for(let raw of lines){
    let line = raw.trim(); if(!line) continue;
    if(line.toLowerCase().startsWith('plan')) continue;
    if(/^E\d+\s+wip/i.test(line) && !/mp/i.test(line)) continue;
    if(/mold turun repair/i.test(line)) continue;
    if(/^OT AKHIR/i.test(line) || /^OT AWAL/i.test(line)) continue;
    if(/^malam/i.test(line)) continue;
    if(line.match(/^\d{1,2}[.:]\d{2}\s*-\s*\d{1,2}[.:]\d{2}/)) continue;
    if(/^(senin|selasa|rabu|kamis|jumat|sabtu|minggu),/i.test(line)) continue;
    let after = '';
    let jamVal = autoJam !== null ? autoJam : 3;
    let mpMatch = line.match(/(\d+)\s*mp/i);
    let minusMatch = line.match(/-\s*(\d+)\s*(.*)$/);
    if(mpMatch){
      if(autoJam === null) jamVal = parseInt(mpMatch[1])||3;
      after = line.split(/\d+\s*mp/i)[1] || '';
    }else if(minusMatch){
      if(autoJam === null) jamVal = parseInt(minusMatch[1])||3;
      after = minusMatch[2] || '';
      if(!after.trim()) continue;
    }else{
      continue;
    }
    after = after.replace(/ts/gi,'').trim();
    if(!after) continue;
    after = after.replace(/^[A-Z0-9+]+\s*-\s*\d+\s*/i,'').trim();
    let names = after.split(',').map(s=>s.trim()).filter(Boolean);
    let validNames = [];
    for(let n of names){
      let sub = n.split(/\s+/);
      for(let s of sub){
        s=s.trim().replace(/[^A-Za-z]/g,'');
        if(!s) continue;
        let low = s.toLowerCase();
        if(aliasMap[low]) s = aliasMap[low];
        if(isValidName(s)){
          s = s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
          let canonical = DEFAULT_KARYAWAN.find(k=>k.nama.toLowerCase()=== (aliasMap[low] ? aliasMap[low].toLowerCase() : low));
          if(canonical) s = canonical.nama;
          else {
            let can2 = DEFAULT_KARYAWAN.find(k=>k.nama.toLowerCase()===s.toLowerCase());
            if(can2) s = can2.nama;
          }
          validNames.push(s);
        }
      }
    }
    validNames = [...new Set(validNames)];
    for(let nama of validNames){
      let cekNama = nama.toLowerCase();
      if(aliasMap[cekNama]) cekNama = aliasMap[cekNama].toLowerCase();
      const key = tglPlan+'|'+cekNama;
      if(seen.has(key)) continue;
      if(!daftarValid.has(cekNama)) continue;
      seen.add(key);
      let finalNama = DEFAULT_KARYAWAN.find(k=>k.nama.toLowerCase()===cekNama)?.nama || nama;
      parsedPesan.push({tanggal: tglPlan, tanggalNorm: tglPlan, nama: finalNama, jam: jamVal, tul: calcTUL(jamVal)});
    }
  }
  const prev = document.getElementById('previewPesan');
  prev.classList.remove('hidden');
  if(parsedPesan.length===0){
    prev.innerHTML='<span class=text-red-600>❌ Tidak ada nama valid.</span>';
    return;
  }
  let sudahAda = [];
  for(let p of parsedPesan){
    let exists = allData.some(a=> normalizeTanggal(a.tanggalNorm||a.tanggal)===p.tanggal && normNama(a.nama)===normNama(p.nama));
    if(exists) sudahAda.push(p.nama);
  }
  let infoDuplikat = sudahAda.length>0 ? `<br><span class=text-amber-600>⚠️ Sudah ada di tgl ${parsedPesan[0].tanggal}: ${sudahAda.join(', ')} akan skip</span>` : '';
  let rawTglMatch = txt.match(/(\d{1,2})\s*,?\s*(januari|februari|maret|april|mei|juni|juli|agustus|september|oktober|november|desember)\s*(\d{4})/i);
  let rawTglText = rawTglMatch ? rawTglMatch[0] : 'tidak terdeteksi (pakai hari ini)';
  let jamInfo = autoJam!==null ? `Jam OT: ${autoJam} jam (otomatis dari ${timeMatch[0]} → ${timeMatch[1]}-${timeMatch[3]} = ${autoJam}j)` : 'Jam dari Mp/-';
  prev.innerHTML = `<b>✅ Tanggal Input: ${rawTglText} → Parsed: ${tglPlan} | ${jamInfo} | Valid ${parsedPesan.length} orang:</b><br>` + parsedPesan.map(p=>`• ${p.nama} - ${p.jam}j = ${p.tul} TUL`).join('<br>') + infoDuplikat;
}
async function simpanPesan(){
  if(parsedPesan.length===0){ parsePlan(); if(parsedPesan.length===0) return; }
  // Filter lagi duplikat yang sudah ada di allData
  let toSave = parsedPesan.filter(p=>{
    let exists = allData.some(a=> normalizeTanggal(a.tanggalNorm||a.tanggal)===p.tanggal && normNama(a.nama)===normNama(p.nama));
    return !exists;
  });
  let skipCount = parsedPesan.length - toSave.length;
  if(toSave.length===0){ alert('❌ Semua nama sudah ada di tanggal '+parsedPesan[0].tanggal+', tidak ada yang disimpan (duplikat dibuang)'); return; }
  if(!confirm(`Simpan ${toSave.length} orang lembur tanggal ${toSave[0].tanggal}?` + (skipCount>0? ` (${skipCount} duplikat dibuang)`:''))) return;
  const items = toSave.map(p=>({tanggal:p.tanggal.split('-').reverse().join('-'), nama:p.nama, jam:p.jam}));
  // Simpan lokal dulu
  for(let p of toSave){ allData.push(p); }
  allData.sort((a,b)=> parseTglSort(a.tanggalNorm||a.tanggal) - parseTglSort(b.tanggalNorm||b.tanggal));
  try{ localStorage.setItem('cache_lembur', JSON.stringify(allData)); }catch{}
  document.getElementById('modalPesan').classList.add('hidden');
  render();
  syncStatus='● Menyimpan '+toSave.length+' org...'; render();
  try{
    const res = await fetch(SYNC_URL,{method:'POST', body: JSON.stringify({action:'addBulk', items: items})});
    const txt = await res.text();
    console.log('save result', txt);
    toast('✅ '+toSave.length+' tersimpan'+(skipCount>0? ' ('+skipCount+' duplikat dibuang)':''));
    localStorage.removeItem('cache_lembur');
    await fetchData();
  }catch(e){
    console.error(e);
    toast('⚠️ Tersimpan lokal, sinkron gagal - coba Refresh');
  }
  syncStatus='● Sinkron - '+allData.length; render();
}

function closePesan(){ document.getElementById('modalPesan').classList.add('hidden'); }

function tglKeyLocal(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function hariBesarHariIni(){
  const now=new Date(); now.setHours(0,0,0,0);
  const hasil=[];
  HARI_BESAR_TETAP.forEach(h=>{
    const p=h.tgl.split('-');
    for(const y of [now.getFullYear()-1,now.getFullYear(),now.getFullYear()+1]){
      const d=new Date(y,+p[1]-1,+p[0]); d.setHours(0,0,0,0);
      const diff=Math.round((now-d)/86400000);
      if(diff>=-2&&diff<=2){ hasil.push({h:h,diff:diff}); break; }
    }
  });
  HARI_RAYA_VAR.forEach(h=>{
    const P=s=>{const a=s.split('-');const d=new Date(+a[2],+a[1]-1,+a[0]);d.setHours(0,0,0,0);return d;};
    const dari=P(h.dari), sampai=P(h.sampai);
    const dariX=new Date(dari); dariX.setDate(dariX.getDate()-2);
    const sampaiX=new Date(sampai); sampaiX.setDate(sampaiX.getDate()+2);
    if(now>=dariX&&now<=sampaiX){
      let diff=0;
      if(now<dari) diff=Math.round((now-dari)/86400000);
      else if(now>sampai) diff=Math.round((now-sampai)/86400000);
      hasil.push({h:h,diff:diff});
    }
  });
  return hasil;
}
function judulHb(it){
  const h=it.h,d=it.diff;
  if(d===0) return h.ucapan;
  if(d<0) return '\u23F3 H'+d+' menuju '+h.nama+'!';
  return '\u{1F38A} '+h.nama+' \u2014 semoga berkah selalu!';
}
