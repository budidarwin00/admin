<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kas RT 01 / 2026 - Clean</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f8fafc;color:#0f172a}
.header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,0.9);backdrop-filter:blur(16px);border-bottom:1px solid #e2e8f0;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:700;font-size:17px;display:flex;gap:10px;align-items:center}
.live{font-size:11px;background:#ecfdf5;color:#059669;padding:4px 10px;border-radius:20px;display:flex;gap:6px;align-items:center;font-weight:600}
.dot{width:6px;height:6px;background:#10b981;border-radius:50%;animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.4}}
.btn{border:none;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn-dark{background:#0f172a;color:#fff}
.container{max-width:1000px;margin:0 auto;padding:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
@media(max-width:700px){.grid3{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:18px}
.label{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;font-weight:500;margin-bottom:6px}
.value{font-size:26px;font-weight:700;letter-spacing:-.8px}
.tabs{display:flex;gap:6px;background:#f1f5f9;padding:5px;border-radius:14px;width:fit-content;margin-bottom:18px}
.tab{padding:8px 16px;border-radius:10px;border:none;background:transparent;color:#64748b;font-size:13px;font-weight:500;cursor:pointer}
.tab.active{background:#fff;color:#0f172a;box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.item{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #f1f5f9}
.avatar{width:36px;height:36px;background:#f1f5f9;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
.bank{background:#0f172a;color:#fff;border-radius:22px;padding:20px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:22px;padding:20px;width:100%;max-width:380px}
.input{width:100%;padding:11px 12px;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:10px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;font-weight:600;display:none;z-index:99}
</style>
</head>
<body>
<div class="header">
<div class="logo"><div style="width:30px;height:30px;background:#0f172a;color:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center">K</div><span id="hText">Kas RT 01 / 2026</span><span class="live"><span class="dot"></span>LIVE</span></div>
<button class="btn btn-dark" onclick="openAdmin()">🔒 Admin</button>
</div>
<div class="container">
<div class="grid3">
<div class="card"><div class="label">Total Kas</div><div class="value" id="vTotal">Rp 0</div><div style="font-size:12px;color:#64748b" id="vInfo">0 transaksi</div></div>
<div class="card"><div class="label">Pemasukan</div><div class="value" style="color:#059669" id="vIn">Rp 0</div></div>
<div class="card"><div class="label">Pengeluaran</div><div class="value" style="color:#dc2626" id="vOut">Rp 0</div></div>
</div>
<div class="tabs"><button class="tab active" onclick="sw('dash',this)">Dashboard</button><button class="tab" onclick="sw('trans',this)">Transaksi</button><button class="tab" onclick="sw('anggota',this)">Anggota</button><button class="tab" onclick="sw('bank',this)">Bank</button></div>
<div id="tab-dash"><div class="card" style="margin-bottom:12px"><div style="font-weight:600;margin-bottom:10px">Transaksi Terbaru</div><div id="recent"></div></div></div>
<div id="tab-trans" style="display:none"><div class="card"><div style="display:flex;gap:8px;margin-bottom:12px"><input class="input" id="sTrans" placeholder="Cari..." oninput="render()" style="margin:0;flex:1"><button class="btn btn-dark" id="addBtn" onclick="openAdd()" style="display:none">+ Tambah</button></div><div id="listTrans"></div></div></div>
<div id="tab-anggota" style="display:none"><div id="gridAnggota" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px"></div></div>
<div id="tab-bank" style="display:none"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px"><div class="bank"><div style="font-size:11px;opacity:.6;margin-bottom:16px">BCA • Eka Iswanto</div><div style="font-size:20px;font-weight:700;margin-bottom:6px">6830747280</div><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;opacity:.7">a/n Eka Iswanto</span><button onclick="copyT('6830747280')" style="background:rgba(255,255,255,.15);color:#fff;border:none;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer">Salin</button></div></div><div class="bank" style="background:#111827"><div style="font-size:11px;opacity:.6;margin-bottom:16px">MANDIRI • Eka Iswanto</div><div style="font-size:20px;font-weight:700;margin-bottom:6px">1570005764080</div><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;opacity:.7">a/n Eka Iswanto</span><button onclick="copyT('1570005764080')" style="background:rgba(255,255,255,.15);color:#fff;border:none;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer">Salin</button></div></div></div></div>
</div>
<div class="modal-bg" id="mAdmin"><div class="modal"><div style="font-weight:700;margin-bottom:12px">Login Admin</div><input class="input" id="pIn" type="password" placeholder="Password: admin123"><div style="display:flex;gap:8px"><button class="btn" style="flex:1;background:#f1f5f9" onclick="closeM('mAdmin')">Batal</button><button class="btn btn-dark" style="flex:1" onclick="doLogin()">Masuk</button></div><div id="adminPanel" style="display:none;margin-top:16px;border-top:1px solid #e2e8f0;padding-top:12px"><input class="input" id="hIn" placeholder="Ubah Header Text"><input class="input" id="newP" placeholder="Password baru (opsional)"><button class="btn btn-dark" style="width:100%" onclick="saveSet()">Simpan</button><button class="btn" style="width:100%;background:#fef2f2;color:#dc2626;margin-top:8px" onclick="logout()">Logout</button></div></div></div>
<div class="modal-bg" id="mAdd"><div class="modal"><div style="font-weight:700;margin-bottom:12px">Tambah Transaksi</div><select class="input" id="fKat" onchange="autoN()"><option>Iuran Bulanan</option><option>Iuran Kas</option><option>Pemasukan Lain</option><option>Pengeluaran</option></select><select class="input" id="fAng"></select><input class="input" id="fNom" type="number" placeholder="Nominal"><input class="input" id="fKet" placeholder="Keterangan"><div style="display:flex;gap:8px"><button class="btn" style="flex:1;background:#f1f5f9" onclick="closeM('mAdd')">Batal</button><button class="btn btn-dark" style="flex:1" onclick="saveT()">Simpan</button></div></div></div>
<div id="toast"></div>
<script>
const MEMS=["Aaf","Aditya","Anah","Anisa","Arief","Budi","Dozen","Heru","Nia","Putri","Supriyadi","Syarif","Topik","Yudi","Zaelani"];
let isAdmin=localStorage.getItem('isAdmin')==='1';
let trs=JSON.parse(localStorage.getItem('kas_tr')||'[]');
if(trs.length===0){trs=[{id:'1',tanggal:new Date().toISOString().slice(0,10),anggota:'Aditya',kategori:'Iuran Bulanan',nominal:100000,keterangan:'Awal'}];localStorage.setItem('kas_tr',JSON.stringify(trs))}
function sv(){localStorage.setItem('kas_tr',JSON.stringify(trs));render()}
function rp(n){return 'Rp '+Number(n).toLocaleString('id-ID')}
function sw(id,el){document.querySelectorAll('[id^=tab-]').forEach(e=>e.style.display='none');document.getElementById('tab-'+id).style.display='block';document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active')}
function autoN(){if(document.getElementById('fKat').value==='Iuran Bulanan')document.getElementById('fNom').value=100000}
function render(){
let s=(document.getElementById('sTrans')?.value||'').toLowerCase();
let f=trs.filter(t=>(t.anggota+t.kategori+t.keterangan).toLowerCase().includes(s));
let inc=0,out=0;trs.forEach(t=>{if(t.kategori==='Pengeluaran')out+=+t.nominal;else inc+=+t.nominal});
document.getElementById('vTotal').innerText=rp(inc-out);document.getElementById('vIn').innerText=rp(inc);document.getElementById('vOut').innerText=rp(out);
document.getElementById('vInfo').innerText=trs.length+' transaksi';
document.getElementById('addBtn').style.display=isAdmin?'block':'none';
document.getElementById('recent').innerHTML=f.slice(-5).reverse().map(t=>`<div class="item"><div style="display:flex;gap:10px;align-items:center"><div class="avatar">${t.anggota[0]}</div><div><div style="font-weight:600;font-size:13px">${t.anggota}</div><div style="font-size:11px;color:#64748b">${t.kategori}</div></div></div><div style="font-weight:700;font-size:13px">${rp(t.nominal)}</div></div>`).join('')||'<div style="font-size:12px;color:#94a3b8">Belum ada</div>';
document.getElementById('listTrans').innerHTML=f.reverse().map(t=>`<div class="item"><div><div style="font-weight:600;font-size:14px">${t.anggota}</div><div style="font-size:11px;color:#64748b">${t.kategori} • ${t.keterangan} • ${t.tanggal}</div></div><div style="text-align:right"><div style="font-weight:700">${rp(t.nominal)}</div>${isAdmin?`<button onclick="delT('${t.id}')" style="font-size:11px;color:#dc2626;border:none;background:none;cursor:pointer">Hapus</button>`:''}</div></div>`).join('');
document.getElementById('gridAnggota').innerHTML=MEMS.map(m=>{let tot=trs.filter(t=>t.anggota===m&&t.kategori!=='Pengeluaran').reduce((a,b)=>a+ +b.nominal,0);return `<div style="display:flex;gap:10px;align-items:center;padding:12px;background:#fff;border:1px solid #e2e8f0;border-radius:14px"><div class="avatar">${m[0]}</div><div style="flex:1"><div style="font-weight:600;font-size:13px">${m}</div><div style="font-size:11px;color:#64748b">${rp(tot)}</div></div><div style="width:8px;height:8px;background:${tot>0?'#10b981':'#e2e8f0'};border-radius:50%"></div></div>`}).join('');
document.getElementById('fAng').innerHTML=MEMS.map(m=>`<option>${m}</option>`).join('');
document.getElementById('hText').innerText=localStorage.getItem('hText')||'Kas RT 01 / 2026';
}
function openAdd(){document.getElementById('mAdd').classList.add('show');autoN()}
function openAdmin(){document.getElementById('mAdmin').classList.add('show');document.getElementById('hIn').value=localStorage.getItem('hText')||'Kas RT 01 / 2026';if(isAdmin)document.getElementById('adminPanel').style.display='block'}
function closeM(id){document.getElementById(id).classList.remove('show')}
function doLogin(){let p=document.getElementById('pIn').value;let s=localStorage.getItem('aPass')||'admin123';if(p===s){isAdmin=true;localStorage.setItem('isAdmin','1');toast('Login berhasil');document.getElementById('adminPanel').style.display='block';render()}else toast('Password salah')}
function logout(){isAdmin=false;localStorage.removeItem('isAdmin');closeM('mAdmin');render();toast('Logout')}
function saveSet(){let h=document.getElementById('hIn').value;let np=document.getElementById('newP').value;if(h)localStorage.setItem('hText',h);if(np)localStorage.setItem('aPass',np);toast('Disimpan');logout()}
function saveT(){let t={id:Date.now()+'',tanggal:new Date().toISOString().slice(0,10),kategori:document.getElementById('fKat').value,anggota:document.getElementById('fAng').value,nominal:+document.getElementById('fNom').value,keterangan:document.getElementById('fKet').value};if(!t.nominal)return toast('Isi nominal');trs.push(t);sv();closeM('mAdd');toast('Disimpan')}
function delT(id){if(confirm('Hapus?')){trs=trs.filter(t=>t.id!==id);sv();toast('Dihapus')}}
function copyT(txt){navigator.clipboard.writeText(txt);toast('Disalin: '+txt)}
function toast(m){let e=document.getElementById('toast');e.innerText=m;e.style.display='block';setTimeout(()=>e.style.display='none',2000)}
render();
</script>
</body>
</html>
