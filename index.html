function autoSync(item, action){
  try{
    fetch(WEBAPP_URL, {
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({
        id:item.id, tgl:item.tgl, bulan:item.bulan, tahun:item.tahun,
        jam_input:item.jam||item.jam_input, jam_real: (typeof jamMap!=='undefined'? (jamMap[item.jam||item.jam_input]||0) : 0),
        orang:item.orang||[], action:action, nama:item.nama||''
      })
    });
  }catch(e){ console.log('Sync error', e); }
}

function loadFromSheet(){
  // Data DEFAULT_DATA (373) sudah tampil langsung, sekarang coba sync terbaru dari Sheet
  fetch(WEBAPP_URL + '?action=load')

    .then(data=>{
      if(data.riwayat && data.riwayat.length>0){
        // Hanya replace jika Sheet punya data lebih baru / lebih banyak
        if(data.riwayat.length >= riwayat.length){
          riwayat = data.riwayat;
          nextId = Math.max(...riwayat.map(x=>x.id),0)+1;
          saveLS();
          renderAll();
        }
      }
    })
    .catch(e=>{ /* offline - pakai DEFAULT_DATA 373 */ });
}

function hitung(){ var res={}; riwayat.forEach(function(r){ if(r.bulan===bulan && r.tahun===tahun){ r.orang.forEach(function(o){ res[o]=(res[o]||0)+jamMap[r.jam] }) } }); return res }
function renderTotal(){
var h=hitung(); var arr=Object.entries(h).sort(function(a,b){return b[1]-a[1]}); var max=Math.max(...arr.map(function(x){return x[1]}),1);
document.getElementById('totalTitle').innerText=`TOTAL — ${bulan} ${tahun}`;
document.getElementById('inputTitle').innerText=`INPUT — ${bulan} ${tahun}`;
if(arr.length===0){ document.getElementById('totalList').innerHTML=`<div class="empty">Belum ada data di ${bulan} ${tahun}</div>`; return }
var html=''; arr.forEach(function(pair,i){ var n=pair[0], v=pair[1]; var pct=v/max*100; html+=`<div class="row"><div style="flex:1"><div style="display:flex;gap:8px"><span style="font-size:12px;color:#94A3B8">#${i+1}</span><b>${n}</b></div><div class="bar"><div style="width:${pct}%"></div></div></div><b style="font-size:18px;margin-left:12px">${fmt(v)}</b></div>` });
document.getElementById('totalList').innerHTML=html
}
function renderRiwayat(){
var list=riwayat.filter(function(r){return r.bulan===bulan && r.tahun===tahun});
if(list.length===0){ document.getElementById('riwayatList').innerHTML=`<div class="empty">Belum ada riwayat di ${bulan} ${tahun}</div>`; return }
var html=''; list.forEach(function(r){
html+=`<div class="riwayatCard"><div style="display:flex;justify-content:space-between;align-items:center"><b>${r.tgl} ${r.bulan} — ${r.orang.length} orang — ${r.jam}</b><button class="smallBtn" onclick="toggleG(${r.id})">${r.collapsed?'+':'-'}</button></div>${r.collapsed?'':`<div style="margin-top:12px">${r.orang.map(function(o){return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F8FAFC"><span>${o}</span><button class="xBtn" onclick="hapusO(${r.id},'${o}')">X</button></div>`}).join('')}<button onclick="hapusG(${r.id})" style="margin-top:8px;padding:6px 12px;background:#FEE2E2;color:red;border:none;border-radius:12px;cursor:pointer">Hapus Grup</button></div>`}</div>`
}); document.getElementById('riwayatList').innerHTML=html
}
function toggleG(id){ var r=riwayat.find(function(x){return x.id===id}); if(r){ r.collapsed=!r.collapsed; renderRiwayat() } }
function hapusO(id,nama){ var r=riwayat.find(function(x){return x.id===id}); if(r){ r.orang=r.orang.filter(function(o){return o!==nama}); if(r.orang.length===0) riwayat=riwayat.filter(function(x){return x.id!==id}); saveLS(); autoSync({id:id, nama:nama}, 'delete_person'); renderAll() } }
function hapusG(id){ if(confirm('Hapus grup ini?')){ riwayat=riwayat.filter(function(x){return x.id!==id}); saveLS(); autoSync({id:id}, 'delete_group'); renderAll() } }
function hapusSemua(){ if(confirm('Hapus semua?')){ riwayat=[]; saveLS(); renderAll() } }
function toggleN(n){ if(selected.includes(n)) selected=selected.filter(function(x){return x!==n}); else selected.push(n); renderNamaPanel() }
function simpan(){
if(selected.length===0){ alert('Pilih anggota pakai +'); return }
var tgl=tglVal||new Date().getDate(); nextId++; var newItem={id:nextId, tgl:tgl, bulan:bulan, tahun:tahun, jam:jam, orang:[...selected], collapsed:true, created: new Date().toISOString()};
riwayat.unshift(newItem); saveLS(); autoSync(newItem, 'add'); selected=[]; tglVal=''; document.getElementById('tglBtn').innerText='Tgl'; closeAll(); renderAll();
}
function renderAll(){ renderTotal(); renderRiwayat(); renderNamaPanel() }
loadLS(); initPanels(); renderAll();

 var ids=['bPanel','tPanel','jPanel','tglPanel','namaPanel']; var btns=['toggleB','toggleT','toggleJ','toggleTgl','toggleNama'];

 if(!inside) closeAll();
});
