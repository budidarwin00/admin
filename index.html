</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AREA EF Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f8fafc;color:#111}
.h{position:sticky;top:0;z-index:10;background:#0e7490;color:#fff;padding:12px 16px;display:flex;justify-content:space-between}
.h b{font-size:13px;letter-spacing:.1em}
.btn{height:30px;padding:0 12px;border-radius:20px;border:1px solid #e2e8f0;background:#fff;font-size:11px;font-weight:600}
.btn-b{background:#111;color:#fff;border-color:#111}

.sel{height:30px;border-radius:20px;border:1px solid #e2e8f0;padding:0 10px;background:#f1f5f9;font-size:12px}

.inp{width:100%;height:42px;border:0;border-bottom:2px solid #111;font-size:14px;outline:0}

</style></head><body><div id="a"></div>
<script>
const URL='https://script.google.com/macros/s/AKfycbz-Tgif9wJD6PAidITjE3-55BInA4pHZAibDI3mAIYUp_6DQV8may5oJkwyY0nHx4qE/exec';
const TUL={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};
const calc=j=>TUL[j]||j*1.5;
const norm=t=>{let s=String(t).trim();if(s.includes('T'))s=s.split('T')[0];s=s.replace('Z','');let m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];m=s.match(/(\d{1,2})[\-\/](\d{1,2})[\-\/](\d{4})/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return s;}
const fmt=t=>{let p=norm(t).split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:t;}
function j(u){return new Promise((r,jo)=>{let c='cb'+Date.now();window[c]=d=>{delete window[c];document.getElementById(c)?.remove();r(d);};let s=document.createElement('script');s.id=c;s.src=u+'&callback='+c+'&_='+Date.now();s.onerror=()=>{delete window[c];s.remove();jo();};document.body.appendChild(s);});}
let all=[],filter=localStorage.getItem('fb')||'all',show=6,login=!!localStorage.getItem('admin_login');
async function load(){let a=document.getElementById('a');if(!login)return render();a.innerHTML='<div class=empty>Loading...</div>';try{let d=await j(URL+'?action=read');if(Array.isArray(d)){all=d.map(x=>{let jn=Number(x.jam||0);if(![2,3,4,6,7,8].includes(jn))return null;let t=norm(x.tanggal);return{tanggal:t,nama:String(x.nama||'').trim(),jam:jn,tul:calc(jn)}}).filter(Boolean);}}catch{}render();}
function f(){if(filter==='all')return all;return all.filter(r=>Number(r.tanggal.split('-')[1])===Number(filter));}
function g(d){let m={};d.forEach(r=>{if(!m[r.tanggal])m[r.tanggal]=[];m[r.tanggal].push(r);});return Object.keys(m).sort((a,b)=>new Date(b)-new Date(a)).map(k=>({tanggal:k,rows:m[k]}));}
function gk(d){let m={};d.forEach(r=>{if(!m[r.nama])m[r.nama]={nama:r.nama,c:0,tot:0};m[r.nama].c++;m[r.nama].tot+=r.tul;});return Object.values(m).sort((a,b)=>b.tot-a.tot);}
function exportPDF(){
 let data=f();
 let html='<html><head><title>AREA EF Admin</title><style>body{font-family:system-ui;padding:20px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #ddd;padding:6px;font-size:11px}th{background:#f1f5f9}</style></head><body>';
 html+='<h2>AREA EF - Rekap '+data.length+' data - Filter: '+filter+'</h2>';
 let rk=gk(data);
 html+='<h3>Rekap per anggota</h3><table><tr><th>Nama</th><th>Hari</th><th>Total TUL</th></tr>';
 rk.forEach(k=>{html+='<tr><td>'+k.nama+'</td><td>'+k.c+'</td><td>'+k.tot+'</td></tr>';});
 html+='</table><br><h3>Detail</h3><table><tr><th>Tanggal</th><th>Nama</th><th>Jam</th><th>TUL</th></tr>';
 data.forEach(r=>{html+='<tr><td>'+fmt(r.tanggal)+'</td><td>'+r.nama+'</td><td>'+r.jam+'</td><td>'+r.tul+'</td></tr>';});
 html+='</table><br><button onclick=window.print() style="padding:8px 16px;background:#111;color:#fff;border:0;border-radius:8px">Cetak / Save PDF</button></body></html>';
 let w=window.open('','_blank');w.document.write(html);w.document.close();
}
function doLogin(){let p=document.getElementById('p').value;if(p==='admin123'){localStorage.setItem('admin_login','1');login=true;load();}else document.getElementById('e').innerText='Salah';}
function logout(){localStorage.removeItem('admin_login');login=false;render();}
function setF(v){filter=v;localStorage.setItem('fb',v);show=6;render();}
function render(){
 let a=document.getElementById('a');
 if(!login){a.innerHTML='<div class=login><div style="max-width:300px;width:100%"><div style="font-size:10px;letter-spacing:.3em;margin-bottom:20px">AREA EF</div><input id=p type=password placeholder=Password class=inp><div id=e style="color:red;font-size:11px;margin-top:6px"></div><button onclick=doLogin() class=lbtn>Masuk</button></div></div>';return;}
 let data=f(),gg=g(data),rk=gk(data);
 let h='<div class=h><b>AREA EF</b><button onclick=logout() class=btn>Keluar</button></div>';
 h+='<div class=bar><select onchange=setF(this.value) class=sel><option value=all '+(filter==='all'?'selected':'')+'>Semua Bulan</option><option value=1 '+(filter==='1'?'selected':'')+'>Jan</option><option value=2 '+(filter==='2'?'selected':'')+'>Feb</option><option value=3 '+(filter==='3'?'selected':'')+'>Mar</option><option value=4 '+(filter==='4'?'selected':'')+'>Apr</option><option value=5 '+(filter==='5'?'selected':'')+'>Mei</option><option value=6 '+(filter==='6'?'selected':'')+'>Jun</option><option value=7 '+(filter==='7'?'selected':'')+'>Jul</option><option value=8 '+(filter==='8'?'selected':'')+'>Agu</option><option value=9 '+(filter==='9'?'selected':'')+'>Sep</option><option value=10 '+(filter==='10'?'selected':'')+'>Okt</option><option value=11 '+(filter==='11'?'selected':'')+'>Nov</option><option value=12 '+(filter==='12'?'selected':'')+'>Des</option></select><button onclick=exportPDF() class=btn style="background:#111;color:#fff">Export PDF</button></div>';
 if(rk.length){h+='<div class=rekap><div style="font-size:10px;font-weight:700;letter-spacing:.1em">REKAP '+data.length+' DATA</div>';rk.forEach(k=>{h+='<div class=row style="padding:6px 0"><span>'+k.nama+' • '+k.c+' hari</span><b>'+k.tot+' TUL</b></div>'});h+='</div>';}
 if(gg.length===0){h+='<div class=empty>TIDAK ADA DATA<br>Total: '+all.length+'</div>';}
 else{
   gg.slice(0,show).forEach(x=>{let tot=x.rows.reduce((s,r)=>s+r.tul,0);h+='<div class=card><div class=card-h><div><div class=dt>'+fmt(x.tanggal)+'</div><div class=meta>'+x.rows.length+' orang • '+tot+' TUL</div></div><button onclick="if(confirm(\'Hapus '+fmt(x.tanggal)+' ?\'))fetch(\''+URL+'?action=deletetanggal&tanggal='+x.tanggal+'\').then(()=>load())" class=btn>Hapus</button></div>';x.rows.forEach(r=>{h+='<div class=row><span>'+r.nama+'</span><span>'+r.jam+'j • '+r.tul+' TUL</span></div>'});h+='</div>';});
   if(show<gg.length)h+='<div style=padding:12px><button onclick=show+=8;render() class="btn btn-b" style="width:100%;height:38px">Load lagi ('+(gg.length-show)+')</button></div>';
 }
 a.innerHTML=h;
}
load();
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
