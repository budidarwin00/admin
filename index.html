<!DOCTYPE html><html lang="id"><head><style>

  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;

</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AREA EF - ADMIN</title>
<style>
*{box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{margin:0;background:#F8FAFC}
.wrap{max-width:480px;margin:0 auto;background:#F8FAFC;min-height:100vh;padding-bottom:80px}
.header{height:64px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 16px;border-bottom:1px solid #E5E7EB;position:sticky;top:0;z-index:30}
.pill{padding:8px 14px;background:#F1F5F9;border:1px solid #E2E8F0;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.card{background:#fff;border-radius:20px;margin:12px;padding:18px;border:1px solid #F1F5F9;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.inputRow{display:flex;gap:8px;margin-top:12px;align-items:center}
.inpBox{height:56px;border:2px solid #000;border-radius:16px;padding:0 12px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:space-between;background:#fff;cursor:pointer;flex-shrink:0}
.inpBox input{border:none;outline:none;font-weight:700;width:100%;text-align:center;background:transparent}
.inpTgl{width:72px}
.inpJam{width:64px}
.inpAnggota{flex:1;min-width:0}
.btnSimpan{height:56px;background:#000;color:#fff;border:none;border-radius:16px;font-weight:800;font-size:14px;padding:0 20px;cursor:pointer;flex-shrink:0;letter-spacing:.02em}
.labelSmall{font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.5;text-transform:uppercase}
.panel{position:absolute;top:60px;right:0;background:#fff;border:1px solid #E2E8F0;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.12);width:160px;display:none;z-index:40;overflow:hidden;max-height:300px;overflow-y:auto}
.panel button{width:100%;padding:14px;text-align:left;border:none;background:#fff;cursor:pointer;font-size:14px;font-weight:600}
.panelAnggota{width:100%;right:0;left:0;top:60px;max-height:360px}
.chip{display:inline-flex;padding:6px 10px;background:#F1F5F9;border:1px solid #E2E8F0;border-radius:20px;font-size:12px;font-weight:600;margin:3px;cursor:pointer}
.chip.active{background:#000;color:#fff;border-color:#000}
.empty{color:#94A3B8;text-align:center;padding:20px;font-size:14px}
.riwayatCard{background:#fff;border-radius:16px;padding:12px;margin:8px 0;border:1px solid #F1F5F9;display:flex;justify-content:space-between;align-items:center}
</style></head><body>
<div class="wrap">
  <div class="header">
    <b style="font-size:18px;font-weight:900">AREA EF</b>
    <div style="display:flex;gap:8px;align-items:center">
      <div style="position:relative"><div class="pill" onclick="toggleB()"><span id="bBtn">Okt</span></div><div class="panel" id="bPanel"></div></div>
      <div style="position:relative"><div class="pill" onclick="toggleT()"><span id="tBtn">2026</span></div><div class="panel" id="tPanel"></div></div>
    </div>
  </div>

  <div class="card">
    <div class="labelSmall">INPUT — <span id="inputLabel">Okt 2026</span></div>
    <div class="inputRow">
      <div class="inpBox inpTgl"><input id="inTgl" type="text" inputmode="numeric" placeholder="Tgl" maxlength="2" /></div>
      <div class="inpBox inpJam"><input id="inJam" type="text" inputmode="numeric" placeholder="3" value="3" /></div>
      <div class="inpBox inpAnggota" onclick="toggleAnggotaPanel()"><span id="anggotaBtn" style="font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Anggota</span><span style="font-weight:800;margin-left:8px">+</span></div>
      <button class="btnSimpan" onclick="simpan()">SIMPAN</button>
    </div>
    <div style="position:relative">
      <div class="panel panelAnggota" id="anggotaPanel" style="display:none;padding:12px">
        <div id="anggotaChips"></div>
        <div style="margin-top:10px;display:flex;gap:6px"><button class="pill" onclick="clearAnggota()" style="flex:1">Clear</button><button class="pill" onclick="closeAnggotaPanel()" style="flex:1;background:#000;color:#fff">OK</button></div>
      </div>
    </div>
    <div id="selectedInfo" style="margin-top:10px;display:flex;flex-wrap:wrap"></div>
    <div id="saveMsg" style="font-size:11px;margin-top:8px;color:#10B981"></div>
  </div>

  <div class="card">
    <div class="labelSmall">TOTAL — <span id="totalLabel">Okt 2026</span></div>
    <div id="totalList" style="margin-top:12px"></div>
  </div>

  <div style="padding:0 16px;margin-top:16px" class="labelSmall">RIWAYAT</div>
  <div id="riwayatList" style="margin-top:8px;padding:0 12px"></div>

</div>

<script>
const WEBAPP_URL='https://script.google.com/macros/s/AKfycbylrqytsyq-ZKx1azc945HmvxYjB_9gPOE5YxpHVE5BeQdjCgu9ELZ3Gh-plif5N1a1/exec';
const NAMA_LIST=["Arief", "Topik", "Yudi", "Putri", "Budi", "Dozen", "Syarif", "Nely", "Zaelani", "Nia", "Eka", "Supriyadi", "Aaf", "Aditya", "Anah", "Anisa"];
const JAM_MAP={"2": 3.5, "3": 5.5, "4": 7.5, "6": 12, "7": 14, "8": 17};
const bulanList=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const tahunList=['2026','2027','2028'];
let bulan='Okt', tahun='2026', riwayat=[], selectedOrang=new Set();

function normalizeNama(s){ if(!s) return ''; let l=String(s).toLowerCase().trim(); for(let n of NAMA_LIST){if(n.toLowerCase()===l) return n;} for(let n of NAMA_LIST){if(l.includes(n.toLowerCase())) return n;} return s; }

function init(){ initPanels(); renderChips(); loadRiwayat(); }
function initPanels(){
  document.getElementById('bPanel').innerHTML=bulanList.map(b=>`<button onclick="pilihB('${b}')">${b}</button>`).join('');
  document.getElementById('tPanel').innerHTML=tahunList.map(t=>`<button onclick="pilihT('${t}')">${t}</button>`).join('');
}
function closeAll(){ ['bPanel','tPanel','anggotaPanel'].forEach(id=>{let el=document.getElementById(id); if(el) el.style.display='none';}); }
function toggleB(){ let p=document.getElementById('bPanel'); let s=p.style.display!=='block'; closeAll(); p.style.display=s?'block':'none'; }
function toggleT(){ let p=document.getElementById('tPanel'); let s=p.style.display!=='block'; closeAll(); p.style.display=s?'block':'none'; }
function pilihB(b){ bulan=b; document.getElementById('bBtn').innerText=b; updateLabels(); closeAll(); renderAll(); }
function pilihT(t){ tahun=t; document.getElementById('tBtn').innerText=t; updateLabels(); closeAll(); renderAll(); }
function updateLabels(){ document.getElementById('inputLabel').innerText=bulan+' '+tahun; document.getElementById('totalLabel').innerText=bulan+' '+tahun; }

function toggleAnggotaPanel(){ let p=document.getElementById('anggotaPanel'); let s=p.style.display!=='block'; closeAll(); if(s){p.style.display='block';} }
function closeAnggotaPanel(){ document.getElementById('anggotaPanel').style.display='none'; renderSelected(); }
function clearAnggota(){ selectedOrang.clear(); renderChips(); renderSelected(); }

function renderChips(){
  let h=''; NAMA_LIST.forEach(n=>{ let a=selectedOrang.has(n)?' active':''; h+=`<span class="chip${a}" onclick="toggleOrang('${n}')">${n}</span>`; });
  document.getElementById('anggotaChips').innerHTML=h;
}
function toggleOrang(n){ if(selectedOrang.has(n)) selectedOrang.delete(n); else selectedOrang.add(n); renderChips(); renderSelected(); }
function renderSelected(){
  let arr=Array.from(selectedOrang);
  let info=document.getElementById('selectedInfo');
  let btn=document.getElementById('anggotaBtn');
  if(arr.length===0){ btn.innerText='Anggota'; info.innerHTML=''; return; }
  btn.innerText=arr.length+' orang';
  info.innerHTML=arr.map(n=>`<span class="chip active">${n} <span onclick="toggleOrang('${n}')" style="margin-left:4px">×</span></span>`).join('');
}

function loadRiwayat(){
  fetch(WEBAPP_URL+'?action=load').then(r=>r.json()).then(d=>{ riwayat=d.riwayat||[]; renderAll(); }).catch(e=>{});
}

function simpan(){
  let tgl=document.getElementById('inTgl').value.trim();
  let jam=document.getElementById('inJam').value.trim()||'3';
  let orangArr=Array.from(selectedOrang);
  let msg=document.getElementById('saveMsg');
  if(!tgl||!jam||orangArr.length===0){ msg.style.color='#EF4444'; msg.innerText='Isi Tgl, Jam, Anggota'; return; }
  let norm=orangArr.map(o=>normalizeNama(o));
  let orangStr=norm.join(',');
  msg.style.color='#64748B'; msg.innerText='Menyimpan...';
  fetch(WEBAPP_URL+'?action=add&tgl='+encodeURIComponent(tgl)+'&bulan='+encodeURIComponent(bulan)+'&tahun='+encodeURIComponent(tahun)+'&jam='+encodeURIComponent(jam)+'&orang='+encodeURIComponent(orangStr))
    .then(r=>r.json()).then(d=>{ msg.style.color='#10B981'; msg.innerText='Berhasil simpan '+tgl+' '+bulan+' '+tahun+' Jam '+jam+' -> '+orangStr; riwayat.push({tgl:tgl, bulan:bulan, tahun:tahun, jam:jam, orang:norm}); renderAll(); document.getElementById('inTgl').value=''; selectedOrang.clear(); renderChips(); renderSelected(); closeAnggotaPanel(); }).catch(e=>{ msg.style.color='#EF4444'; msg.innerText='Error'; });
}

function renderAll(){
  let list=riwayat.filter(r=>r.bulan===bulan && r.tahun===tahun);
  // TOTAL
  let totals={}; NAMA_LIST.forEach(n=>totals[n]=0);
  list.forEach(r=>{ (r.orang||[]).forEach(o=>{ let nn=normalizeNama(o); if(totals[nn]!==undefined) totals[nn]+=(JAM_MAP[r.jam]||0); }); });
  let totalList=document.getElementById('totalList');
  let hasData=Object.values(totals).some(v=>v>0);
  if(!hasData){ totalList.innerHTML=`<div class="empty">Belum ada data di ${bulan} ${tahun}</div>`; }
  else {
    let h='<div style="display:flex;flex-wrap:wrap;gap:8px">'; Object.keys(totals).sort().forEach(n=>{ if(totals[n]>0){ h+=`<div class="pill" style="background:#fff;border:2px solid #000"><b>${n}</b> <span style="margin-left:6px">${String(totals[n]).replace('.',',')}</span></div>`; } }); h+='</div>'; totalList.innerHTML=h;
  }
  // RIWAYAT
  let riwayatDiv=document.getElementById('riwayatList');
  if(list.length===0){ riwayatDiv.innerHTML=`<div class="empty">Belum ada riwayat di ${bulan} ${tahun}</div>`; return; }
  list.sort((a,b)=>parseInt(b.tgl)-parseInt(a.tgl));
  let html=''; list.forEach(r=>{ let tul=JAM_MAP[r.jam]||0; let idx=riwayat.indexOf(r); html+=`<div class="riwayatCard"><div><b style="font-size:14px">${r.tgl} ${r.bulan} — ${r.jam} (${String(tul).replace('.',',')} TUL)</b><div style="font-size:12px;color:#64748B;margin-top:2px">${(r.orang||[]).join(', ')}</div></div><div style="display:flex;gap:6px"><button class="pill" onclick="hapus(${
    riwayat.indexOf(r)
  })" style="background:#EF4444;color:#fff;border-color:#EF4444">Hapus</button></div></div>`; });
  riwayatDiv.innerHTML=html;
}
function hapus(idx){ if(!confirm('Hapus riwayat ini?')) return; fetch(WEBAPP_URL+'?action=delete&index='+idx).then(r=>r.json()).then(d=>{ loadRiwayat(); }); }

document.addEventListener('click', e=>{
  let ids=['bPanel','tPanel','anggotaPanel'];
  let inside=false;
  ids.forEach(id=>{ if(e.target.closest('#'+id)) inside=true; });
  if(e.target.closest('[onclick^="toggle"]') || e.target.closest('.inpBox') || e.target.closest('.chip')) inside=true;
  if(!inside) closeAll();
});

init();
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
