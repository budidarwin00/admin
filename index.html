<meta charset="UTF-8">

<title>Admin V5 - Modern Clock</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>

</head>
<body class="bg-[#f6f5f4] min-h-screen">
<div id="app"></div>
<script>
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbw5cHnAw-eyp-8KPmIhWijZbGDofMhjrSkibD-23AEBimCeT8m9msRm63AGur7N1wWpXw/exec';
const ADMIN_PASS = 'admin123';
const TUL_MAP={2:3.5,3:5.5,4:7.5,6:12,7:14,8:17};
const calcTUL=j=>TUL_MAP[j]||j*2;
function normNama(n){ return String(n||'').trim().toLowerCase(); }
function normalizeTanggal(t){
  if(!t) return '';
  let str = String(t).trim();
  if(str.includes('T')) str = str.split('T')[0];
  if(str.includes(' ')) str = str.split(' ')[0];
  try{
    const d = new Date(t);
    if(!isNaN(d.getTime())){
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    }
  }catch{}
  return str;
}
function formatTanggal(t){
  const norm = normalizeTanggal(t);
  const parts = norm.split('-');
  if(parts.length===3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
  return norm;
}
const DEFAULT_KARYAWAN = [
  {nama:'Nia',pass:'1234'},{nama:'Aditya',pass:'1234'},{nama:'Anisa',pass:'1234'},{nama:'Aaf',pass:'1234'},{nama:'Syarif',pass:'1234'},{nama:'Budi',pass:'1234'},{nama:'Topik',pass:'1234'},{nama:'Yudi',pass:'1234'},{nama:'Dozen',pass:'1234'},{nama:'Putri',pass:'1234'},{nama:'Arief',pass:'1234'},{nama:'Anah',pass:'1234'},{nama:'Supriyadi',pass:'1234'},{nama:'Eka',pass:'1234'},{nama:'Nely',pass:'1234'},{nama:'Zaelani',pass:'1234'},
];
let isLogin = localStorage.getItem('admin_login')==='true';
let allData=[];
let karyawanList=JSON.parse(localStorage.getItem('rk_kar_admin_nonik')||'null');
if(!karyawanList || karyawanList.length<16){ karyawanList=DEFAULT_KARYAWAN; localStorage.setItem('rk_kar_admin_nonik', JSON.stringify(karyawanList)); }
let selectedMassal = {};
let syncStatus = '● Sinkron';
let activeTab = 'massal';
let liveClockInterval = null;

function showToast(m){ const t=document.createElement('div'); t.className='fixed bottom-4 left-1/2 -translate-x-1/2 bg-zinc-900 text-white px-5 py-3 rounded-full text-[13px] font-semibold z-50 max-w-[90%] text-center shadow-2xl'; t.innerText=m; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb='cb_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);
    window[cb]=(data)=>{ delete window[cb]; document.getElementById(cb)?.remove(); resolve(data); };
    const s=document.createElement('script'); s.id=cb;
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&t='+Date.now();
    s.onerror=()=>{ delete window[cb]; s.remove(); reject(new Error('fail')); };
    document.body.appendChild(s);
    setTimeout(()=>{ if(window[cb]){ delete window[cb]; s.remove(); reject(new Error('Timeout')); } },8000);
  });
}
async function fetchData(){
  syncStatus = 'Sinkron'; 
  try{
    const j = await jsonp(SYNC_URL+'?action=read');
    if(Array.isArray(j)) {
      allData=j.map(row=>({tanggal:row.tanggal, tanggalNorm: normalizeTanggal(row.tanggal), nama:row.nama||row.nik, jam:Number(row.jam||0), tul:calcTUL(Number(row.jam||0)), rowIndex: row.rowIndex})).filter(x=>x.nama);
      syncStatus = 'Sinkron';
    } else { syncStatus = 'Offline'; }
  }catch(e){ syncStatus = 'Offline'; }
  render();
}
function login(){ const p=document.getElementById('apass').value; if(p===ADMIN_PASS){ localStorage.setItem('admin_login','true'); isLogin=true; fetchData(); } else document.getElementById('aerr').innerText='Password salah'; }
function logout(){ localStorage.removeItem('admin_login'); isLogin=false; if(liveClockInterval) clearInterval(liveClockInterval); render(); }
function filteredData(){
  let d=[...allData];
  if(filterBulan!=='all'){ d=d.filter(x=>{ const norm = x.tanggalNorm || normalizeTanggal(x.tanggal); const m = norm.split('-')[1]; return String(parseInt(m))===String(parseInt(filterBulan)); }); }
  if(filterTahun!=='all'){ d=d.filter(x=>{ const norm = x.tanggalNorm || normalizeTanggal(x.tanggal); const y = norm.split('-')[0]; return String(y)===filterTahun; }); }
  return d;
}
let filterBulan=String(new Date().getMonth()+1);
let filterTahun='all';
function groupByKaryawan(data){
  const map={}; data.forEach(r=>{ const key=normNama(r.nama); if(!map[key]) map[key]={nama:r.nama,totalTUL:0}; map[key].totalTUL+=Number(r.tul); }); return Object.values(map).sort((a,b)=>b.totalTUL-a.totalTUL);
}
function groupByTanggal(data){
  const map={};
  data.forEach(r=>{
    const tNorm = r.tanggalNorm || normalizeTanggal(r.tanggal);
    if(!map[tNorm]) map[tNorm]={tanggal:tNorm, totalJam:0, totalTUL:0, rows:[]};
    map[tNorm].totalJam+=Number(r.jam);
    map[tNorm].totalTUL+=Number(r.tul);
    map[tNorm].rows.push(r);
  });
  return Object.values(map).sort((a,b)=> new Date(b.tanggal) - new Date(a.tanggal));
}
function toggleSelectMassal(nama){ const key=normNama(nama); if(selectedMassal[key]) delete selectedMassal[key]; else selectedMassal[key]=true; renderMassalList(); }
function selectAllMassal(){ const allSelected = Object.keys(selectedMassal).length === karyawanList.length; if(allSelected){ selectedMassal={}; } else { selectedMassal={}; karyawanList.forEach(k=>{ selectedMassal[normNama(k.nama)]=true; }); } renderMassalList(); }
function renderMassalList(){
  const container=document.getElementById('massalList');
  if(!container) return;
  container.innerHTML = karyawanList.map(k=>{
    const key=normNama(k.nama);
    const isSelected = !!selectedMassal[key];
    return `<label class="flex items-center gap-3 px-5 py-4 rounded-[20px] border-2 cursor-pointer transition-all ${isSelected?'bg-zinc-900 text-white border-zinc-900 shadow-lg scale-[0.98]':'bg-white border-zinc-200 hover:border-zinc-300'}"><input type="checkbox" ${isSelected?'checked':''} onchange="toggleSelectMassal('${k.nama}')" class="w-5 h-5 rounded"><span class="text-[15px] font-semibold">${k.nama}</span></label>`;
  }).join('');
  const countEl=document.getElementById('massalCount');
  if(countEl) countEl.innerText = `${Object.keys(selectedMassal).length} dipilih`;
}
let isSaving=false;
async function handleInputMassal(){
  if(isSaving) return;
  isSaving=true;

  const tgl=document.getElementById('massalTgl').value;
  const jam=parseInt(document.getElementById('massalJam').value);
  const selectedNames = Object.keys(selectedMassal).map(key=>{ const k=karyawanList.find(x=>normNama(x.nama)===key); return k ? k.nama : key; });
  if(!tgl || !jam){ showToast('Isi tanggal & jam'); return; }
  if(selectedNames.length===0){ showToast('Pilih minimal 1'); return; }
  const tNorm = normalizeTanggal(tgl);
  const newRows = selectedNames.map(nama=>({tanggal:tNorm, tanggalNorm: tNorm, nama:nama, jam:jam, tul:calcTUL(jam)}));
  allData.unshift(...newRows);
  render();
  showToast(`✅ ${selectedNames.length} tersimpan`);
  selectedMassal={}; renderMassalList();
  const payload = {
    action: 'bulkMassal',
    data: selectedNames.map(nama=>({
      tanggal: tNorm, nik: normNama(nama), nama: nama, jam: jam, tul: calcTUL(jam)
    }))
  };
  try{
    await fetch(SYNC_URL, {method:'POST', mode:'no-cors', body:JSON.stringify(payload)});
    showToast(`✅ ${selectedNames.length} terkirim ke Sheet`);
  }catch{}
  setTimeout(fetchData, 1500);
}
async function hapusTransaksi(tgl, nama, jam){
  const tNorm = normalizeTanggal(tgl);
  if(!confirm(`Hapus ${nama} ${formatTanggal(tgl)} ${jam} jam?`)) return;
  showToast('⏳ Menghapus...');
  try{
    const target = allData.find(r=> normalizeTanggal(r.tanggal)===tNorm && normNama(r.nama)===normNama(nama) && String(r.jam)===String(jam));
    if(target && target.rowIndex){
      await jsonp(`${SYNC_URL}?action=delete&row=${target.rowIndex}&t=${Date.now()}`);
    } else {
      await jsonp(`${SYNC_URL}?action=deleteTransaksi&tanggal=${encodeURIComponent(tNorm)}&nik=${encodeURIComponent(normNama(nama))}&jam=${encodeURIComponent(jam)}&t=${Date.now()}`);
    }
    allData = allData.filter(r=> !(normalizeTanggal(r.tanggal)===tNorm && normNama(r.nama)===normNama(nama) && String(r.jam)===String(jam)));
    showToast('✅ Terhapus');
    render();
    setTimeout(fetchData, 1000);
  }catch{ showToast('❌ Gagal - update Apps Script V3'); }
}
async function hapusTanggal(tgl){
  const tNorm = normalizeTanggal(tgl);
  const data = allData.filter(x=> (x.tanggalNorm||normalizeTanggal(x.tanggal))===tNorm);
  if(!confirm(`Hapus ${data.length} data ${formatTanggal(tgl)}?`)) return;
  showToast(`⏳ Menghapus ${data.length} data...`);
  const sorted = [...data].sort((a,b)=> (b.rowIndex||0) - (a.rowIndex||0));
  for(const r of sorted){
    try{
      if(r.rowIndex) await jsonp(`${SYNC_URL}?action=delete&row=${r.rowIndex}&t=${Date.now()}`);
      await new Promise(res=>setTimeout(res, 400));
    }catch{}
  }
  allData = allData.filter(x=> (x.tanggalNorm||normalizeTanggal(x.tanggal))!==tNorm);
  showToast(`✅ ${formatTanggal(tgl)} terhapus`);
  render();
}
async function hapusKaryawanTUL(nama){
  const data = allData.filter(x=>normNama(x.nama)===normNama(nama));
  if(!confirm(`Hapus ${data.length} data ${nama}?`)) return;
  for(const r of data){
    try{ if(r.rowIndex) await jsonp(`${SYNC_URL}?action=delete&row=${r.rowIndex}&t=${Date.now()}`); }catch{}
    await new Promise(res=>setTimeout(res, 300));
  }
  fetchData();
}
function shareWA(nama, totalTUL){ window.open(`https://wa.me/?text=${encodeURIComponent(nama+' '+totalTUL+'tul')}`, '_blank'); }
function shareAllWA(){
  const data = filteredData();
  const grouped = groupByKaryawan(data);
  const bulanNama=['','januari','februari','maret','april','mei','juni','juli','agustus','september','oktober','november','desember'];
  let labelBulan = 'september';
  if(filterBulan!=='all'){
    labelBulan = (bulanNama[parseInt(filterBulan)]||'').toLowerCase()||'Bulan '+filterBulan;
  } else {
    const now = new Date();
    labelBulan = bulanNama[now.getMonth()+1];
  }
  let pesan = `Total tul bulan ${labelBulan}\n` + grouped.map(g=> `${g.nama} ${g.totalTUL}tul`).join('\n');
  window.open(`https://wa.me/?text=${encodeURIComponent(pesan)}`, '_blank');
}
function shareTanggalWA(tgl){
  const tNorm = normalizeTanggal(tgl);
  const data = allData.filter(x=> (x.tanggalNorm||normalizeTanggal(x.tanggal))===tNorm);
  const grouped = {};
  data.forEach(r=>{ const k=r.nama; if(!grouped[k]) grouped[k]={nama:k, tul:0}; grouped[k].tul+=Number(r.tul); });
  const list = Object.values(grouped);
  const bulanNama=['','januari','februari','maret','april','mei','juni','juli','agustus','september','oktober','november','desember'];
  let b = '';
  try{
    const d = new Date(tNorm);
    b = bulanNama[d.getMonth()+1]||'';
  }catch{ b=''; }
  let pesan = `Total tul bulan ${b} ${formatTanggal(tgl)}\n` + list.map(g=> `${g.nama} ${g.tul}tul`).join('\n');
  // Sesuai request kamu: Total tul bulan september
  // Jika mau tanpa tanggal, pakai ini:
  pesan = `Total tul bulan ${b}\n` + list.map(g=> `${g.nama} ${g.tul}tul`).join('\n');
  window.open(`https://wa.me/?text=${encodeURIComponent(pesan)}`, '_blank');
}

function startLiveClock(){
  if(liveClockInterval) clearInterval(liveClockInterval);
  liveClockInterval = setInterval(()=>{
    const el = document.getElementById('liveClock');
    const dateEl = document.getElementById('liveDate');
    if(!el) return;
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    el.innerHTML = `${h}<span class="opacity-30">:</span>${m}<span class="opacity-20 text-[14px] ml-1">${s}</span>`;
    if(dateEl){
      const opts = {day:'2-digit', month:'short', year:'numeric'};
      dateEl.innerText = now.toLocaleDateString('id-ID', opts);
    }
  }, 1000);
}

function render(){
  const app=document.getElementById('app');
  if(!isLogin){
    // LOGIN BERSIH TANPA TULISAN MERAH
    app.innerHTML=`<div class="min-h-screen grid place-items-center p-4 bg-[#0a0a0a]">
      <div class="w-full max-w-[360px] bg-white rounded-[32px] p-8 shadow-2xl">
        <div class="w-14 h-14 rounded-full bg-zinc-900 text-white grid place-items-center font-bold text-[18px] tracking-tight">EF</div>
        <div class="mt-6">
          <input id="apass" type="password" placeholder="Password" class="w-full h-14 rounded-2xl border-2 border-zinc-100 bg-zinc-50 px-5 text-[15px] focus:border-zinc-900 focus:outline-none transition-colors">
          <div id="aerr" class="text-[12px] text-red-600 min-h-[16px] mt-2"></div>
          <button onclick="login()" class="w-full h-14 rounded-2xl bg-zinc-900 text-white font-bold text-[15px] mt-3 hover:bg-black transition-colors">Masuk</button>
        </div>
        <div class="mt-6 flex justify-center">
          <div class="clock-font text-[11px] text-zinc-400 bg-zinc-50 px-3 py-1.5 rounded-full border" id="loginClock">--:--</div>
        </div>
      </div>
    </div>`;
    startLiveClock();
    setTimeout(()=>{
      const el = document.getElementById('loginClock');
      if(el){
        setInterval(()=>{
          const now = new Date();
          el.innerText = now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
        }, 1000);
      }
    }, 100);
    return;
  }
  const fData=typeof filteredData==='function'?filteredData():allData;
  const grouped=groupByKaryawan(fData);
  const harian=groupByTanggal(fData);
  app.innerHTML=`<div class="max-w-[900px] mx-auto min-h-screen bg-white">
    <!-- HEADER BARU - TANPA LINGKARAN MERAH, JAM BESAR MODERN -->
    <div class="px-5 h-[88px] flex items-center justify-between bg-white sticky top-0 z-20 border-b border-zinc-100">
      <div class="flex items-center gap-4">
        <div class="w-11 h-11 rounded-full bg-zinc-900 text-white grid place-items-center font-bold text-[13px] tracking-tight">EF</div>
        <div class="hidden md:block">
          <div class="font-bold text-[16px] leading-none">Admin</div>
          <div class="flex items-center gap-2 mt-1.5">
            <span class="w-2 h-2 rounded-full ${syncStatus==='Sinkron'?'bg-green-500':'bg-amber-500'} animate-pulse"></span>
            <span class="text-[11px] text-zinc-500 font-medium">${syncStatus}</span>
          </div>
        </div>
      </div>
      
      <!-- JAM BESAR MODERN & INTERAKTIF - LINGKARAN HIJAU -->
      <div class="flex items-center gap-3">
        <div class="glass rounded-[20px] px-5 py-3 flex items-center gap-4 shadow-sm hover:shadow-md transition-shadow cursor-pointer" onclick="fetchData()" title="Klik untuk refresh">
          <div class="text-right">
            <div class="clock-font font-bold text-[22px] leading-none tracking-tight text-zinc-900" id="liveClock">--:--</div>
            <div class="text-[10px] text-zinc-500 font-semibold mt-1 tracking-wide uppercase" id="liveDate">--</div>
          </div>
          <div class="w-10 h-10 rounded-full bg-zinc-900 text-white grid place-items-center hover:scale-105 transition-transform">
            <span class="text-[16px]">↻</span>
          </div>
        </div>
        <button onclick="logout()" class="h-12 px-6 rounded-full bg-zinc-900 text-white text-[13px] font-bold hover:bg-black transition-colors">Logout</button>
      </div>
    </div>

    <div class="px-4 py-3 bg-[#f6f5f4] sticky top-[88px] z-10">
      <div class="flex gap-2 p-1.5 bg-white rounded-[20px] border shadow-sm">
        <button onclick="activeTab='massal';render()" class="flex-1 h-12 rounded-[14px] font-bold text-[13px] transition-all ${activeTab==='massal'?'bg-zinc-900 text-white shadow-lg':'bg-zinc-50 text-zinc-600 border hover:bg-zinc-100'}">Input Massal</button>
        <button onclick="activeTab='harian';render()" class="flex-1 h-12 rounded-[14px] font-bold text-[13px] transition-all ${activeTab==='harian'?'bg-zinc-900 text-white shadow-lg':'bg-zinc-50 text-zinc-600 border hover:bg-zinc-100'}">Riwayat 📅 ${harian.length?`(${harian.length})`:''}</button>
        <button onclick="activeTab='rekap';render()" class="flex-1 h-12 rounded-[14px] font-bold text-[13px] transition-all ${activeTab==='rekap'?'bg-zinc-900 text-white shadow-lg':'bg-zinc-50 text-zinc-600 border hover:bg-zinc-100'}">Rekap</button>
      </div>
    </div>

    <div class="p-4 space-y-4 bg-[#f6f5f4]">
      ${activeTab==='massal'?`
      <div class="rounded-[28px] bg-white border shadow-sm p-6">
        <div class="flex items-center justify-between mb-6">
          <div class="font-bold text-[20px] tracking-tight">Input Lembur</div>
          <button onclick="selectAllMassal()" class="h-11 px-6 rounded-full bg-zinc-900 text-white text-[13px] font-bold hover:bg-black transition-colors">Pilih Semua</button>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-6">
          <div><div class="text-[11px] font-bold text-zinc-500 mb-2 ml-1 tracking-wide uppercase">Tanggal</div><input id="massalTgl" type="date" value="${new Date().toISOString().slice(0,10)}" class="w-full h-14 rounded-[16px] border-2 border-zinc-100 bg-zinc-50 px-5 text-[16px] font-semibold focus:border-zinc-900 focus:outline-none transition-colors"></div>
          <div><div class="text-[11px] font-bold text-zinc-500 mb-2 ml-1 tracking-wide uppercase">Jam</div><select id="massalJam" class="w-full h-14 rounded-[16px] border-2 border-zinc-100 bg-zinc-50 px-5 text-[16px] font-bold focus:border-zinc-900 focus:outline-none transition-colors"><option value="2">2 jam = 3.5 TUL</option><option value="3" selected>3 jam = 5.5 TUL</option><option value="4">4 jam = 7.5 TUL</option><option value="6">6 jam = 12 TUL</option><option value="7">7 jam = 14 TUL</option><option value="8">8 jam = 17 TUL</option></select></div>
        </div>
        <div class="flex items-center justify-between mb-4">
          <div id="massalCount" class="text-[13px] font-bold text-zinc-600">0 dipilih</div>
          <div class="text-[11px] text-zinc-400">${karyawanList.length} karyawan</div>
        </div>
        <button onclick="handleInputMassal()" class="w-full h-[56px] rounded-[18px] bg-zinc-900 text-white font-bold text-[16px] hover:bg-black transition-all hover:scale-[0.99] active:scale-[0.97] shadow-lg">Simpan</button>
        <div id="massalList" class="grid grid-cols-2 gap-3 max-h-[420px] overflow-y-auto p-1 mt-6"></div>
      </div>
      `:''}
      ${activeTab==='harian'?`
      <div class="space-y-3">
        ${harian.length===0?`<div class="rounded-[28px] bg-white border p-12 text-center"><div class="w-12 h-12 bg-zinc-100 rounded-full grid place-items-center mx-auto mb-3">📅</div><div class="text-zinc-500 font-medium">Belum ada data</div></div>`:
        harian.map(h=>`
          <div class="rounded-[24px] bg-white border shadow-sm overflow-hidden">
            <div class="px-6 py-4 bg-zinc-900 text-white flex justify-between items-center">
              <div><div class="font-bold text-[16px]">📅 ${formatTanggal(h.tanggal)}</div><div class="text-[11px] opacity-60 mt-1">${h.rows.length} orang • ${h.totalTUL} TUL</div></div>
              <div class="flex gap-2">
                <button onclick="shareTanggalWA('${h.tanggal}')" class="h-10 px-5 rounded-full bg-green-600 text-white text-[12px] font-bold hover:bg-green-700 transition-colors">WA Share</button>
                <button onclick="hapusTanggal('${h.tanggal}')" class="h-10 px-5 rounded-full bg-red-600 text-white text-[12px] font-bold hover:bg-red-700 transition-colors">Hapus Hari</button>
              </div>
            </div>
            <div class="divide-y">
              ${h.rows.map(r=>`<div class="px-6 py-4 flex items-center justify-between hover:bg-zinc-50 transition-colors"><div><div class="font-bold text-[14px]">${r.nama}</div><div class="text-[12px] text-zinc-500 mt-0.5">${r.jam} jam = ${r.tul} TUL</div></div><button onclick="hapusTransaksi('${r.tanggal}','${r.nama}',${r.jam})" class="h-9 px-4 rounded-full bg-red-50 border border-red-200 text-red-600 text-[12px] font-bold hover:bg-red-100 transition-colors">Hapus</button></div>`).join('')}
            </div>
          </div>
        `).join('')}
      </div>
      `:''}
      ${activeTab==='rekap'?`
      <div class="rounded-[16px] bg-white border p-4 flex gap-2 mb-3">
