const ALIAS_NAMA={
  'kuncoro budi':'Budi',
  'kuncoro':'Budi',
  'budi kuncoro':'Budi',
  'neli':'Nely',
  'nely':'Nely',
  'annisa':'Anisa',
  'aditya zozo':'Aditya',
  'adit':'Aditya',
  'dozen':'Dozen',
  'supri':'Supriyadi',
  'topik':'Topik',
  'zaelani':'Zaelani',
  'aaf':'Aaf'
};
function normalisasiNamaAnggota(nama){
  if(!nama) return '';
  let raw=String(nama).trim();
  let key=raw.toLowerCase();
  if(ALIAS_NAMA[key]) return ALIAS_NAMA[key];
  // if contains alias
  for(let k in ALIAS_NAMA){
    if(key.includes(k)){
      return ALIAS_NAMA[k];
    }
  }
  // Title case
  return raw.split(' ').map(w=> w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ').trim();
}

const DEFAULT_KARYAWAN_AWAL=[{nama:'Aaf'},{nama:'Aditya'},{nama:'Anah'},{nama:'Anisa'},{nama:'Arief'},{nama:'Budi'},{nama:'Dozen'},{nama:'Eka'},{nama:'Nely'},{nama:'Nia'},{nama:'Putri'},{nama:'Supriyadi'},{nama:'Syarif'},{nama:'Topik'},{nama:'Yudi'},{nama:'Zaelani'}];
function dedupKaryawanList(arr){
  const map={}; const out=[];
  for(let k of arr){
    if(!k || !k.nama) continue;
    let norm=normalisasiNamaAnggota(k.nama);
    if(!norm) continue;
    let key=norm.toLowerCase();
    if(!key) continue;
    if(!map[key]){
      map[key]=true;
      out.push({nama:norm, tglLahir:k.tglLahir||''});
    } else {
      let existing=out.find(x=>x.nama.toLowerCase()===key);
      if(existing && !existing.tglLahir && k.tglLahir) existing.tglLahir=k.tglLahir;
    }
  }
  return out.sort((a,b)=>a.nama.localeCompare(b.nama));
}
function getKaryawanList(){
  try{
    const c=localStorage.getItem('custom_karyawan');
    if(c){
      let arr=JSON.parse(c);
      if(Array.isArray(arr)&&arr.length>0){
        let dedup=dedupKaryawanList(arr);
        // auto save deduped if different
        if(dedup.length!==arr.length){
          try{ localStorage.setItem('custom_karyawan', JSON.stringify(dedup)); }catch{}
        }
        return dedup;
      }
    }
  }catch{}
  return dedupKaryawanList(DEFAULT_KARYAWAN_AWAL.slice());
}

}

function getUltahHariIni(){
  try{
    const list=getKaryawanList();
    const tglMap=getCustomMemberTgl();
    const now=new Date();
    const dd=String(now.getDate()).padStart(2,'0');
    const mm=String(now.getMonth()+1).padStart(2,'0');
    const ultah=[];
    for(let k of list){
      let tgl=k.tglLahir || tglMap[k.nama] || '';
      if(!tgl) continue;
      let d='', m='';
      let t=String(tgl).trim();
      if(t.includes('-')){
        let p=t.split('-');
        if(p.length===3){
          if(p[0].length===4){ m=p[1].padStart(2,'0'); d=p[2].padStart(2,'0'); }
          else{ d=p[0].padStart(2,'0'); m=p[1].padStart(2,'0'); }
        }
      }
      if(d===dd && m===mm){
        let y=0;
        try{
          let parts=String(tgl).split('-');
          let year=parts[2] && parts[2].length===4 ? Number(parts[2]) : (parts[0].length===4 ? Number(parts[0]) : 0);
          if(year>0) y=now.getFullYear()-year;
        }catch(e){}
        ultah.push({nama:k.nama, tgl:tgl, umur:y});
      }
    }
    return ultah;
  }catch(e){ return []; }
}
function getTemaUltah(nama, umur){
  return {nama:'Ulang Tahun '+nama+'!', ucapan: umur>0 ? 'Selamat ulang tahun ke-'+umur+'! Semoga sehat & sukses! 🎉' : 'Selamat ulang tahun '+nama+'! 🎂', tema:'ultah', icon:'🎂', umur:umur};
}
function hariBesarHariIni(){
  const now=new Date(); now.setHours(0,0,0,0); const hasil=[];
  HARI_BESAR_TETAP.forEach(h=>{
    const p=h.tgl.split('-');
    for(const y of [now.getFullYear()-1,now.getFullYear(),now.getFullYear()+1]){
      const d=new Date(y,+p[1]-1,+p[0]); d.setHours(0,0,0,0);
      const diff=Math.round((now-d)/86400000);
      if(diff>=-2 && diff<=1){ hasil.push({h:h,diff:diff}); break; }
    }
  });
  HARI_RAYA_VAR.forEach(h=>{
    const P=s=>{const a=s.split('-');const d=new Date(+a[2],+a[1]-1,+a[0]);d.setHours(0,0,0,0);return d;};
    const dari=P(h.dari), sampai=P(h.sampai);
    const dariX=new Date(dari); dariX.setDate(dariX.getDate()-2);
    const sampaiX=new Date(sampai); sampaiX.setDate(sampaiX.getDate()+1);
    if(now>=dariX&&now<=sampaiX){
      let diff=0;
      if(now<dari) diff=Math.round((now-dari)/86400000);
      else if(now>sampai) diff=Math.round((now-sampai)/86400000);
      if(diff>=-2 && diff<=1){ hasil.push({h:h,diff:diff}); }
    }
  });
  return hasil;
}

}

  return {bulan: bulanLalu, tahun: tahunLalu, key: tahunLalu+'-'+String(bulanLalu).padStart(2,'0')};

function buildRekapTextUntukBulan(bulanNum, tahunNum){
  const bulanNames={1:'Januari',2:'Februari',3:'Maret',4:'April',5:'Mei',6:'Juni',7:'Juli',8:'Agustus',9:'September',10:'Oktober',11:'November',12:'Desember'};
  const map=new Map();
  allData.forEach(r=>{const key=r.tanggalNorm+'|'+normNama(r.nama)+'|'+r.jam; if(!map.has(key)) map.set(key,r);});
  let d=Array.from(map.values()).filter(r=> {
    const parts=r.tanggalNorm.split('-');
    if(parts.length!==3) return false;
    const b=Number(parts[1]); const y=Number(parts[0]);
    return b===Number(bulanNum) && y===Number(tahunNum);
  });
  const m={};
  d.forEach(r=>{const k=normNama(r.nama); if(!m[k]) m[k]={nama:r.nama,totalTUL:0,count:0}; m[k].totalTUL+=Number(r.tul); m[k].count+=1;});
  const grouped=Object.values(m).sort((a,b)=> b.totalTUL - a.totalTUL);
  if(grouped.length===0) return null;
  let blnName=bulanNames[Number(bulanNum)]+' '+tahunNum;
  let text='*REKAP LEMBUR AREA EF - '+blnName.toUpperCase()+'*\n';
  text+='Periode: 01-'+String(bulanNum).padStart(2,'0')+'-'+tahunNum+' s/d akhir bulan\n\n';
  grouped.forEach((g,i)=>{ text+=(i+1)+'. '+g.nama+' - '+g.totalTUL+' TUL ('+g.count+' hari)\n'; });
  text+='\nTotal: '+grouped.reduce((s,g)=>s+g.totalTUL,0)+' TUL dari '+grouped.length+' orang';
  text+='\n\n_Dikirim otomatis oleh sistem AREA EF_';
  return text;
}

    const key=r.tanggalNorm+'|'+normNama(r.nama);
    if(!map[key]){ map[key]=r; cleaned.push(r); }
    else { if(Number(r.jam)>Number(map[key].jam)){ const idx=cleaned.findIndex(x=>x.tanggalNorm===r.tanggalNorm && normNama(x.nama)===normNama(r.nama)); if(idx>=0) cleaned[idx]=r; map[key]=r; } }
  });
  const removed=before-cleaned.length;
  if(removed===0){ toast('✅ Tidak ada dobel di '+tgl); return; }

function parsePlan(){
  const txt=document.getElementById('txtPesan').value;
  const aliasMap={'kuncoro budi':'Budi','kuncoro':'Budi','neli':'Nely','nely':'Nely','annisa':'Anisa','aditya zozo':'Aditya'};
  const isValidName=s=>/^[A-Za-z ]{2,30}$/.test(s);
  const daftarValid=new Set(DEFAULT_KARYAWAN.map(k=>k.nama.toLowerCase()));
  let tglPlan=new Date().toISOString().slice(0,10).split('-').reverse().join('-'); // DD-MM-YYYY to YYYY-MM-DD
  tglPlan=new Date().toISOString().slice(0,10);
  let jamVal=3;
  const timeMatch=txt.match(/(\d{1,2})[.:](\d{2})\s*(wib|wita|wit)?/i);
  const jamMatch=txt.match(/(\d+)\s*j\b/i);
  if(jamMatch) jamVal=Number(jamMatch[1]);
  let validNames=[];
  const after=txt.split(/\n/).slice(1).join(',');
  let names=after.split(',').map(s=>s.trim()).filter(Boolean);
  for(let n of names){ let sub=n.split(/\s+/); for(let s of sub){ s=s.trim().replace(/[^A-Za-z]/g,''); if(!s) continue; let low=s.toLowerCase(); if(aliasMap[low]) s=aliasMap[low]; if(isValidName(s)){ s=s.charAt(0).toUpperCase()+s.slice(1).toLowerCase(); let canonical=DEFAULT_KARYAWAN.find(k=>k.nama.toLowerCase()===(aliasMap[low]?aliasMap[low].toLowerCase():low)); if(canonical) s=canonical.nama; if(daftarValid.has(s.toLowerCase())) validNames.push(s); } } }
  validNames=[...new Set(validNames)];
  parsedPesan=validNames.map(nama=>({tanggal:tglPlan,tanggalNorm:tglPlan,nama:nama,jam:jamVal,tul:calcTUL(jamVal)}));
  const prev=document.getElementById('previewPesan'); prev.classList.remove('hidden');
  if(parsedPesan.length===0){ prev.innerHTML='<span class=text-red-600>❌ Tidak ada nama valid.</span>'; return; }

  const baru=checked.filter(nama=> !allData.some(r=> r.tanggalNorm===tglNorm && normNama(r.nama)===normNama(nama)));
  if(baru.length===0){ alert('Semua sudah ada, tidak ada yang baru'); return; }
  const items=baru.map(nama=>({tanggal:tgl.split('-').reverse().join('-'), nama:nama, jam:jam}));
  baru.forEach(nama=>{ allData.push({tanggal:tglNorm,tanggalNorm:tglNorm,nama:nama,jam:jam,tul:calcTUL(jam)}); });
  try{ localStorage.setItem('cache_lembur', JSON.stringify(allData)); }catch{}
  render();
  fetch(getSyncUrl(),{method:'POST', body: JSON.stringify({action:'addBulk', items: items})});
  toast('✅ '+baru.length+' orang disimpan'+(duplikat.length?' ('+duplikat.length+' duplikat dilewati)':''));
}

let pendingMembers=[]; let membersCache=[];

async function fetchMembers(){
  try{
    const res = await jsonp(getSyncUrl()+'?action=listMembers&_='+Date.now());
    if(res && res.ok && Array.isArray(res.members)){
      membersCache=res.members;
      pendingMembers=res.members.filter(m=> (m.status||'').toLowerCase()==='pending');
      return res.members;
    }
  }catch(e){ console.log('fetchMembers error', e); }
  return [];
}
async function approveMemberServer(nama){
  if(!confirm('Approve '+nama+'? Setelah approve, '+nama+' bisa login di HP berbeda tanpa daftar ulang.')) return;

    const res = await jsonp(getSyncUrl()+'?action=approveMember&nama='+encodeURIComponent(nama)+'&_='+Date.now());

    renderApprovalList();

async function rejectMemberServer(nama){
